# Déploie le site (menu + les deux jeux) sur l'hébergement web OVH par
# FTP à chaque poussée sur main — indépendant de GitHub Pages, qui sert
# de second miroir quand il veut bien.
#
# À configurer UNE FOIS dans Settings → Secrets and variables → Actions
# → New repository secret :
#   OVH_FTP_SERVEUR      p. ex. ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_UTILISATEUR  l'identifiant FTP OVH
#   OVH_FTP_MOT_DE_PASSE le mot de passe FTP
# (le job se saute proprement tant que les secrets ne sont pas posés)
name: deploiement-ovh
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    # Pas d'environnement déclaré, et c'est voulu : les secrets OVH sont des
    # secrets DE DÉPÔT (Settings → Secrets and variables → Actions, section
    # « Repository secrets »), donc visibles par tous les jobs. Les secrets
    # d'un ENVIRONNEMENT, eux, n'arrivent que dans les jobs qui déclarent
    # « environment: <nom> » — et cette déclaration ajoute au passage la
    # porte d'approbation de l'environnement, qu'on préfère éviter pour un
    # déploiement qui doit partir tout seul à chaque version.
    env:
      SERVEUR: ${{ secrets.OVH_FTP_SERVEUR }}
    steps:
      # Diagnostic : chaque secret est-il là ? On n'affiche qu'un OUI/NON.
      # Surtout PAS de toJSON(secrets) ici : vider le contexte des secrets
      # fait basculer tout le run en « action_required », GitHub y voyant
      # une tentative d'exfiltration — le run attend alors une approbation
      # manuelle et ne démarre jamais tout seul.
      - name: Les secrets sont-ils là ?
        run: |
          echo "OVH_FTP_SERVEUR      : ${{ secrets.OVH_FTP_SERVEUR != '' && 'OUI' || 'NON' }}"
          echo "OVH_FTP_UTILISATEUR  : ${{ secrets.OVH_FTP_UTILISATEUR != '' && 'OUI' || 'NON' }}"
          echo "OVH_FTP_MOT_DE_PASSE : ${{ secrets.OVH_FTP_MOT_DE_PASSE != '' && 'OUI' || 'NON' }}"
      - name: Secrets présents ?
        if: env.SERVEUR == ''
        run: echo "Secrets OVH absents — déploiement sauté." && exit 0
      - uses: actions/checkout@v4
        if: env.SERVEUR != ''
      - name: Ne garder que le site servi
        if: env.SERVEUR != ''
        run: |
          mkdir -p site/combat site/aquad
          # accueil.html devient la page d'accueil du domaine ; index.html
          # du dépôt, lui, est le panneau de déménagement de GitHub Pages
          cp accueil.html site/index.html
          cp mathshooter.html site/
          cp combat/index.html site/combat/
          cp aquad/index.html site/aquad/
      - name: Déployer par FTP
        if: env.SERVEUR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVEUR }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
          local-dir: site/
          server-dir: www/
