# Déploie le site (menu + les deux jeux) sur l'hébergement web OVH par
# FTP à chaque poussée sur main — indépendant de GitHub Pages, qui sert
# de second miroir quand il veut bien.
#
# À configurer UNE FOIS dans Settings → Secrets and variables → Actions
# → New repository secret :
#   OVH_FTP_SERVEUR      p. ex. ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_UTILISATEUR  l'identifiant FTP OVH
#   OVH_FTP_MOT_DE_PASSE le mot de passe FTP
# (le job se saute proprement tant que les secrets ne sont pas posés)
name: deploiement-ovh
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    # Les secrets vivent dans l'environnement « deply_ovh ». Un job ne
    # CHOISIT pas son environnement à l'exécution : il le déclare ici, et
    # GitHub n'injecte les secrets d'un environnement que dans les jobs qui
    # le nomment. Sans cette ligne, le job ne voit que les secrets du dépôt
    # — aucun ici — d'où le déploiement systématiquement sauté.
    # Le nom doit correspondre AU CARACTÈRE PRÈS : un nom inconnu fait
    # créer un environnement vide, et les secrets seraient de nouveau
    # absents (l'étape de diagnostic ci-dessous le dirait).
    environment: deply_ovh
    env:
      SERVEUR: ${{ secrets.OVH_FTP_SERVEUR }}
    steps:
      # Diagnostic : QUELS noms Actions voit-il ? Les valeurs ne sortent
      # jamais — on ne lit que les clés du JSON, secrets comme variables.
      - name: Noms visibles par Actions
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = sorted(json.loads(os.environ['SECRETS_JSON']).keys())
          v = sorted(json.loads(os.environ['VARS_JSON']).keys())
          print('SECRETS   :', s or '— aucun —')
          print('VARIABLES :', v or '— aucune —')
          for a in ('OVH_FTP_SERVEUR', 'OVH_FTP_UTILISATEUR', 'OVH_FTP_MOT_DE_PASSE'):
              print(f'  {a:22} ->',
                    'secret OK' if a in s else ('rangé en VARIABLE' if a in v else 'INTROUVABLE'))
          PY
      - name: Secrets présents ?
        if: env.SERVEUR == ''
        run: echo "Secrets OVH absents — déploiement sauté." && exit 0
      - uses: actions/checkout@v4
        if: env.SERVEUR != ''
      - name: Ne garder que le site servi
        if: env.SERVEUR != ''
        run: |
          mkdir -p site/combat site/aquad
          # accueil.html devient la page d'accueil du domaine ; index.html
          # du dépôt, lui, est le panneau de déménagement de GitHub Pages
          cp accueil.html site/index.html
          cp mathshooter.html site/
          cp combat/index.html site/combat/
          cp aquad/index.html site/aquad/
      - name: Déployer par FTP
        if: env.SERVEUR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVEUR }}
          username: ${{ secrets.OVH_FTP_UTILISATEUR }}
          password: ${{ secrets.OVH_FTP_MOT_DE_PASSE }}
          local-dir: site/
          server-dir: www/
