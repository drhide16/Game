# Diagnostic temporaire : quels secrets et variables le workflow voit-il ?
# On n'affiche QUE les noms — les valeurs ne sortent jamais du runner, même
# pour les variables (qui ne sont pourtant pas secrètes). À supprimer une
# fois le déploiement OVH réglé.
name: diagnostic-secrets
on:
  workflow_dispatch:

jobs:
  voir:
    runs-on: ubuntu-latest
    steps:
      - name: Noms visibles
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = sorted(json.loads(os.environ['SECRETS_JSON']).keys())
          v = sorted(json.loads(os.environ['VARS_JSON']).keys())
          print('SECRETS (onglet Secrets)   :', s or '— aucun —')
          print('VARIABLES (onglet Variables):', v or '— aucune —')
          attendus = ['OVH_FTP_SERVEUR', 'OVH_FTP_UTILISATEUR', 'OVH_FTP_MOT_DE_PASSE']
          for a in attendus:
              ou = 'secret OK' if a in s else ('rangé en VARIABLE' if a in v else 'INTROUVABLE')
              print(f'  {a:22} -> {ou}')
          PY
