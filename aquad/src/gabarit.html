    margin:0;background:#08222e;color:#d3ecef;
    font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    touch-action:none;position:fixed;inset:0;
  }
  /* le conteneur occupe tout l'écran : Phaser (Scale.FIT) ajuste le canvas
     à la largeur en portrait, à la hauteur en paysage, sans déformation */
  #conteneur{position:fixed;inset:0}
  #conteneur canvas{display:block;margin:0 auto}
  .erreur{color:#e2584d;max-width:640px;text-align:center;padding:20px}

  .rotation{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(27,35,64,.85);border:1px solid #33406e;border-radius:20px;
    padding:8px 16px;font-size:12px;z-index:9;pointer-events:none;display:none;
    animation:disparait 6s forwards;
  }
  @keyframes disparait{0%,70%{opacity:1}100%{opacity:0}}
  @media (orientation:portrait){ body.enjeu .rotation{display:block} }

  /* ── écran-titre ──────────────────────────────────────────── */
  .titre{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 85% at 50% 38%, #10485c 0%, #08222e 58%, #04141c 100%);
    transition:opacity .4s ease, visibility .4s;
  }
  body.enjeu .titre{opacity:0;visibility:hidden;pointer-events:none}
  /* la manette n'apparaît qu'une fois la partie lancée */
  body:not(.enjeu) .manette{display:none}

  .logo{font-family:'Arcade',ui-monospace,monospace;line-height:1.3}
  .logo span{display:block;letter-spacing:.04em}
  .logo .l1{
    font-size:clamp(24px,8.5vw,54px);color:#4dd6c1;
    text-shadow:0 4px 0 #1b6a5f, 0 0 28px rgba(77,214,193,.45);
  }
  .logo .l2{
    font-size:clamp(24px,8.5vw,54px);color:#ff9d2e;margin-top:.34em;
    text-shadow:0 4px 0 #8a4f10, 0 0 28px rgba(255,157,46,.4);
  }
  .presente{font-size:10px;letter-spacing:.34em;color:#6a76a4;margin-top:22px}
  .jeu{
    font-family:'Arcade',ui-monospace,monospace;
    font-size:clamp(14px,4.4vw,24px);color:#aef0e8;margin-top:10px;letter-spacing:.06em;
    text-shadow:0 0 22px rgba(111,214,255,.35);
  }
  .glyphes{margin-top:26px;font-size:19px;letter-spacing:.5em;padding-left:.5em}
  .glyphes i{font-style:normal}
  .glyphes .g1{color:#4dd6c1} .glyphes .g2{color:#e585c8}
  .glyphes .g3{color:#e2584d} .glyphes .g4{color:#6f9bff}

  .demarrer{
    margin-top:30px;font-family:'Arcade',ui-monospace,monospace;
    font-size:clamp(8px,2.4vw,12px);letter-spacing:.06em;line-height:1.7;
    color:#0d1120;background:#4dd6c1;border:0;border-radius:999px;
    padding:15px 24px;cursor:pointer;
    animation:halo 1.7s ease-in-out infinite;
  }
  .aide{margin-top:18px;font-size:9px;letter-spacing:.18em;color:#6a76a4}
  .aide + .aide{margin-top:5px;color:#4dd6c1}
  .choix-diff{margin-top:14px;display:flex;gap:8px}
  .choix-diff button{
    font-family:'Arcade',ui-monospace,monospace;font-size:8px;letter-spacing:.05em;
    color:#6a76a4;background:rgba(27,35,64,.5);border:1px solid #33406e;border-radius:999px;
    padding:9px 13px;cursor:pointer;
  }
  .choix-diff button.choisi{color:#0d1120;background:#ffd166;border-color:#ffd166}
  .record{margin-top:8px;font-size:10px;letter-spacing:.2em;color:#ffd98a;min-height:13px}
  /* discret, mais toujours lisible : c'est ce qu'on se dit au téléphone
     pour vérifier qu'on parle bien de la même version */
  .version{
    position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));
    left:0;right:0;text-align:center;
    font-size:9px;letter-spacing:.16em;color:#3f4870;
  }
  .demarrer:active{transform:translateY(3px)}

  /* coupe-son : au-dessus de l'écran-titre, donc toujours atteignable */
  .son{
    position:fixed;z-index:21;
    top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:38px;height:38px;border-radius:50%;
    background:rgba(27,35,64,.55);border:1px solid rgba(203,213,240,.25);
    backdrop-filter:blur(3px);color:#cbd5f0;
    font:15px/1 ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .son.coupe{color:#4a5478;border-color:rgba(203,213,240,.12)}
  @keyframes halo{
    0%,100%{box-shadow:0 5px 0 #26857a, 0 0 10px rgba(77,214,193,.2)}
    50%    {box-shadow:0 5px 0 #26857a, 0 0 32px rgba(77,214,193,.6)}
  }

  /* ── manette : superposée en bas de l'écran, pouces de chaque côté ── */
  .manette{
    position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-left:calc(18px + env(safe-area-inset-left));
    padding-right:calc(18px + env(safe-area-inset-right));
    pointer-events:none;z-index:5;
  }
  .manette > *{pointer-events:auto}

  .socle{
    position:relative;width:138px;height:138px;border-radius:50%;
    background:rgba(27,35,64,.5);border:1px solid rgba(77,214,193,.35);
    backdrop-filter:blur(3px);touch-action:none;
  }
  .socle::before,.socle::after{
    content:'';position:absolute;top:50%;width:9px;height:9px;
    border-top:2px solid rgba(203,213,240,.3);border-right:2px solid rgba(203,213,240,.3);
  }
  .socle::before{left:12px;transform:translateY(-50%) rotate(-135deg)}
  .socle::after{right:12px;transform:translateY(-50%) rotate(45deg)}
  /* vue de dessus : les quatre directions comptent */
  .socle .fl{
    position:absolute;left:50%;width:9px;height:9px;
    border-top:2px solid rgba(203,213,240,.3);border-right:2px solid rgba(203,213,240,.3);
  }
  .socle .fl.h{top:12px;transform:translateX(-50%) rotate(-45deg)}
  .socle .fl.b{bottom:12px;transform:translateX(-50%) rotate(135deg)}
  .pouce{
    position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
    border-radius:50%;background:rgba(77,214,193,.28);border:2px solid #4dd6c1;
    transition:background .1s;
  }
  .socle.actif .pouce{background:rgba(77,214,193,.5)}

  .pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:2px}
  .pad button{
    grid-area:var(--case);
    width:60px;height:60px;border-radius:50%;
    background:rgba(27,35,64,.55);border:2px solid currentColor;
    backdrop-filter:blur(3px);color:#8d9ac4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:inherit;line-height:1;touch-action:none;cursor:pointer;
  }
  .pad button .signe{font-size:22px}
  /* 7px : « RETOURNÉ » est le plus long des quatre et doit tenir dans le rond */
  .pad button .nom{font-size:7px;letter-spacing:.03em;margin-top:3px;color:rgba(203,213,240,.65)}
  .pad button:active{background:rgba(77,90,150,.8)}
  /* △ est le bouton arme : il s'allume dès qu'on ramasse un bracelet */
  .b-triangle{--case:1/2/2/3;color:#4dd6c1}
  .b-triangle.armee{color:#c46bff;background:rgba(60,26,86,.6);box-shadow:0 0 16px rgba(196,107,255,.45)}
  .b-triangle.armee .nom{color:rgba(233,182,255,.9)}
  /* bracelet vide : l'appui éjecte le segment usé, le bouton vire à l'orange */
  .b-triangle.armee.vide{color:#ff9d2e;background:rgba(86,50,16,.6);box-shadow:0 0 16px rgba(255,157,46,.5)}
  .b-triangle.armee.vide .nom{color:rgba(255,220,170,.95)}
  .b-rond    {--case:2/3/3/4;color:#e2584d}
  /* ✕ passe en LANCER quand on porte quelque chose */
  .b-croix   {--case:3/2/4/3;color:#6f9bff}
  .b-croix.porte{color:#ffd166;background:rgba(86,70,16,.55);box-shadow:0 0 16px rgba(255,209,102,.45)}
  .b-carre   {--case:2/1/3/2;color:#e585c8}

  @media (max-height:430px){
    .socle{width:112px;height:112px}
    .pouce{width:50px;height:50px;margin:-25px 0 0 -25px}
    .pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
    .pad button{width:52px;height:52px}
    /* en paysage sur téléphone la hauteur manque : on resserre le titre */
    .logo .l1,.logo .l2{font-size:clamp(18px,4.6vw,32px)}
    .presente{margin-top:12px}
    .jeu{margin-top:6px}
    .glyphes{margin-top:12px;font-size:15px}
    .aide{margin-top:10px}
    .choix-diff{margin-top:8px}
    .choix-diff button{padding:7px 10px}
    .record{margin-top:5px}
    .demarrer{margin-top:12px;padding:11px 20px}
  }
</style>
</head>
<body>
<div id="conteneur"></div>
<div class="rotation">↻ Tourne l'écran, le jeu est plus large que haut</div>

<div class="titre" id="titre">
  <div class="logo"><span class="l1">MARTIN</span><span class="l2">GAMES</span></div>
  <div class="presente">PRÉSENTE</div>
  <div class="jeu">AQUAD</div>
  <div class="glyphes"><i class="g1">△</i><i class="g2">□</i><i class="g3">○</i><i class="g4">✕</i></div>
  <div class="aide">✕ SOULÈVE PIERRES ET CAISSES · PUIS LANCE</div>
  <div class="aide">TIENS UN COUP APPUYÉ → ÉLASTIQUE</div>
  <div class="choix-diff" id="choixDiff">
    <button data-d="facile">FACILE</button><button data-d="moyen">MOYEN</button><button data-d="difficile">DIFFICILE</button>
  </div>
  <div class="record" id="record"></div>
  <button class="demarrer" id="demarrer">APPUIE POUR<br>COMMENCER</button>
  <div class="version" id="version"></div>
</div>

<button class="son" id="son" title="Couper le son">♪</button>

<div class="manette">
  <div class="socle" id="socle">
    <i class="fl h"></i><i class="fl b"></i>
    <div class="pouce" id="pouce"></div>
  </div>
  <div class="pad">
    <button class="b-triangle" data-action="arme"><span class="signe">△</span><span class="nom">ARME</span></button>
    <button class="b-carre"    data-action="poing"><span class="signe">□</span><span class="nom">POING</span></button>
    <button class="b-rond"     data-action="pied"><span class="signe">○</span><span class="nom">PIED</span></button>
    <button class="b-croix"    data-action="action"><span class="signe">✕</span><span class="nom">SOULEVER</span></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
// l'écran-titre recouvre le canvas : le message d'erreur doit s'afficher
// dedans, sinon on ne verrait qu'un bouton qui ne lance rien
if (typeof Phaser === 'undefined'){
  document.getElementById('demarrer').outerHTML =
    '<p class="erreur">Phaser n\'a pas pu être chargé depuis le CDN. Vérifie ta connexion, ' +
    'ou télécharge phaser.min.js en local et change la balise script.</p>';
}
</script>

<script>
// @JEU@
</script>
</body>
</html>
