    touch-action:none;position:fixed;inset:0;
  }
  /* le conteneur occupe tout l'écran : Phaser (Scale.FIT) ajuste le canvas
     à la largeur en portrait, à la hauteur en paysage, sans déformation */
  #conteneur{position:fixed;inset:0}
  #conteneur canvas{display:block;margin:0 auto}
  .erreur{color:#e2584d;max-width:640px;text-align:center;padding:20px}

  .rotation{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(27,35,64,.85);border:1px solid #33406e;border-radius:20px;
    padding:8px 16px;font-size:12px;z-index:9;pointer-events:none;display:none;

  }

  /* ── écran-titre ──────────────────────────────────────────── */
  .titre{
    position:fixed;inset:0;z-index:20;

    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));

  }
  body.enjeu .titre{opacity:0;visibility:hidden;pointer-events:none}

  body:not(.enjeu) .manette{display:none}

  .logo{font-family:'Arcade',ui-monospace,monospace;line-height:1.3}

     pour vérifier qu'on parle bien de la même version */
  .version{
    position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));

  }

  /* coupe-son : au-dessus de l'écran-titre, donc toujours atteignable */

    position:fixed;z-index:21;

// ═══════════════ src/version.js ═══════════════
// ─────────────────────────────────────────────────────────────
// VERSION ET CACHE
// Le numéro est affiché sur l'écran-titre : il suffit de le lire pour
// savoir ce qu'on a sous les yeux. Au chargement on redemande la page
// au serveur sans passer par le cache ; si elle annonce une version
// plus récente, on se recharge sur une URL neuve — un simple reload()
// pourrait resservir la copie en cache, une URL jamais vue non.
// ─────────────────────────────────────────────────────────────
const VERSION = '12';

(function verifierVersion(){
  if (location.protocol === 'file:' || typeof fetch !== 'function') return;
  let tentee = null;
  try { tentee = sessionStorage.getItem('aquad-version-tentee'); } catch (e) {}
  fetch(location.pathname + '?cb=' + Date.now(), { cache:'no-store' })
    .then(r => r.ok ? r.text() : null)
    .then(txt => {
      if (!txt) return;
      const m = txt.match(/const VERSION = '([^']+)'/);
      if (!m) return;
      if (m[1] === VERSION){
        try { sessionStorage.removeItem('aquad-version-tentee'); } catch (e) {}
        return;
      }
      if (tentee === m[1]) return;   // déjà tenté pour cette version : on n'insiste pas
      try { sessionStorage.setItem('aquad-version-tentee', m[1]); } catch (e) {}
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    })
    .catch(() => {});   // hors ligne : on joue la version en place
})();

(function afficherVersion(){
  const el = document.getElementById('version');
  if (el) el.textContent = 'v' + VERSION;
})();

let GRAINE = (Math.random() * 1e9) | 0;
function generateur(s){
  return function(){
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// LES ZONES
// Chaque zone est une île : un rectangle de terre cerné d'eau. On en
// sort par le ponton, à l'est, une fois le boss à terre.
// largeur/hauteur = la TERRE ; l'eau fait le tour par-dessus.
// ─────────────────────────────────────────────────────────────
// Chaque zone est un CHEMIN de disques de terre qui serpente d'ouest en
// est à travers l'eau : noeuds étroits (le sentier), et quelques nœuds
// larges — les PRAIRIES — où grouillent monstres et caisses. Le boss et
// le ponton attendent au dernier nœud. largeur/hauteur = le couloir dans
// lequel le chemin a le droit de serpenter.

    noeuds:9, prairies:2,

    caisses:5, pierres:6, monstres:9,
    teinte:{ herbe:0x7fb35e, herbeSombre:0x639446, herbeClaire:0x8fc46e, sable:0xe8d49a } },
  { nom:'LE LAGON', sous:'les eaux troubles', largeur:2800, hauteur:1400,

// Ce qu'on emporte d'une zone à l'autre. Vit en dehors de la scène,
// puisque changer de zone relance la scène.
let PARTIE = null;
function nouvellePartieEtat(){
  const D = DIFFICULTES[DIFFICULTE_CHOISIE] || DIFFICULTES.moyen;
  return { niveau:0, pv:CFG.pvJoueur, vies:D.vies, difficulte:DIFFICULTE_CHOISIE,
           arme:null, munitions:0, segments:0, vaincus:0, morts:0 };
}
PARTIE = nouvellePartieEtat();

// ─────────────────────────────────────────────────────────────
// RECORD
// ─────────────────────────────────────────────────────────────
const CLE_RECORD = 'martin-games-aquad';
function lireRecord(){
  try {
    const r = JSON.parse(localStorage.getItem(CLE_RECORD));
    if (r && typeof r.monstres === 'number') return { monstres:r.monstres|0, etage:r.etage|0 };
  } catch (e) { /* navigation privée : on joue sans record */ }
  return { monstres:0, etage:0 };
}
function ecrireRecord(r){
  try { localStorage.setItem(CLE_RECORD, JSON.stringify(r)); } catch (e) {}
}
function afficherRecord(){
  const r = lireRecord(), el = document.getElementById('record');
  if (el) el.textContent = (r.monstres || r.etage)
    ? 'RECORD  ' + r.monstres + ' MONSTRES  ·  ' + NIVEAUX[Math.min(r.etage, NIVEAUX.length-1)].nom : '';
}
afficherRecord();

// ═══════════════ src/son.js ═══════════════
// ─────────────────────────────────────────────────────────────
// SON
// Tout est synthétisé à la volée : aucun fichier à charger, donc le
// jeu tient toujours en un seul fichier. iOS n'autorise l'audio qu'après
// un geste — d'où le démarrage au moment où on lance la partie.
// ─────────────────────────────────────────────────────────────
const SON = {
  ctx:null, sortie:null, actif:true,
  demarrer(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.sortie = this.ctx.createGain();
    this.sortie.gain.value = 0.26;
    this.sortie.connect(this.ctx.destination);
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  note(forme, f0, f1, duree, vol, delai){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime + (delai || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = forme;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + duree);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g); g.connect(this.sortie);
    o.start(t); o.stop(t + duree + 0.03);
  },
  souffle(duree, vol, freq, q){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * duree));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.sortie);
    s.start(t);
  },
  jouer(nom){
    if (!this.ctx || !this.actif) return;
    switch (nom){
      case 'poing':    this.souffle(0.09, 0.45, 900, 1.2); this.note('sine', 180, 90, 0.09, 0.22); break;
      case 'pied':     this.souffle(0.16, 0.5, 520, 1.0);  this.note('sine', 150, 60, 0.16, 0.26); break;
      case 'retourne': this.souffle(0.28, 0.4, 380, 0.8);  this.note('triangle', 230, 70, 0.3, 0.24); break;
      case 'laser':    this.note('sawtooth', 1500, 190, 0.3, 0.3); this.note('square', 720, 95, 0.3, 0.14); break;

      case 'unevie':   [392,523,659,784,1047].forEach((f,i) => this.note('triangle', f, f, 0.16, 0.22, i*0.07)); break;
      case 'recharge': this.note('square', 500, 500, 0.05, 0.16); this.note('square', 950, 950, 0.06, 0.2, 0.08); break;

                       this.souffle(0.6, 0.12, 200, 0.5); break;
      case 'final':    [523,659,784,1047,1319].forEach((f,i) => this.note('square', f, f, 0.28, 0.22, i*0.16)); break;
    }
  },
};

// ═══════════════ src/entrees.js ═══════════════
// ─────────────────────────────────────────────────────────────
// ZOOM
// iOS ignore user-scalable=no depuis iOS 10, et touch-action n'a été
// suivi qu'à partir de Safari 13. On coupe donc aussi à la main les
// deux gestes qui zooment : le double-tap et le pincement.
// ─────────────────────────────────────────────────────────────
for (const ev of ['gesturestart','gesturechange','gestureend'])
  addEventListener(ev, e => e.preventDefault(), { passive:false });

let dernierTap = 0;
addEventListener('touchend', e => {
  if (e.timeStamp - dernierTap < 350) e.preventDefault();
  dernierTap = e.timeStamp;
}, { passive:false });

addEventListener('dblclick', e => e.preventDefault(), { passive:false });

// ─────────────────────────────────────────────────────────────
// MANETTE TACTILE
// Vue de dessus : le joystick pilote les DEUX axes. ✕ soulève une
// pierre ou une caisse, puis la lance. △ tire l'arme en cours.
// Un coup (□ ○) se CHARGE tant que son bouton est tenu, et part au
// relâché : bref = normal, tenu = élastique (s'il reste de l'endurance).
// ─────────────────────────────────────────────────────────────
const ENTREE = {
  axeX:0, axeY:0,
  actionPresse:false, armePresse:false,
  chargeAction:null, chargeDebut:0, relache:null,
  validePresse:false,
};

const socle = document.getElementById('socle');
const pouce = document.getElementById('pouce');
let pointeurJoystick = null;

function majJoystick(e){
  const r = socle.getBoundingClientRect();
  const rayon = r.width / 2;
  let dx = e.clientX - (r.left + rayon);
  let dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  const limite = rayon - 12;
  if (d > limite){ dx *= limite / d; dy *= limite / d; }
  pouce.style.transform = `translate(${dx}px, ${dy}px)`;

  // zone morte RADIALE, puis on réétale [zoneMorte, 1] sur [0, 1] : la
  // vitesse part de zéro dans toutes les directions, sans saut
  const nx = dx / limite, ny = dy / limite;
  const n = Math.hypot(nx, ny);
  if (n < CFG.zoneMorte){ ENTREE.axeX = 0; ENTREE.axeY = 0; return; }
  const k = Math.min(1, (n - CFG.zoneMorte) / (1 - CFG.zoneMorte)) / n;
  ENTREE.axeX = nx * k;
  ENTREE.axeY = ny * k;
}
function relacherJoystick(){
  pointeurJoystick = null;
  ENTREE.axeX = 0; ENTREE.axeY = 0;
  pouce.style.transform = 'translate(0,0)';
  socle.classList.remove('actif');
}

// la capture de pointeur est un confort, pas une condition : si elle
// échoue, il ne faut surtout pas que l'appui soit perdu avec elle
function capturer(el, id){ try { el.setPointerCapture(id); } catch (e) {} }

socle.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointeurJoystick = e.pointerId;
  capturer(socle, e.pointerId);
  socle.classList.add('actif');
  majJoystick(e);
});
socle.addEventListener('pointermove', e => { if (e.pointerId === pointeurJoystick) majJoystick(e); });
for (const ev of ['pointerup','pointercancel','lostpointercapture'])
  socle.addEventListener(ev, e => { if (e.pointerId === pointeurJoystick) relacherJoystick(); });

for (const b of document.querySelectorAll('.pad button')){
  const a = b.dataset.action;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    capturer(b, e.pointerId);
    if (a === 'action') ENTREE.actionPresse = true;
    else if (a === 'arme') ENTREE.armePresse = true;   // l'arme part à l'appui, pas de charge
    else { ENTREE.chargeAction = a; ENTREE.chargeDebut = performance.now(); }
    ENTREE.validePresse = true;   // n'importe quel bouton relance après une mort
  });
  const fin = () => {
    if (a === 'action' || a === 'arme') return;
    if (ENTREE.chargeAction === a){
      ENTREE.relache = { action:a, duree:(performance.now() - ENTREE.chargeDebut)/1000, quand:performance.now() };
      ENTREE.chargeAction = null;
    }
  };
  for (const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev, fin);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// le bouton △ affiche l'arme en cours et ses munitions
const boutonArme = document.querySelector('.b-triangle');
function majBoutonArme(arme, munitions, segments){
  const signe = boutonArme.querySelector('.signe');
  const nom   = boutonArme.querySelector('.nom');
  boutonArme.classList.toggle('armee', !!arme);
  boutonArme.classList.toggle('vide', !!arme && munitions <= 0);
  if (arme && munitions <= 0){
    signe.textContent = '↻';
    nom.textContent = 'RECHARGE';
  } else if (arme){
    signe.textContent = '✦';
    nom.textContent = ARMES[arme].nom + ' ' + munitions + (segments > 0 ? '·' + segments : '');
  } else {
    signe.textContent = '△';
    nom.textContent = 'ARME';
  }
}

// le bouton ✕ dit ce qu'il fera : soulever, ou lancer ce qu'on porte
const boutonAction = document.querySelector('.b-croix');
function majBoutonAction(porte){
  boutonAction.querySelector('.nom').textContent = porte ? 'LANCER' : 'SOULEVER';
  boutonAction.classList.toggle('porte', !!porte);
}

const boutonSon = document.getElementById('son');
boutonSon.addEventListener('pointerdown', e => {
  e.preventDefault();
  SON.actif = !SON.actif;
  boutonSon.classList.toggle('coupe', !SON.actif);
  boutonSon.textContent = SON.actif ? '♪' : '✕';
  if (SON.actif) SON.jouer('coeur');
});

// clavier de secours pour tester sur un ordinateur
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  { ENTREE.axeX = -1; e.preventDefault(); }
  if (e.code === 'ArrowRight') { ENTREE.axeX =  1; e.preventDefault(); }
  if (e.code === 'ArrowUp')    { ENTREE.axeY = -1; e.preventDefault(); }
  if (e.code === 'ArrowDown')  { ENTREE.axeY =  1; e.preventDefault(); }
  if (e.code === 'Space' && !e.repeat){
    ENTREE.actionPresse = true; ENTREE.validePresse = true; e.preventDefault();
  }
  if (e.code === 'KeyE' && !e.repeat){
    ENTREE.armePresse = true; ENTREE.validePresse = true;
  }
  const touches = { KeyA:'poing', KeyZ:'pied' };
  if (touches[e.code] && !e.repeat){
    ENTREE.chargeAction = touches[e.code]; ENTREE.chargeDebut = performance.now();
    ENTREE.validePresse = true;
  }
});
addEventListener('keyup', e => {
  if ((e.code === 'ArrowLeft' && ENTREE.axeX < 0) || (e.code === 'ArrowRight' && ENTREE.axeX > 0)) ENTREE.axeX = 0;
  if ((e.code === 'ArrowUp' && ENTREE.axeY < 0) || (e.code === 'ArrowDown' && ENTREE.axeY > 0)) ENTREE.axeY = 0;
  const touches = { KeyA:'poing', KeyZ:'pied' };
  if (touches[e.code] && ENTREE.chargeAction === touches[e.code]){
    ENTREE.relache = { action:touches[e.code], duree:(performance.now() - ENTREE.chargeDebut)/1000, quand:performance.now() };
    ENTREE.chargeAction = null;
  }
});

// ═══════════════ src/moteur.js ═══════════════
// ─────────────────────────────────────────────────────────────
// SCÈNE — vue de dessus
// L'île est un rectangle de terre cerné d'eau ; la caméra suit sur les
// deux axes. L'état du joueur vit dans UN objet (this.joueurs[0]) :
// c'est la fondation du multijoueur à venir.
// ─────────────────────────────────────────────────────────────
const MARGE_EAU = 260;   // l'eau visible autour de l'île

// ─────────────────────────────────────────────────────────────
// PROJECTION ISOMÉTRIQUE
// La simulation vit en coordonnées MONDE (un rectangle plat : physique,
// collisions, aimantation inchangées). Seul le rendu projette en losange :
// px = (x − y)·0.707, py = (x + y)·0.354 — soit rotation 45° + écrasement
// vertical de moitié. Le sol se dessine à travers cette transformation ;
// les personnages restent debout (billboards) aux positions projetées.
// ─────────────────────────────────────────────────────────────
const ISO_C = 0.7071, ISO_S = 0.3536;

class Aquad extends Phaser.Scene {
  constructor(){ super('aquad'); }

  preload(){
    // l'atlas du héros vient d'une donnée base64 : le Loader sait la
    // charger, et create() n'est appelé qu'une fois la texture prête.
    // Aux zones suivantes (scene.restart) elle est déjà là.
    if (!this.textures.exists('persoAtlas'))
      this.load.image('persoAtlas', ATLAS_PERSO);
  }

  iso(x, y){ return { x: (x - y) * ISO_C, y: (x + y) * ISO_S }; }
  // l'inverse : d'un vecteur écran vers un vecteur monde (pour le joystick)
  isoInv(px, py){ return { x: px / (2*ISO_C) + py / (2*ISO_S), y: -px / (2*ISO_C) + py / (2*ISO_S) }; }

  // ── le chemin de terre : une chaîne de disques qui serpente ──
  // Généré par la graine : mourir et réapparaître ne redessine pas la
  // carte. Chaque disque chevauche le suivant — le chemin est marchable
  // de bout en bout — et quelques nœuds larges font les prairies.
  construireChemin(){
    const n = this.def.noeuds || 9;
    const yMin = MARGE_EAU + 170, yMax = MARGE_EAU + this.def.hauteur - 170;
    // les prairies : réparties dans le ventre du chemin, jamais aux bouts
    const prairies = new Set();
    const nb = this.def.prairies || 2;
    for (let k = 0; k < nb; k++)
      prairies.add(1 + Math.floor((k + 0.5) * (n - 2) / nb));
    this.noeuds = [];
    let x = MARGE_EAU + 200;
    let y = MARGE_EAU + this.def.hauteur / 2;
    let angle = 0, rPrec = 0;
    for (let i = 0; i < n; i++){
      const prairie = prairies.has(i);
      const r = prairie ? 240 + this.alea() * 70 : 120 + this.alea() * 40;
      if (i > 0){
        // cap globalement vers l'est, avec un méandre borné ; le pas
        // garantit le chevauchement des disques voisins
        angle = Phaser.Math.Clamp(angle + (this.alea() * 2 - 1) * 0.85, -1.1, 1.1);
        const pas = (rPrec + r) * 0.75;
        x += Math.cos(angle) * pas;
        y = Phaser.Math.Clamp(y + Math.sin(angle) * pas, yMin, yMax);
      }
      this.noeuds.push({ x, y, r, prairie });
      rPrec = r;
    }
    this.depart = this.noeuds[0];
    this.arrivee = this.noeuds[this.noeuds.length - 1];
  }
  surTerre(x, y, marge){
    marge = marge || 0;
    return this.noeuds.some(nd => Math.hypot(x - nd.x, y - nd.y) < nd.r - marge);
  }
  // hors de la terre ? on reprojette le corps sur le bord du disque le
  // plus proche, en GARDANT la vitesse : on glisse le long de la côte
  contenir(go, marge){
    if (this.surTerre(go.x, go.y, marge)) return;
    let meilleur = null, moinsLoin = Infinity;
    for (const nd of this.noeuds){
      const d = Math.hypot(go.x - nd.x, go.y - nd.y) - (nd.r - marge);
      if (d < moinsLoin){ moinsLoin = d; meilleur = nd; }
    }
    const d = Math.hypot(go.x - meilleur.x, go.y - meilleur.y) || 1;
    const k = (meilleur.r - marge) / d;
    const nx = meilleur.x + (go.x - meilleur.x) * k;
    const ny = meilleur.y + (go.y - meilleur.y) * k;
    go.body.position.x += nx - go.x;
    go.body.position.y += ny - go.y;
  }

  create(){
    this.def = NIVEAUX[Math.min(PARTIE.niveau, NIVEAUX.length - 1)];
    this.D = DIFFICULTES[PARTIE.difficulte] || DIFFICULTES.moyen;
    this.alea = generateur(GRAINE + PARTIE.niveau * 7919);
    this.construireChemin();

    // l'enveloppe : la boîte englobante des disques, avec l'eau autour
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (const nd of this.noeuds){
      bx0 = Math.min(bx0, nd.x - nd.r); by0 = Math.min(by0, nd.y - nd.r);
      bx1 = Math.max(bx1, nd.x + nd.r); by1 = Math.max(by1, nd.y + nd.r);
    }
    this.ileX = bx0; this.ileY = by0;
    this.ileL = bx1 - bx0; this.ileH = by1 - by0;
    const mondeL = this.ileL + MARGE_EAU*2, mondeH = this.ileH + MARGE_EAU*2;

    this.etat = 'jeu';
    this.vaincus = PARTIE.vaincus; this.morts = PARTIE.morts;
    this.eclats = []; this.objets = []; this.caisses = [];
    this.tirs = []; this.tirsEnnemis = [];
    this.bulles = []; this.bulleSuiv = 0;
    this.msg = null; this.transition = 0;
    this.monstres = []; this.decors = []; this.pierres = [];

    // les limites physiques sont larges : le confinement fin sur la
    // terre, c'est contenir() qui le fait disque par disque
    this.physics.world.setBounds(this.ileX - 60, this.ileY - 60, this.ileL + 120, this.ileH + 120);
    // la caméra vit en espace ÉCRAN : les bornes sont la projection de
    // l'enveloppe (eau comprise)
    const wx0 = this.ileX - MARGE_EAU, wy0 = this.ileY - MARGE_EAU;
    const wx1 = this.ileX + this.ileL + MARGE_EAU, wy1 = this.ileY + this.ileH + MARGE_EAU;
    this.cameras.main.setBounds(
      (wx0 - wy1) * ISO_C, (wx0 + wy0) * ISO_S,
      (wx1 - wy0) * ISO_C - (wx0 - wy1) * ISO_C,
      (wx1 + wy1) * ISO_S - (wx0 + wy0) * ISO_S);

    this.gSol    = this.add.graphics().setDepth(-10);   // eau et terre, en coordonnées monde
    this.gSortie = this.add.graphics().setDepth(-4);
    this.gVisee  = this.add.graphics().setDepth(-3);    // arc de visée et anneau de cible, au sol
    this.cibleVisee = null;
    this.grObstacles = this.add.group();

    // ── l'entité joueur ──
    const j = {
      go: this.add.rectangle(this.depart.x, this.depart.y, 26, 24, 0xffffff, 0),
      fx: 1, fy: 0,                 // direction regardée (normalisée)
      phase: 0,
      pv: PARTIE.pv, invuln: CFG.invulnRenais,
      arme: PARTIE.arme, munitions: PARTIE.munitions, segments: PARTIE.segments | 0,
      endurance: CFG.enduranceMax,
      attaque: null, charge: null, chargeAIgnorer: null,
      porte: null,                  // la pierre ou la caisse au-dessus de la tête
      g: this.add.graphics(),       // ombre, objet porté, lueur — trié par y
      spr: null,                    // le corps : une frame de l'atlas pixel-art
    };
    // les frames de l'atlas, déclarées une seule fois (la texture
    // survit aux restarts), puis l'image du héros et un petit pool de
    // boules de feu pour les balles des armes
    const texPerso = this.textures.get('persoAtlas');
    texPerso.setFilter(Phaser.Textures.FilterMode.NEAREST);
    for (const anim in CADRES_PERSO)
      CADRES_PERSO[anim].forEach((c, i) => {
        if (!texPerso.has(anim + i)) texPerso.add(anim + i, 0, c.x, c.y, c.w, c.h);
      });
    j.spr = this.add.image(0, 0, 'persoAtlas', 'profil-marche0');
    this.imgTirs = [];
    for (let i = 0; i < 10; i++)
      this.imgTirs.push(this.add.image(0, 0, 'persoAtlas', 'boule0')
        .setDepth(4200).setVisible(false).setScale(0.55));
    this.physics.add.existing(j.go);
    j.go.body.setCollideWorldBounds(true);
    this.joueurs = [j];
    this.checkpoint = { x: j.go.x, y: j.go.y };
    this.astuceEndurance = false;
    majBoutonArme(j.arme, j.munitions, j.segments);
    majBoutonAction(false);

    this.construireZone();
    this.physics.add.collider(j.go, this.grObstacles);

    this.gObjets = this.add.graphics().setDepth(4000);
    this.gEclats = this.add.graphics().setDepth(4100);
    this.gTirs   = this.add.graphics().setDepth(4200);
    this.gCoup   = this.add.graphics().setDepth(4050);

    for (let i = 0; i < 8; i++){
      const t = this.add.text(0, 0, '', { fontFamily:'Arcade, ui-monospace, monospace', fontSize:'18px', color:'#ffffff' })
        .setStroke('#0d1120', 6).setOrigin(0.5).setDepth(5000).setVisible(false);
      this.bulles.push({ t, vie:0, max:1, vy:0 });
    }

    // la caméra suit un fantôme placé à la PROJECTION du joueur
    const p0 = this.iso(j.go.x, j.go.y);
    this.suiveur = this.add.rectangle(p0.x, p0.y, 1, 1, 0xffffff, 0);
    this.cameras.main.startFollow(this.suiveur, true, 0.12, 0.12);

    this.hud = this.add.graphics().setScrollFactor(0).setDepth(9000);
    const style = f => ({ fontFamily:'ui-monospace, Menlo, monospace', fontSize:f, color:'#eaf4f0' });
    this.hudTexte = this.add.text(22, 60, '', style('12px'))
      .setStroke('#0d3040', 3).setScrollFactor(0).setDepth(9000);
    this.hudMsg = this.add.text(L/2, 96, '', { ...style('13px'), color:'#ffd98a' })
      .setStroke('#0d3040', 4).setOrigin(0.5).setScrollFactor(0).setDepth(9001).setAlpha(0);
    this.hudBoss = this.add.text(L/2, H - 48, '', { ...style('11px'), color:'#ffb0a8' })
      .setStroke('#0d3040', 3).setOrigin(0.5).setScrollFactor(0).setDepth(9001).setAlpha(0);
    this.hudFin = this.add.text(L/2, H/2 - 30, '', { ...style('18px'), align:'center' })
      .setStroke('#0d3040', 5).setOrigin(0.5).setScrollFactor(0).setDepth(9001);

    this.message(this.def.nom + '  —  ' + this.def.sous);
  }

  // ── construction du chemin ──────────────────────────────────
  poseLibre(marge){
    // un nœud tiré au poids de son aire (les prairies reçoivent plus),
    // puis un point uniforme dans son disque — jamais aux abords du départ
    const poids = this.noeuds.map(nd => nd.r * nd.r);
    const total = poids.reduce((a, b) => a + b, 0);
    for (let e = 0; e < 60; e++){
      let tirage = this.alea() * total, nd = this.noeuds[0];
      for (let i = 0; i < this.noeuds.length; i++){
        tirage -= poids[i];
        if (tirage <= 0){ nd = this.noeuds[i]; break; }
      }
      const libre = Math.max(10, nd.r - marge - 30);
      const a = this.alea() * Math.PI * 2;
      const dist = Math.sqrt(this.alea()) * libre;
      const x = nd.x + Math.cos(a) * dist, y = nd.y + Math.sin(a) * dist;
      if (Math.hypot(x - this.depart.x, y - this.depart.y) < 220) continue;
      if (this.decors.every(d => Math.hypot(x - d.x, y - d.y) > 90)) return { x, y };
    }
    const milieu = this.noeuds[Math.floor(this.noeuds.length / 2)];
    return { x: milieu.x, y: milieu.y };
  }
  creerObstacle(type){
    const p = this.poseLibre(90);
    // le corps ne couvre que le pied : on passe DERRIÈRE la tête du
    // palmier, et le tri par y fait le reste
    const larg = type === 'palmier' ? 18 : 42;
    const haut = type === 'palmier' ? 14 : 30;
    const c = this.add.rectangle(p.x, p.y, larg, haut, 0xffffff, 0);
    this.physics.add.existing(c, true);
    this.grObstacles.add(c);
    const d = { type, x: p.x, y: p.y, g: this.add.graphics().setDepth(this.iso(p.x, p.y).y), phase: this.alea()*6 };
    this.decors.push(d);
    this.dessinerDecor(d);
  }
  creerCaisse(){
    const p = this.poseLibre(70);
    const c = this.add.rectangle(p.x, p.y, 28, 24, 0xffffff, 0);
    this.physics.add.existing(c, true);
    this.grObstacles.add(c);
    this.caisses.push({ go:c, pv:2, flash:0, g: this.add.graphics().setDepth(this.iso(p.x, p.y).y) });
  }
  creerPierre(){
    const p = this.poseLibre(60);
    const c = this.add.rectangle(p.x, p.y, 16, 14, 0xffffff, 0);
    this.physics.add.existing(c, true);
    this.grObstacles.add(c);
    this.pierres.push({ go:c, g: this.add.graphics().setDepth(this.iso(p.x, p.y).y) });
  }
  creerMonstre(type, x, y){
    const d = MONSTRES[type];
    const go = this.add.rectangle(x, y, d.taille[0], d.taille[1], 0xffffff, 0);
    this.physics.add.existing(go);
    go.body.setCollideWorldBounds(true);
    if (!d.flotte) this.physics.add.collider(go, this.grObstacles);
    const pv = Math.max(1, Math.round(d.pv * this.D.pv));
    const m = {
      go, type, def:d, pv, pvMax:pv, assomme:0, flash:0,
      maison:{ x, y }, cible:null, prepare:0, repos:0,
      phase: this.alea()*6, g: this.add.graphics(),
    };
    this.monstres.push(m);
    return m;
  }
  construireZone(){
    let nRochers = 5 + Math.floor(this.alea()*3);
    let nPalmiers = 7 + Math.floor(this.alea()*4);
    for (let i = 0; i < nRochers; i++) this.creerObstacle('rocher');
    for (let i = 0; i < nPalmiers; i++) this.creerObstacle('palmier');
    for (let i = 0; i < this.def.caisses; i++) this.creerCaisse();
    for (let i = 0; i < (this.def.pierres || 0); i++) this.creerPierre();

    let n = Math.round(this.def.monstres * this.D.monstres);
    for (let i = 0; i < n; i++){
      const p = this.poseLibre(80);
      const type = this.def.peuple[Math.floor(this.alea() * this.def.peuple.length)];
      this.creerMonstre(type, p.x, p.y);
    }
    // le boss garde le ponton, au dernier nœud du chemin
    this.boss = this.creerMonstre(this.def.boss, this.arrivee.x - 40, this.arrivee.y);
    this.bossVivant = true;
  }

  // ── combat ──────────────────────────────────────────────────
  // la boîte AU SOL d'une entité : son corps réduit au facteur k. C'est
  // sur elle que se jugent les contacts — elle colle à l'ombre dessinée.
  boiteSol(go, k){
    const b = go.getBounds();
    const rx = b.width * (1 - k) / 2, ry = b.height * (1 - k) / 2;
    return new Phaser.Geom.Rectangle(b.x + rx, b.y + ry, b.width * k, b.height * k);
  }
  // l'ennemi vivant le plus proche à portée ET dans le cône du regard :
  // c'est lui que les coups aimantés iront chercher
  chercherCible(j, portee, cone){
    let cible = null, mieux = portee;
    for (const m of this.monstres){
      if (m.mort) continue;
      const dx = m.go.x - j.go.x, dy = m.go.y - j.go.y;
      const d = Math.hypot(dx, dy);
      if (d >= mieux || d < 1) continue;
      const ecart = Math.abs(Phaser.Math.Angle.Wrap(Math.atan2(dy, dx) - Math.atan2(j.fy, j.fx)));
      if (ecart > cone) continue;
      cible = m; mieux = d;
    }
    return cible;
  }
  aimanter(j, portee, cone){
    const c = this.chercherCible(j, portee, cone);
    if (!c) return;
    const d = Math.hypot(c.go.x - j.go.x, c.go.y - j.go.y) || 1;
    j.fx = (c.go.x - j.go.x) / d;
    j.fy = (c.go.y - j.go.y) / d;
  }
  lancerAttaque(j, type, elastique){
    if (j.attaque) return;
    const c = COUPS[type];
    // aimantation : le coup pivote vers l'ennemi le plus proche du regard.
    // Au corps à corps on retient la cible : la fente (plus bas) fera
    // glisser le corps jusqu'à elle pour que le coup porte vraiment.
    let cible = null;
    if (c.portee && !c.faisceau){
      cible = this.chercherCible(j, CFG.aimantPortee, CFG.aimantCone);
      if (cible){
        const d = Math.hypot(cible.go.x - j.go.x, cible.go.y - j.go.y) || 1;
        j.fx = (cible.go.x - j.go.x) / d;
        j.fy = (cible.go.y - j.go.y) / d;
      }
    } else this.aimanter(j, CFG.aimantPorteeTir, CFG.aimantCone * 0.55);
    // la direction du coup est figée au départ : le faisceau et les
    // balles partent là où on regardait en appuyant
    j.attaque = { type, t:0, fx:j.fx, fy:j.fy, cible,
      elastique: !!elastique && !!c.portee, touches:new Set() };
    if (j.attaque.elastique) this.crier(j.go.x, j.go.y - 40, CRIS.kiai, '#ffd166', 15);
    SON.jouer(c.son);
    if (c.secousse) this.cameras.main.shake(90, c.secousse);
    if (c.tir) this.tirer(j, c);
    if (c.jet) this.ejecterSegment(j, c);
    if (c.elan) j.go.body.setVelocity(j.fx * c.elan, j.fy * c.elan);
  }
  utiliserArme(j){
    if (!j.arme){
      SON.jouer('vide');
      this.message('PAS D\'ARME — CASSE DES CAISSES');
      return;
    }
    if (j.attaque) return;
    if (j.munitions <= 0){ this.lancerAttaque(j, 'jet'); return; }
    j.munitions--;
    this.lancerAttaque(j, j.arme);
    majBoutonArme(j.arme, j.munitions, j.segments);
  }
  ejecterSegment(j, c){
    const a = ARMES[j.arme];
    this.tirs.push({ x:j.go.x + j.fx*16, y:j.go.y + j.fy*16 - 10,
      vx:j.fx*430, vy:j.fy*430,
      degats:c.degats, recul:c.recul,
      couleur:a.couleur, clair:a.clair, jet:true, vie:1.1 });
    if (j.segments > 0){
      j.segments--;
      j.munitions = a.munitions;
      SON.jouer('recharge');
      this.message('SEGMENT NEUF  —  ' + a.nom + ' ×' + j.munitions);
    } else {
      j.arme = null; j.munitions = 0;
      this.message('BRACELET ÉPUISÉ');
    }
    majBoutonArme(j.arme, j.munitions, j.segments);
  }
  tirer(j, c){
    const ang0 = Math.atan2(j.fy, j.fx);
    for (let i = 0; i < c.tir.nb; i++){
      const ang = ang0 + ((c.tir.nb === 1) ? 0 : (i - (c.tir.nb-1)/2) * c.tir.dispersion);
      this.tirs.push({
        x: j.go.x + j.fx*16, y: j.go.y + j.fy*16 - 10,
        vx: Math.cos(ang) * c.tir.vitesse,
        vy: Math.sin(ang) * c.tir.vitesse,
        degats: c.degats, recul: c.recul,
        couleur: ARMES[j.arme] ? ARMES[j.arme].couleur : 0xffd166,
        vie: 1.1,
      });
    }
  }
  zoneAttaque(j){
    const c = COUPS[j.attaque.type];
    if (!c.portee) return null;
    const portee = c.portee * (j.attaque.elastique ? CFG.porteeElastique : 1);
    const cx = j.go.x + j.attaque.fx * (12 + portee/2);
    const cy = j.go.y + j.attaque.fy * (12 + portee/2) - 8;
    return { rect: new Phaser.Geom.Rectangle(cx - portee/2, cy - portee/2, portee, portee) };
  }
  toucheZone(z, limites){
    if (!z) return false;
    return Phaser.Geom.Intersects.RectangleToRectangle(z.rect, limites);
  }
  frapper(m, degats, recul, sourceX, sourceY){
    const d = Math.hypot(m.go.x - sourceX, m.go.y - sourceY) || 1;
    const rx = (m.go.x - sourceX) / d, ry = (m.go.y - sourceY) / d;
    const hautCri = m.go.y - m.def.taille[1]/2 - 18;
    m.pv -= degats; m.flash = 0.14; m.assomme = 0.22; m.prepare = 0;
    m.go.body.setVelocity(rx * recul, ry * recul);
    SON.jouer('touche');
    this.eclat(m.go.x, m.go.y - 10, rx);
    if (m.pv > 0) this.crier(m.go.x, hautCri, CRIS.coup);
    if (m.pv <= 0){
      m.mort = true; this.vaincus++;
      SON.jouer('vaincu');
      this.eclat(m.go.x, m.go.y - 10, rx, m.def.boss ? 34 : 14);
      this.crier(m.go.x, hautCri, m.def.boss ? CRIS.boss : CRIS.vaincu, '#ffd166', m.def.boss ? 26 : 20);
      if (this.alea() < CFG.chanceCoeur || m.def.boss) this.creerObjet(m.go.x - 12, m.go.y, 'coeur');
      if (m.def.boss) this.creerObjet(m.go.x + 14, m.go.y, 'vie');
      m.g.destroy();
      m.go.destroy();
      if (m.def.boss) this.bossVivant = false;
      if (m.def.boss) this.message(m.def.nom + ' EST À TERRE  —  LE PONTON S\'OUVRE');
    }
  }
  casser(k, degats){
    k.pv -= degats; k.flash = 0.12;
    SON.jouer('caisse');
    this.eclat(k.go.x, k.go.y - 6, 1, 5);
    if (k.pv <= 0){
      k.casse = true;
      this.eclat(k.go.x, k.go.y - 6, 1, 16);
      this.crier(k.go.x, k.go.y - 26, CRIS.caisse, '#e8b06a', 15);
      this.creerObjet(k.go.x, k.go.y, this.butin());
      k.g.destroy();
      k.go.destroy();
    }
  }
  butin(){
    const r = this.alea();
    if (r < 0.20) return 'laser';
    if (r < 0.38) return 'pistolet';
    if (r < 0.50) return 'fusil';
    return 'coeur';
  }
  poussiere(x, y){
    for (let i = 0; i < 3; i++)
      this.eclats.push({ x: x + (this.alea()-0.5)*12, y,
        couleur: 0xd8c9a4,
        vx: (this.alea()-0.5)*60, vy: -8 - this.alea()*16,
        vie: 0.32 + this.alea()*0.13, max: 0.45 });
  }
  eclat(x, y, sens, n, couleur){
    n = n || 7;
    for (let i = 0; i < n; i++)
      this.eclats.push({ x, y, couleur: couleur || 0xffb347,
        vx: sens*(60 + this.alea()*160) + (this.alea()-0.5)*140,
        vy: (this.alea()-0.5)*220,
        vie: 0.26 + this.alea()*0.2, max: 0.46 });
  }
  blesser(j, sx, sy, degats){
    if (j.invuln > 0 || this.etat !== 'jeu') return;
    j.pv -= degats;
    j.invuln = CFG.invincibilite;
    // le choc fait lâcher ce qu'on portait : ça se brise à nos pieds
    if (j.porte){
      this.eclat(j.go.x, j.go.y - 20, 1, 10, j.porte.type === 'caisse' ? 0xb07a3e : 0x8a8f9c);
      if (j.porte.type === 'caisse'){
        SON.jouer('caisse');
        this.crier(j.go.x, j.go.y - 44, CRIS.caisse, '#e8b06a', 15);
        this.creerObjet(j.go.x, j.go.y, this.butin());
      }
      j.porte = null;
      majBoutonAction(false);
    }
    const d = Math.hypot(j.go.x - sx, j.go.y - sy) || 1;
    j.go.body.setVelocity((j.go.x - sx)/d * 280, (j.go.y - sy)/d * 280);
    this.cameras.main.shake(140, 0.008);
    SON.jouer('degat');
    this.crier(j.go.x, j.go.y - 34, CRIS.aie, '#ff9d94');
    if (j.pv <= 0){ j.pv = 0; this.terminer('Tu es hors de combat'); }
  }

  // ── objets ──────────────────────────────────────────────────
  creerObjet(x, y, type){
    const o = this.add.rectangle(x, y, 18, 18, 0xffffff, 0);
    this.physics.add.existing(o);
    o.body.setVelocity((this.alea()-0.5)*180, (this.alea()-0.5)*180);
    o.body.setDrag(220, 220);
    o.body.setCollideWorldBounds(true);
    this.objets.push({ go:o, type, phase:this.alea()*6 });
  }
  ramasser(j, o){
    if (o.type === 'vie'){
      if (PARTIE.vies >= 5) return;
      PARTIE.vies++;
      SON.jouer('unevie');
      this.message('+1 VIE');
    } else if (o.type === 'coeur'){
      if (j.pv >= CFG.pvJoueur) return;
      j.pv++;
      SON.jouer('coeur');
      this.message('+1 ♥');
    } else {
      const a = ARMES[o.type];
      if (j.arme === o.type){
        j.segments = Math.min(CFG.segmentsMax, j.segments + CFG.segmentsParBracelet);
        this.message(a.nom + '  —  +' + CFG.segmentsParBracelet + ' SEGMENTS');
      } else {
        j.arme = o.type;
        j.munitions = a.munitions;
        j.segments = CFG.segmentsParBracelet - 1;
        this.message(a.nom + '  —  □ POUR TIRER  ×' + j.munitions);
      }
      majBoutonArme(j.arme, j.munitions, j.segments);
      SON.jouer('arme');
    }
    o.pris = true;
    o.go.destroy();
  }
  message(txt){ this.msg = { t:0 }; this.hudMsg.setText(txt).setAlpha(1); }
  crier(x, y, mots, couleur, taille){
    const b = this.bulles[this.bulleSuiv = (this.bulleSuiv + 1) % this.bulles.length];
    const P = this.iso(x, y);
    b.t.setText(mots[Math.floor(this.alea() * mots.length)])
      .setColor(couleur || '#ffffff').setFontSize(taille || 18)
      .setPosition(P.x, P.y - 20).setAngle((this.alea() * 2 - 1) * 14).setVisible(true);
    b.vie = b.max = 0.55;
    b.vy = -46;
  }

  // ── zones, mort, victoire ───────────────────────────────────
  sauvegarder(){
    const j = this.joueurs[0];
    PARTIE.pv = j.pv; PARTIE.arme = j.arme; PARTIE.munitions = j.munitions;
    PARTIE.segments = j.segments;
    PARTIE.vaincus = this.vaincus; PARTIE.morts = this.morts;
  }
  majRecord(){
    const r = lireRecord();
    const n = { monstres: Math.max(r.monstres, this.vaincus), etage: Math.max(r.etage, PARTIE.niveau) };
    if (n.monstres !== r.monstres || n.etage !== r.etage) ecrireRecord(n);
    return n;
  }
  traverser(){
    if (this.etat !== 'jeu') return;
    const j = this.joueurs[0];
    this.sauvegarder();
    const r = this.majRecord();
    if (PARTIE.niveau >= NIVEAUX.length - 1){
      this.etat = 'fini';
      SON.jouer('final');
      this.hudFin.setText('LE LAGON EST CALME\n' + this.vaincus + ' monstres vaincus'
        + '\nrecord ' + r.monstres + '\n\nun bouton pour rejouer');
      return;
    }
    this.etat = 'traversee';
    this.transition = 0;
    j.attaque = null; j.charge = null; j.porte = null;
    majBoutonAction(false);
    j.go.body.setCollideWorldBounds(false);
    j.go.body.setVelocity(160, 0);        // il s'éloigne sur le ponton
    SON.jouer('ascenseur');
    const suivant = NIVEAUX[PARTIE.niveau + 1];
    this.hudFin.setText('Tu embarques\n\n' + suivant.nom + '\n' + suivant.sous);
  }
  terminer(titre){
    this.mortDebut = this.time.now;   // le sprite joue la chute une fois
    this.morts++;
    PARTIE.vies--;
    SON.jouer('mort');
    this.sauvegarder();
    const r = this.majRecord();
    if (PARTIE.vies <= 0){
      this.etat = 'gameover';
      this.hudFin.setText('GAME OVER\n' + this.vaincus + ' monstres vaincus'
        + '\nrecord ' + r.monstres + '\n\nun bouton pour l\'écran d\'accueil');
      return;
    }
    this.etat = 'perdu';
    this.hudFin.setText(titre + '\n'
      + (PARTIE.vies === 1 ? 'dernière vie' : PARTIE.vies + ' vies restantes')
      + '\n\nun bouton pour repartir d\'ici');
  }
  reapparaitre(){
    const j = this.joueurs[0];
    this.etat = 'jeu';
    this.hudFin.setText('');
    j.pv = CFG.pvJoueur;
    j.invuln = CFG.invulnRenais;
    j.attaque = null; j.charge = null; j.porte = null;
    majBoutonAction(false);
    j.endurance = CFG.enduranceMax;
    j.go.body.reset(this.checkpoint.x, this.checkpoint.y);
    const P = this.iso(this.checkpoint.x, this.checkpoint.y);
    this.suiveur.setPosition(P.x, P.y);
    this.cameras.main.centerOn(P.x, P.y);
    for (const m of this.monstres){
      const d = Math.hypot(m.go.x - this.checkpoint.x, m.go.y - this.checkpoint.y);
      if (d < 180){
        const k = 280 / (d || 1);
        m.go.body.setVelocity((m.go.x - this.checkpoint.x) * k, (m.go.y - this.checkpoint.y) * k);
        m.assomme = 0.6; m.prepare = 0;
      }
    }
  }
  recommencer(){
    GRAINE = (Math.random() * 1e9) | 0;
    PARTIE = nouvellePartieEtat();
    afficherRecord();
    this.scene.restart();
  }

  // ── boucle ──────────────────────────────────────────────────
  update(temps, deltaMs){
    const dt = Math.min(0.033, deltaMs / 1000);
    const j = this.joueurs[0];

    if (this.etat === 'traversee'){
      this.transition += dt;
      if (this.transition > 1.9){
        PARTIE.niveau++;
        this.scene.restart();
        return;
      }
      ENTREE.validePresse = false; ENTREE.relache = null; ENTREE.actionPresse = false; ENTREE.armePresse = false;
      this.majEclats(dt); this.dessinerTout();
      return;
    }
    if (this.etat !== 'jeu'){
      if (ENTREE.validePresse){
        ENTREE.validePresse = false; ENTREE.relache = null; ENTREE.actionPresse = false; ENTREE.armePresse = false;
        if (this.etat === 'perdu') this.reapparaitre();
        else if (this.etat === 'gameover') setTimeout(retourAuTitre, 0);
        else this.recommencer();
        return;
      }
      ENTREE.relache = null; ENTREE.actionPresse = false; ENTREE.armePresse = false;
      this.majEclats(dt); this.dessinerTout();
      return;
    }
    ENTREE.validePresse = false;

    this.majJoueur(j, dt);
    this.majMonstres(dt);
    this.majTirs(dt);
    // personne ne marche sur l'eau : le joueur, les monstres au sol et
    // les objets sont reprojetés sur la terre — sauf les flottants, qui
    // survolent l'eau (c'est leur avantage)
    this.contenir(j.go, 8);
    for (const m of this.monstres) if (!m.def.flotte) this.contenir(m.go, 6);
    for (const o of this.objets) this.contenir(o.go, 0);
    // l'anneau au sol dit qui serait touché si on frappait maintenant —
    // la même recherche que l'aimantation, donc il dit toujours vrai
    this.cibleVisee = this.chercherCible(j, CFG.aimantPortee, CFG.aimantCone);
    for (const k of this.caisses) k.flash = Math.max(0, k.flash - dt);
    this.caisses = this.caisses.filter(k => !k.casse);
    for (const o of this.objets){
      o.phase += dt * 4;
      if (Phaser.Geom.Intersects.RectangleToRectangle(j.go.getBounds(), o.go.getBounds()))
        this.ramasser(j, o);
    }
    this.objets = this.objets.filter(o => !o.pris);

    if (this.msg){
      this.msg.t += dt;
      this.hudMsg.setAlpha(Math.max(0, 1 - this.msg.t / 2.2));
      if (this.msg.t > 2.2) this.msg = null;
    }

    // le ponton : au bout du chemin, une fois le boss à terre
    if (Math.hypot(j.go.x - (this.arrivee.x + this.arrivee.r - 10), j.go.y - this.arrivee.y) < 70){
      if (this.bossVivant){
        if (!this.avertiBoss){
          this.avertiBoss = true;
          this.message(MONSTRES[this.def.boss].nom + ' GARDE LE PONTON');
        }
      } else this.traverser();
    }

    this.majEclats(dt);
    this.dessinerTout();
  }

  majJoueur(j, dt){
    j.invuln = Math.max(0, j.invuln - dt);
    j.endurance = Math.min(CFG.enduranceMax, j.endurance + CFG.enduranceRegen * dt);

    // ── ✕ : soulever ce qui est à portée, ou lancer ce qu'on porte ──
    if (ENTREE.actionPresse){
      ENTREE.actionPresse = false;
      if (!j.attaque){
        if (j.porte) this.lancer(j);
        else this.soulever(j);
      }
    }
    // ── △ : l'arme en cours, dans la direction regardée ──
    if (ENTREE.armePresse){
      ENTREE.armePresse = false;
      if (!j.porte) this.utiliserArme(j);
    }

    // ── coups : appui bref = normal, tenu = élastique ──
    if (ENTREE.relache && performance.now() - ENTREE.relache.quand > 700) ENTREE.relache = null;
    if (j.chargeAIgnorer && ENTREE.relache && ENTREE.relache.action === j.chargeAIgnorer){
      ENTREE.relache = null; j.chargeAIgnorer = null;
    } else if (j.chargeAIgnorer && ENTREE.chargeAction !== j.chargeAIgnorer){
      j.chargeAIgnorer = null;
    }
    if (j.porte){
      // les mains sont prises : pas de coup tant qu'on porte
      ENTREE.relache = null; j.charge = null;
    } else if (!j.attaque){
      if (j.charge){
        j.charge.t = (performance.now() - j.charge.depuis) / 1000;
        const tenu = ENTREE.chargeAction === j.charge.action;
        if (!tenu || j.charge.t >= CFG.chargeMax){
          const action = j.charge.action;
          const veutElast = j.charge.t >= CFG.seuilElastique;
          const elast = veutElast && j.endurance >= 1;
          if (elast) j.endurance -= 1;
          else if (veutElast && !this.astuceEndurance){
            this.astuceEndurance = true;
            this.message("PLUS D'ENDURANCE — LA JAUGE REVIENT TOUTE SEULE");
          }
          if (tenu) j.chargeAIgnorer = action;
          ENTREE.relache = null;
          j.charge = null;
          this.lancerAttaque(j, action, elast);
        } else if (!j.charge.pret && j.charge.t >= CFG.seuilElastique && j.endurance >= 1){
          j.charge.pret = true;
          SON.jouer('tendu');
        }
      } else if (ENTREE.chargeAction && ENTREE.chargeAction !== j.chargeAIgnorer){
        j.charge = { action: ENTREE.chargeAction, depuis: ENTREE.chargeDebut,
          t: (performance.now() - ENTREE.chargeDebut)/1000, pret:false };
      } else if (ENTREE.relache){
        const r = ENTREE.relache; ENTREE.relache = null;
        const elast = r.duree >= CFG.seuilElastique && j.endurance >= 1;
        if (elast) j.endurance -= 1;
        this.lancerAttaque(j, r.action, elast);
      }
    }

    // ── l'attaque en cours frappe dans sa fenêtre ──
    if (j.attaque){
      const c = COUPS[j.attaque.type];
      j.attaque.t += dt;
      // la fente : le corps glisse vers la cible aimantée tant qu'elle est
      // hors de portée — l'anneau doré tient sa promesse
      const f = j.attaque.cible;
      if (f && !f.mort && j.attaque.t <= c.fin){
        const dx = f.go.x - j.go.x, dy = f.go.y - j.go.y;
        const d = Math.hypot(dx, dy);
        if (d > c.portee + 6) j.go.body.setVelocity(dx/d * 380, dy/d * 380);
      }
      if (j.attaque.t >= c.debut && j.attaque.t <= c.fin){
        const z = this.zoneAttaque(j);
        if (z){
          const degats = c.degats + (j.attaque.elastique ? 1 : 0);
          for (const m of this.monstres){
            if (m.mort || j.attaque.touches.has(m)) continue;
            if (this.toucheZone(z, m.go.getBounds())){
              j.attaque.touches.add(m);
              this.frapper(m, degats, c.recul, j.go.x, j.go.y);
            }
          }
          for (const k of this.caisses){
            if (k.casse || j.attaque.touches.has(k)) continue;
            if (this.toucheZone(z, k.go.getBounds())){
              j.attaque.touches.add(k);
              this.casser(k, degats);
            }
          }
        }
      }
      if (j.attaque.t >= c.duree) j.attaque = null;
    }

    // ── déplacement : deux axes analogiques ──
    // le joystick parle en directions ÉCRAN ; on les convertit en monde
    // pour que pousser vers le haut fasse monter le perso à l'écran
    const nS = Math.hypot(ENTREE.axeX, ENTREE.axeY);
    let axeMX = 0, axeMY = 0;
    if (nS > 0.001){
      const w = this.isoInv(ENTREE.axeX, ENTREE.axeY);
      const nW = Math.hypot(w.x, w.y) || 1;
      axeMX = w.x / nW * nS;
      axeMY = w.y / nW * nS;
    }
    const bloque = j.attaque && !COUPS[j.attaque.type].tir;
    const lest = j.porte ? CFG.porteVitesse : 1;   // chargé, on avance moins vite
    const cx = bloque ? 0 : axeMX * CFG.vitesse * lest;
    const cy = bloque ? 0 : axeMY * CFG.vitesse * lest;
    if (nS > 0.05 && !bloque){ j.fx = axeMX / nS; j.fy = axeMY / nS; }

    const b = j.go.body;
    const ax = (cx !== 0 ? CFG.accel : CFG.frein) * dt;
    const ay = (cy !== 0 ? CFG.accel : CFG.frein) * dt;
    b.setVelocityX(Math.abs(cx - b.velocity.x) <= ax ? cx : b.velocity.x + Math.sign(cx - b.velocity.x) * ax);
    b.setVelocityY(Math.abs(cy - b.velocity.y) <= ay ? cy : b.velocity.y + Math.sign(cy - b.velocity.y) * ay);
    j.phase += Math.hypot(b.velocity.x, b.velocity.y) * dt / 27;

    // chaque pas posé soulève un peu de poussière : c'est elle qui dit
    // que les pieds touchent le sol
    const signe = Math.sign(Math.sin(j.phase));
    if (Math.hypot(b.velocity.x, b.velocity.y) > 60 && signe !== j.pasSigne){
      j.pasSigne = signe;
      this.poussiere(j.go.x, j.go.y + 10);
    } else if (signe !== j.pasSigne) j.pasSigne = signe;

    // point de retour : là où on marchait sain et sauf, SUR la terre
    if (j.invuln <= 0 && this.surTerre(j.go.x, j.go.y, 10)){
      this.checkpoint.x = j.go.x;
      this.checkpoint.y = j.go.y;
    }
  }

  // ── soulever et lancer, façon île aux trésors ───────────────
  soulever(j){
    let pris = null, prisD = 48, type = null;
    for (const p of this.pierres){
      const d = Math.hypot(p.go.x - j.go.x, p.go.y - j.go.y);
      if (d < prisD){ prisD = d; pris = p; type = 'pierre'; }
    }
    for (const k of this.caisses){
      const d = Math.hypot(k.go.x - j.go.x, k.go.y - j.go.y);
      if (d < prisD){ prisD = d; pris = k; type = 'caisse'; }
    }
    if (!pris) return;
    if (type === 'pierre') this.pierres = this.pierres.filter(p => p !== pris);
    else this.caisses = this.caisses.filter(k => k !== pris);
    pris.g.destroy();
    pris.go.destroy();
    j.porte = { type };
    majBoutonAction(true);
    SON.jouer('saut2');
    this.crier(j.go.x, j.go.y - 44, CRIS.souleve, '#ffd166', 14);
  }
  lancer(j){
    const type = j.porte.type;
    j.porte = null;
    majBoutonAction(false);
    this.aimanter(j, CFG.aimantPorteeTir, CFG.aimantCone * 0.55);
    SON.jouer('ejecte');
    this.crier(j.go.x, j.go.y - 44, CRIS.lancer, '#ffd166', 15);
    this.cameras.main.shake(70, 0.003);
    // le projectile vole à hauteur de corps (les monstres sont testés là) ;
    // c'est le rendu qui le dessine plus haut, au-dessus de la tête
    this.tirs.push({ lance:true, type,
      x: j.go.x + j.fx * 18, y: j.go.y - 6 + j.fy * 18,
      vx: j.fx * CFG.lancerVitesse, vy: j.fy * CFG.lancerVitesse,
      degats: CFG.lancerDegats, recul: 320, vie: 0.9 });
  }
  impactLance(t){
    this.eclat(t.x, t.y - 6, Math.sign(t.vx || 1), t.type === 'caisse' ? 14 : 8,
               t.type === 'caisse' ? 0xb07a3e : 0x8a8f9c);
    if (t.type === 'caisse'){
      SON.jouer('caisse');
      this.crier(t.x, t.y - 24, CRIS.caisse, '#e8b06a', 15);
      this.creerObjet(t.x, t.y, this.butin());
    }
  }

  majMonstres(dt){
    const j = this.joueurs[0];
    this.monstres = this.monstres.filter(m => !m.mort);
    for (const m of this.monstres){
      m.flash = Math.max(0, m.flash - dt);
      m.phase += dt * 5;
      const dx = j.go.x - m.go.x, dy = j.go.y - m.go.y;
      const dist = Math.hypot(dx, dy);

      if (m.assomme > 0){
        m.assomme -= dt;
      } else if (m.prepare > 0){
        // le boss se ramasse : il ne bouge plus, puis il fonce
        m.prepare -= dt;
        m.go.body.setVelocity(0, 0);
        if (m.prepare <= 0){
          const d = dist || 1;
          m.go.body.setVelocity(dx/d * m.def.charge.elan, dy/d * m.def.charge.elan);
          m.assomme = 0.45;
        }
      } else {
        m.repos = Math.max(0, m.repos - dt);
        const ch = m.def.charge;
        if (ch && m.repos <= 0 && dist < ch.portee){
          m.prepare = ch.preparation; m.repos = ch.repos;
          m.go.body.setVelocity(0, 0);
          SON.jouer('charge');
        } else if (dist < 240){
          const d = dist || 1;
          const v = m.def.vitesse * this.D.vitesse;
          m.go.body.setVelocity(dx/d * v, dy/d * v);
          // les coureurs au sol soulèvent aussi leur poussière
          if (!m.def.flotte && Math.sin(m.phase) > 0.95 && Math.sin(m.phase - dt*5) <= 0.95)
            this.poussiere(m.go.x, m.go.y + m.def.taille[1]/2);
        } else {
          // patrouille : un point au hasard autour de la maison
          if (!m.cible || Math.hypot(m.cible.x - m.go.x, m.cible.y - m.go.y) < 20){
            m.cible = {
              x: m.maison.x + (this.alea()*2 - 1) * 130,
              y: m.maison.y + (this.alea()*2 - 1) * 130,
            };
          }
          const cd = Math.hypot(m.cible.x - m.go.x, m.cible.y - m.go.y) || 1;
          const v = m.def.patrouille * this.D.vitesse;
          m.go.body.setVelocity((m.cible.x - m.go.x)/cd * v, (m.cible.y - m.go.y)/cd * v);
        }
      }
      // le contact se juge sur les boîtes AU SOL, pas les corps dessinés :
      // la hurtbox du héros pardonne les frôlements
      if (Phaser.Geom.Intersects.RectangleToRectangle(
            this.boiteSol(j.go, CFG.hurtbox), this.boiteSol(m.go, CFG.contactMonstre)))
        this.blesser(j, m.go.x, m.go.y, m.def.degats);
    }
  }

  majTirs(dt){
    for (const t of this.tirs){
      t.vie -= dt;
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.vie <= 0){
        t.fini = true;
        if (t.lance) this.impactLance(t);   // l'objet retombe et se brise
        continue;
      }
      const boite = new Phaser.Geom.Rectangle(t.x - 5, t.y - 5, 10, 10);
      for (const m of this.monstres){
        if (m.mort) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, m.go.getBounds())){
          this.frapper(m, t.degats, t.recul, t.x - t.vx * 0.01, t.y - t.vy * 0.01);
          t.fini = true; break;
        }
      }
      if (t.fini){ if (t.lance) this.impactLance(t); continue; }
      for (const k of this.caisses){
        if (k.casse) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, k.go.getBounds())){
          this.casser(k, t.degats);
          t.fini = true; break;
        }
      }
      if (t.fini && t.lance) this.impactLance(t);
    }
    this.tirs = this.tirs.filter(t => !t.fini);
  }

  majEclats(dt){
    for (const e of this.eclats){ e.vie -= dt; e.x += e.vx*dt; e.y += e.vy*dt; }
    this.eclats = this.eclats.filter(e => e.vie > 0);
    for (const b of this.bulles){
      if (b.vie <= 0) continue;
      b.vie -= dt;
      if (b.vie <= 0){ b.t.setVisible(false); continue; }
      const k = 1 - b.vie / b.max;
      b.t.y += b.vy * dt;
      b.t.setScale(k < 0.25 ? 0.4 + (k / 0.25) * 0.8 : Math.max(1, 1.2 - (k - 0.25) * 0.3));
      b.t.setAlpha(b.vie < 0.16 ? b.vie / 0.16 : 1);
    }
  }
}

// ═══════════════ src/rendu.js ═══════════════
// ─────────────────────────────────────────────────────────────
// RENDU — vue de dessus
// Greffé sur la scène par le build. Chaque entité dessine dans SON
// calque, et son depth = son y : passer derrière un palmier le masque,
// passer devant le recouvre. Le sol se redessine sur la zone visible.
// ─────────────────────────────────────────────────────────────
Object.assign(Aquad.prototype, {

  dessinerTout(){
    // le fantôme que suit la caméra colle à la projection du joueur
    const jp = this.iso(this.joueurs[0].go.x, this.joueurs[0].go.y);
    this.suiveur.setPosition(jp.x, jp.y);
    this.dessinerSol();
    this.dessinerSortie();
    this.dessinerVisee();
    for (const d of this.decors) this.animerDecor(d);
    this.dessinerCaisses();
    this.dessinerPierres();
    this.dessinerMonstres();
    this.dessinerPerso(this.joueurs[0]);
    this.dessinerObjets();
    this.dessinerEclats();
    this.dessinerTirs();
    this.dessinerHud();
  },

  // ── le sol : l'eau et le chemin de disques de terre ─────────
  dessinerSol(){
    const g = this.gSol; g.clear();
    const cam = this.cameras.main;
    const vx = cam.scrollX - 40, vy = cam.scrollY - 40;
    const vl = L + 80, vh = H + 80;
    const t = this.def.teinte;
    // le culling se fait en coordonnées MONDE : on rétro-projette les
    // quatre coins de l'écran et on prend leur boîte englobante
    const c1 = this.isoInv(vx, vy), c2 = this.isoInv(vx + vl, vy),
          c3 = this.isoInv(vx, vy + vh), c4 = this.isoInv(vx + vl, vy + vh);
    const wx0 = Math.min(c1.x, c2.x, c3.x, c4.x), wx1 = Math.max(c1.x, c2.x, c3.x, c4.x);
    const wy0 = Math.min(c1.y, c2.y, c3.y, c4.y), wy1 = Math.max(c1.y, c2.y, c3.y, c4.y);
    const visible = (x, y) => x > wx0 && x < wx1 && y > wy0 && y < wy1;
    const noeudVisible = nd =>
      nd.x + nd.r + 140 > wx0 && nd.x - nd.r - 140 < wx1 &&
      nd.y + nd.r + 140 > wy0 && nd.y - nd.r - 140 < wy1;
    const vus = this.noeuds.filter(noeudVisible);

    // l'eau profonde remplit l'écran, puis tout se dessine en projection
    g.fillStyle(COUL.eauProfonde, 1); g.fillRect(vx, vy, vl, vh);
    g.save();
    g.scaleCanvas(1, 0.5);
    g.rotateCanvas(Math.PI / 4);

    // le halo d'eau claire autour de chaque disque de terre
    for (const nd of vus){
      g.fillStyle(COUL.eau, 1); g.fillCircle(nd.x, nd.y, nd.r + 90);
    }
    // TOUTES les écumes d'abord : leurs traits qui traversent la terre
    // seront recouverts par les remplissages des disques voisins
    const resp = Math.sin(this.time.now / 600) * 4;
    for (const nd of vus){
      g.lineStyle(2, COUL.ecume, 0.22); g.strokeCircle(nd.x, nd.y, nd.r + 52 + resp * 1.5);
      g.lineStyle(4, COUL.eauClaire, 0.7); g.strokeCircle(nd.x, nd.y, nd.r + 38 + resp);
      g.lineStyle(3, COUL.ecume, 0.5); g.strokeCircle(nd.x, nd.y, nd.r + 26 + resp * 0.5);
    }
    // des reflets qui dérivent lentement autour des nœuds
    const tEau = this.time.now / 4000;
    g.lineStyle(2.5, 0xffffff, 0.22);
    for (const nd of vus){
      for (let k = 0; k < 4; k++){
        const a0 = Math.abs(Math.sin(nd.x * 0.01 + k * 12.3));
        const a = a0 * Math.PI * 2 + tEau * (0.3 + a0 * 0.4);
        const dist = nd.r + 70 + a0 * 60;
        const gx = nd.x + Math.cos(a) * dist, gy = nd.y + Math.sin(a) * dist;
        if (this.surTerre(gx, gy, -30) || !visible(gx, gy)) continue;
        g.beginPath(); g.moveTo(gx - 6, gy); g.lineTo(gx + 6, gy); g.strokePath();
      }
    }
    // puis les remplissages, couche par couche sur TOUS les disques :
    // sable mouillé, sable, herbe — les cercles fusionnent en serpentin
    for (const nd of vus){ g.fillStyle(COUL.sableMouille, 1); g.fillCircle(nd.x, nd.y, nd.r + 18); }
    for (const nd of vus){ g.fillStyle(t.sable || COUL.sable, 1); g.fillCircle(nd.x, nd.y, nd.r + 8); }
    for (const nd of vus){ g.fillStyle(t.herbe, 1); g.fillCircle(nd.x, nd.y, Math.max(30, nd.r - 28)); }

    // le sol vivant : détails hachés par nœud, plus fournis en prairie
    for (let i = 0; i < this.noeuds.length; i++){
      const nd = this.noeuds[i];
      if (!noeudVisible(nd)) continue;
      const nDet = Math.round(nd.r / 14);
      for (let k = 0; k < nDet; k++){
        const h1 = Math.abs(Math.sin(i * 37.7 + k * 12.99));
        const h2 = Math.abs(Math.sin(i * 53.1 + k * 78.23));
        const a = h1 * Math.PI * 2;
        const dist = h2 * Math.max(10, nd.r - 60);
        const hx = nd.x + Math.cos(a) * dist, hy = nd.y + Math.sin(a) * dist;
        if (!visible(hx, hy)) continue;
        const genre = (i * 7 + k) % 5;
        if (genre === 0){
          g.fillStyle(t.herbeClaire || COUL.herbeClaire, 1);
          g.fillEllipse(hx, hy, 32, 14);
          g.fillEllipse(hx + Math.sin(k * 5.7) * 9, hy + 4, 22, 10);
        } else if (genre === 1){
          g.fillStyle(t.herbeSombre, 1);
          g.fillEllipse(hx, hy, 22, 10);
          g.fillEllipse(hx + Math.sin(k * 7.3) * 7, hy + 3, 15, 7);
        } else if (genre === 2){
          g.lineStyle(2, COUL.brin, 0.9);
          const dxb = Math.sin(k * 3.3) * 2.5;
          g.beginPath(); g.moveTo(hx, hy); g.lineTo(hx + dxb, hy - 6); g.strokePath();
          g.beginPath(); g.moveTo(hx + 3, hy + 1); g.lineTo(hx + 3 - dxb, hy - 5); g.strokePath();
        } else if (genre === 3){
          g.fillStyle(k % 3 ? COUL.fleur : COUL.fleur2, 1);
          g.fillCircle(hx, hy, 2.2); g.fillCircle(hx + 4, hy + 2, 1.6);
        }
        // genre 4 : rien — le vide aussi fait respirer le sol
      }
      // coquillages et galets sur l'anneau de plage du disque
      for (let k = 0; k < 5; k++){
        const h1 = Math.abs(Math.sin(i * 91.3 + k * 17.89));
        const a = h1 * Math.PI * 2;
        const dist = nd.r - 18 + Math.sin(i + k * 2.7) * 8;
        const hx = nd.x + Math.cos(a) * dist, hy = nd.y + Math.sin(a) * dist;
        if (!visible(hx, hy)) continue;
        if (k % 2){
          g.fillStyle(COUL.coquillage, 1); g.fillEllipse(hx, hy, 5, 4);
          g.fillStyle(COUL.sableOmbre, 1); g.fillCircle(hx, hy + 1, 1);
        } else {
          g.fillStyle(COUL.galet, 1); g.fillEllipse(hx, hy, 6, 4);
        }
      }
    }
    g.restore();
  },

  // ── le ponton de sortie, au dernier nœud du chemin ──────────
  dessinerSortie(){
    const g = this.gSortie; g.clear();
    g.save();
    g.scaleCanvas(1, 0.5);
    g.rotateCanvas(Math.PI / 4);
    const x0 = this.arrivee.x + this.arrivee.r - 12, y = this.arrivee.y;
    const bloquee = this.bossVivant;
    const pulse = bloquee ? 0 : 0.55 + 0.45 * Math.sin(this.time.now / 260);
    // planches au-dessus de l'eau
    for (let i = 0; i < 6; i++){
      g.fillStyle(i % 2 ? COUL.ponton : COUL.pontonOmbre, 1);
      g.fillRect(x0 + i * 34, y - 42, 32, 84);
    }
    g.fillStyle(COUL.ombrePortee, 0.18); g.fillRect(x0, y + 40, 6 * 34, 8);
    // la barque au bout
    g.fillStyle(0x8a5a2b, 1); g.fillEllipse(x0 + 232, y, 64, 34);
    g.fillStyle(0xb07a3e, 1); g.fillEllipse(x0 + 232, y, 48, 22);
    g.fillStyle(bloquee ? 0xe2584d : 0x4dd6c1, 0.4 + 0.4*pulse);
    g.fillTriangle(x0 + 100, y - 52, x0 + 86, y - 38, x0 + 114, y - 38);
    if (bloquee){
      g.lineStyle(5, 0xe2584d, 0.8);
      g.beginPath(); g.moveTo(x0 + 8, y - 40); g.lineTo(x0 + 196, y + 40); g.strokePath();
      g.beginPath(); g.moveTo(x0 + 196, y - 40); g.lineTo(x0 + 8, y + 40); g.strokePath();
    }
    g.restore();
  },

  // ── la visée : ce que dirait un coup donné maintenant ───────
  dessinerVisee(){
    const g = this.gVisee; g.clear();
    if (this.etat !== 'jeu') return;
    g.save();
    g.scaleCanvas(1, 0.5);
    g.rotateCanvas(Math.PI / 4);
    const j = this.joueurs[0];
    // l'arc au sol devant le héros : là où porterait le coup. Masqué
    // pendant une frappe — le cercle blanc de l'impact prend le relais.
    if (!j.attaque && !j.porte){
      const ang = Math.atan2(j.fy, j.fx);
      g.lineStyle(3, 0xffffff, 0.22);
      g.beginPath();
      g.arc(j.go.x, j.go.y + 2, 42, ang - 0.6, ang + 0.6);
      g.strokePath();
    }
    // l'anneau pulsant sous l'ennemi qui serait touché
    const c = this.cibleVisee;
    if (c && !c.mort){
      const bs = this.boiteSol(c.go, 1);
      const pulse = 0.32 + 0.16 * Math.sin(this.time.now / 160);
      g.lineStyle(3.5, 0xffd166, pulse + 0.2);
      g.strokeEllipse(c.go.x, c.go.y + bs.height/2, bs.width + 14, (bs.width + 14) * 0.42);
      g.fillStyle(0xffd166, pulse * 0.4);
      g.fillEllipse(c.go.x, c.go.y + bs.height/2, bs.width + 14, (bs.width + 14) * 0.42);
    }
    g.restore();
  },

  // ── décors : dessinés une fois, animés doucement ────────────
  // billboards : le PIED est projeté, le corps reste dessiné debout
  dessinerDecor(d){
    const g = d.g; g.clear();
    const P = this.iso(d.x, d.y);
    if (d.type === 'rocher'){
      // un rocher en volume : assise large, dôme principal, seconde
      // bosse, calottes éclairées côté soleil
      g.fillStyle(COUL.ombrePortee, 0.22); g.fillEllipse(P.x + SOLEIL.x*1.5, P.y + 12 + SOLEIL.y*0.5, 48, 14);
      g.fillStyle(COUL.rocherOmbre, 1); g.fillEllipse(P.x, P.y + 4, 46, 20);
      g.fillStyle(COUL.rocher, 1); g.fillEllipse(P.x - 2, P.y - 8, 40, 28);
      g.fillStyle(COUL.rocher, 1); g.fillEllipse(P.x + 14, P.y - 2, 20, 16);
      g.fillStyle(0xb8bcc8, 0.75); g.fillEllipse(P.x - 10, P.y - 14, 16, 9);
      g.fillStyle(0xb8bcc8, 0.5); g.fillEllipse(P.x + 12, P.y - 7, 8, 5);
      return;
    }
    // palmier : le pied au corps physique, la tête bien plus haut —
    // c'est le tri par profondeur projetée qui fait passer derrière/devant
    const bal = Math.sin(d.phase) * 3;
    g.fillStyle(COUL.ombrePortee, 0.22); g.fillEllipse(P.x + SOLEIL.x*3, P.y + 8 + SOLEIL.y, 52, 12);
    // l'occlusion au pied du tronc
    g.fillStyle(COUL.ombrePortee, 0.17); g.fillEllipse(P.x, P.y + 5, 16, 6);
    g.lineStyle(9, COUL.tronc, 1);
    g.beginPath(); g.moveTo(P.x, P.y + 4);
    g.lineTo(P.x + 6 + bal * 0.4, P.y - 46); g.strokePath();
    // les anneaux de croissance du tronc
    g.lineStyle(2, 0x6d4420, 0.5);
    for (const k of [0.3, 0.55, 0.8]){
      const rx = P.x + (6 + bal*0.4) * k, ry = P.y + 4 - 50 * k;
      g.beginPath(); g.moveTo(rx - 4, ry); g.lineTo(rx + 4, ry); g.strokePath();
    }
    // la couronne : 6 palmes RADIALES, chacune dans son repère tourné —
    // celles du bas (face au joueur) sont plus claires, la lumière vient
    // d'en haut
    const tx = P.x + 7 + bal * 0.5, ty = P.y - 52;
    for (let a = 0; a < 6; a++){
      const ang = a * Math.PI / 3 + 0.26 + bal * 0.02;
      const bas = Math.sin(ang) > 0.15;
      g.save();
      g.translateCanvas(tx, ty);
      g.rotateCanvas(ang);
      g.fillStyle(bas ? COUL.palmeClaire : COUL.palme, 1);
      g.fillEllipse(13, 0, 24, 9);
      g.fillEllipse(23, 2.5, 12, 6);   // le bout de la palme retombe
      g.restore();
    }
    g.fillStyle(COUL.palme, 1); g.fillEllipse(tx, ty, 14, 10);
    g.fillStyle(0x6d4420, 1);
    g.fillCircle(tx - 6, ty + 7, 4); g.fillCircle(tx + 5, ty + 8, 4);
  },
  animerDecor(d){
    if (d.type !== 'palmier') return;
    d.phase += 0.016;
    // redessiner chaque frame coûterait cher pour rien : une palme sur
    // trois frames suffit à donner le vent
    if ((this.time.now / 120 | 0) % 3 === 0) this.dessinerDecor(d);
  },

  // un cube isométrique posé au sol : dessus en losange, deux faces.
  // (x, y) est le centre de la base, l le côté, h la hauteur.
  cube(g, x, y, l, h, dessus, gauche, droite){
    const w = l/2, r = l/4, ty = y - h;
    g.fillStyle(gauche, 1);
    g.fillPoints([{x:x-w,y:ty},{x:x,y:ty+r},{x:x,y:ty+r+h},{x:x-w,y:ty+h}], true);
    g.fillStyle(droite, 1);
    g.fillPoints([{x:x,y:ty+r},{x:x+w,y:ty},{x:x+w,y:ty+h},{x:x,y:ty+r+h}], true);
    g.fillStyle(dessus, 1);
    g.fillPoints([{x:x,y:ty-r},{x:x+w,y:ty},{x:x,y:ty+r},{x:x-w,y:ty}], true);
  },

  dessinerPierres(){
    for (const p of this.pierres){
      const g = p.g; g.clear();
      const P = this.iso(p.go.x, p.go.y);
      g.setDepth(P.y);
      const x = P.x, y = P.y;
      // un galet en volume : l'assise, le dôme, la calotte éclairée
      g.fillStyle(COUL.ombrePortee, 0.22); g.fillEllipse(x + SOLEIL.x, y + 7 + SOLEIL.y*0.5, 20, 6);
      g.fillStyle(COUL.rocherOmbre, 1); g.fillEllipse(x, y + 2, 18, 9);
      g.fillStyle(COUL.rocher, 1); g.fillEllipse(x, y - 3, 16, 12);
      g.fillStyle(0xb8bcc8, 0.8); g.fillEllipse(x - 3, y - 6, 9, 5);
    }
  },

  dessinerCaisses(){
    for (const k of this.caisses){
      const g = k.g; g.clear();
      const P = this.iso(k.go.x, k.go.y);
      g.setDepth(P.y);
      const x = P.x, y = P.y + 6, clair = k.flash > 0;
      g.fillStyle(COUL.ombrePortee, 0.24); g.fillEllipse(x + SOLEIL.x, y + 2 + SOLEIL.y*0.5, 36, 11);
      // l'occlusion de contact : la base assombrit le sol qu'elle touche
      g.fillStyle(COUL.ombrePortee, 0.17); g.fillEllipse(x, y + 3, 28, 8);
      // un vrai cube posé sur le sol isométrique
      this.cube(g, x, y, 30, 20,
        clair ? 0xffffff : COUL.boisClair,
        clair ? 0xffffff : COUL.bois,
        clair ? 0xffffff : COUL.boisOmbre);
      // les planches croisées du couvercle
      g.lineStyle(2.5, clair ? 0xffffff : COUL.boisOmbre, 1);
      const ty = y - 20;
      g.beginPath(); g.moveTo(x - 15, ty); g.lineTo(x + 15, ty); g.strokePath();
      g.beginPath(); g.moveTo(x, ty - 7.5); g.lineTo(x, ty + 7.5); g.strokePath();
      // l'arête nord-ouest du couvercle attrape le soleil
      g.lineStyle(2, 0xf7e9c8, 0.75);
