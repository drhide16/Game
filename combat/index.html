    } else
    if (this.def.sortie === 'porte'){
      // l'entrée de la tour : un bloc sombre percé d'une porte éclairée
      g.fillStyle(0x120f22, 1); g.fillRect(x - 90, sol - 300, 180, 300);
      g.fillStyle(0x1d1836, 1); g.fillRect(x - 90, sol - 300, 180, 8);
      for (let fy = sol - 280; fy < sol - 120; fy += 30){
        for (let fx = x - 74; fx < x + 62; fx += 34){
          if (Math.abs(Math.sin(fx*0.21 + fy*0.37)) < 0.5) continue;
          g.fillStyle(0xffd98a, 0.6); g.fillRect(fx, fy, 14, 14);
        }
      }
      g.fillStyle(0xffb347, 0.16 + 0.1*pulse); g.fillRect(x - 46, sol - 116, 92, 116);
      g.fillStyle(0x090c16, 1); g.fillRect(x - 34, sol - 96, 68, 96);
      g.fillStyle(0xffd98a, 0.35 + 0.35*pulse); g.fillRect(x - 34, sol - 96, 68, 6);
      g.lineStyle(3, COUL.ceinture, 0.8); g.strokeRect(x - 34, sol - 96, 68, 96);
    } else if (this.def.sortie === 'arche'){
      // arche de pierre : la sortie des niveaux de plein air
      g.fillStyle(0x000000, 0.18); g.fillEllipse(x, sol, 96, 10);
      g.fillStyle(0x5d5040, 1); g.fillRect(x - 46, sol - 120, 18, 120);
      g.fillStyle(0x5d5040, 1); g.fillRect(x + 28, sol - 120, 18, 120);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x - 42, sol - 116, 12, 116);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x + 30, sol - 116, 12, 116);
      g.fillStyle(0x5d5040, 1); g.fillRect(x - 54, sol - 138, 108, 24);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x - 50, sol - 134, 100, 14);
      g.fillStyle(0xffd98a, 0.10 + 0.25*pulse); g.fillRect(x - 28, sol - 114, 56, 114);
      g.fillStyle(0x4dd6c1, 0.35 + 0.5*pulse);
      g.fillTriangle(x, sol - 156, x - 13, sol - 141, x + 13, sol - 141);
    } else {
      // l'ascenseur est une image de la planche : ici, la flèche seule
      g.fillStyle(bloquee ? 0xe2584d : 0x4dd6c1, bloquee ? 0.5 : 0.35 + 0.5*pulse);
      g.fillTriangle(x, sol - 172, x - 14, sol - 156, x + 14, sol - 156);
    }
    // sortie condamnée tant que le boss tient : la croix vaut pour toutes
    if (bloquee){
      g.lineStyle(5, 0xe2584d, 0.75);
      g.beginPath(); g.moveTo(x - 34, sol - 112); g.lineTo(x + 34, sol - 16); g.strokePath();
      g.beginPath(); g.moveTo(x + 34, sol - 112); g.lineTo(x - 34, sol - 16); g.strokePath();
    }
  },

  dessinerCaisses(){
    const g = this.gCaisses; g.clear();
    const dt = this.game.loop.delta / 1000;
    for (const k of this.caisses){
      if (k.casse){
        // les débris s'effacent doucement
        k.efface = Math.max(0, k.efface - dt);
        k.img.setAlpha(Math.min(1, k.efface / 0.6));
        if (k.efface <= 0) k.img.setVisible(false);
        continue;
      }
      g.fillStyle(0x000000, 0.25); g.fillEllipse(k.go.x, k.go.y + 16, 30, 6);
      if (k.flash > 0) k.img.setTintFill(0xffffff); else k.img.clearTint();
    }
    // et les blocs bonus : posés au sol, comprimés au coup, éteints après
    for (const bl of this.blocs){
      bl.img.setPosition(bl.x, bl.y);
      if (bl.frappe > 0){
        bl.img.setTexture('decorAtlas', 'blocFrappe');
        bl.img.setScale(46 / CADRES_DECOR.blocFrappe.h);
      } else {
        bl.img.setTexture('decorAtlas', bl.plein ? 'blocPlein' : 'blocVide');
        bl.img.setScale(46 / CADRES_DECOR.blocPlein.h);
      }
    }
  },
  dessinerObjets(){
    // cœur, étoile de vie et runes de pouvoir : les images de la
    // planche bonus, avec un halo à la couleur de l'objet
    const g = this.gObjets; g.clear();
    const CADRE = { vie:'etoile', coeur:'coeur', pistolet:'runeFeu', fusil:'runeTriple', laser:'runeAqua' };
    const HALO  = { vie:0xffd166, coeur:0xe2584d, pistolet:0xffb347, fusil:0xff7b54, laser:0x7b9bff };
    let oi = 0;
    for (const o of this.objets){
      const img = this.imgObjets[oi++];
      if (!img) break;
      const y = o.go.y + Math.sin(o.phase) * 2.5;
      const nom = CADRE[o.type] || 'coeur';
      const c = CADRES_DECOR[nom];
      g.fillStyle(HALO[o.type] || 0xffffff, 0.18); g.fillCircle(o.go.x, y, 16);
      img.setVisible(true).setTexture('decorAtlas', nom)
         .setPosition(o.go.x, y).setScale(Math.min(26 / c.h, 56 / c.w));
    }
    for (let i = oi; i < this.imgObjets.length; i++) this.imgObjets[i].setVisible(false);
  },
  dessinerMonstres(){
    const g = this.gMonstres; g.clear();
    for (const m of this.monstres){
      const s = m.def.silhouette;
      if (m.spr) this.dessinerSpriteMonstre(g, m);
      else if (s === 'drone') this.dessinerDrone(g, m);
      else if (s === 'gardien') this.dessinerGardien(g, m);
      else if (s === 'tourelle') this.dessinerTourelle(g, m);
      else this.dessinerBrute(g, m);
      if (m.pv < m.pvMax){
        const l = m.def.boss ? m.def.taille[0]*0.6 : 13;
        const x = m.go.x, y = m.go.y - m.def.taille[1]/2 - 12;
        g.fillStyle(0x2a3355, 1); g.fillRect(x-l, y, l*2, 4);
        g.fillStyle(m.def.boss ? 0xff5e5e : 0xe2584d, 1); g.fillRect(x-l, y, l*2 * (m.pv/m.pvMax), 4);
      }
    }
    this.dessinerCadavres();
  },
  // le rendu commun des monstres à planche : cycle Va en déplacement,
  // frames Attaque quand le joueur est à portée (ou qu'il encaisse), la
  // dépouille est gérée à part. Les planches regardent vers la droite.
  dessinerSpriteMonstre(g, m){
    const spr = m.spr, pref = m.sprPref;
    const x = m.go.x, base = m.go.y + m.def.taille[1]/2 + 2;
    if (m.def.vole){ g.fillStyle(0x000000, 0.18); g.fillEllipse(x, SOL_Y - 3, 26, 5); }
    else { g.fillStyle(0x000000, 0.25); g.fillEllipse(x, base - 1, m.def.taille[0], 6); }
    const dx = this.joueur.x - m.go.x;
    const proche = Math.abs(dx) < 90 && Math.abs(this.joueur.y - m.go.y) < 80;
    const nA = CADRES_PERSO[pref + 'Attaque'].length;
    const nV = CADRES_PERSO[pref + 'Va'].length;
    let anim, idx;
    if (m.def.fixe){
      // la tourelle : repos, visée qui cligne, flash au tir
      if (m.tira > 0){ anim = pref + 'Attaque'; idx = nA - 1; }
      else if (m.vise > 0){ anim = pref + 'Attaque'; idx = Math.floor(this.time.now / 130) % 2; }
      else { anim = pref + 'Va'; idx = Math.floor(m.phase * 1.1) % nV; }
    }
    else if (m.tira > 0){ anim = pref + 'Attaque'; idx = nA - 1; }   // le drone tire
    else if (m.vise > 0){ anim = pref + 'Attaque'; idx = Math.floor(this.time.now / 130) % 2; }
    else if (m.prepare > 0){ anim = pref + 'Attaque'; idx = 0; }   // il se ramasse
    else if (m.assomme > 0){
      // sonné… ou en PLEINE CHARGE (le gardien passe assommé le temps
      // de son élan) : lancé à toute vitesse, c'est la frame de charge
      anim = pref + 'Attaque';
      idx = Math.abs(m.go.body.velocity.x) > 200 ? nA - 1 : 0;
    }
    else if (proche){ anim = pref + 'Attaque'; idx = 1 + Math.floor(m.phase * 1.5) % (nA - 1); }
    else { anim = pref + 'Va'; idx = Math.floor(m.phase * 1.1) % nV; }
    const c = CADRES_PERSO[anim][idx];
    const flip = dx < 0;
    spr.setVisible(true).setTexture('persoAtlas', anim + idx).setFlipX(flip);
    spr.setOrigin(flip ? 1 - c.ox : c.ox, 1);
    spr.setPosition(x, base).setScale(m.sprE);
    if (m.flash > 0) spr.setTintFill(0xffffff);
    else if (m.blinde > 0) spr.setTint(COUL.blinde);
    else spr.clearTint();
  },
  dessinerCadavres(){
    let ci = 0;
    for (const cd of this.cadavres){
      const img = this.imgCadavres[ci++];
      if (!img) break;
      const cs = CADRES_PERSO[cd.pref + 'Mort'];
      const idx = Math.min(cs.length - 1, Math.floor(cd.t / 0.22));
      img.setVisible(true).setTexture('persoAtlas', cd.pref + 'Mort' + idx)
         .setFlipX(cd.sens < 0).setOrigin(0.5, 1)
         .setPosition(cd.x, cd.y).setScale(cd.e)
         .setAlpha(cd.t > 0.9 ? Math.max(0, 1 - (cd.t - 0.9) / 0.6) : 1);
    }
    for (let i = ci; i < this.imgCadavres.length; i++) this.imgCadavres[i].setVisible(false);
  },
  dessinerBrute(g, m){
    const gros = !!m.def.gros;
    const e = m.def.taille[0] / 26;   // l'échelle découle de la taille déclarée
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const dandine = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const corps = eclaire || m.def.couleur || (gros ? COUL.colosse : COUL.baveux);
    const ombre = eclaire || m.def.ombre   || (gros ? COUL.colosseOmbre : COUL.baveuxOmbre);
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 26*e, 6*e);
    g.fillStyle(ombre, 1);
    g.fillEllipse(x-6*e, y-3*e, 8*e, 8*e); g.fillEllipse(x+6*e, y-3*e, 8*e, 8*e);
    g.fillStyle(corps, 1);
    g.fillEllipse(x, y-15*e+dandine, 26*e, 26*e);
    g.fillTriangle(x-11*e, y-22*e+dandine, x-5*e, y-34*e+dandine, x-2*e, y-21*e+dandine);
    g.fillTriangle(x+11*e, y-22*e+dandine, x+5*e, y-34*e+dandine, x+2*e, y-21*e+dandine);
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(m.def.boss ? 0xffd166 : gros ? COUL.colosseOeil : COUL.baveuxOeil, 1);
    g.fillCircle(x + vers*3 - 4*e, y-17*e+dandine, 3*e);
    g.fillCircle(x + vers*3 + 4*e, y-17*e+dandine, 3*e);
    g.fillStyle(0x1a0f22, 1);
    g.fillCircle(x + vers*4 - 4*e, y-17*e+dandine, 1.4*e);
    g.fillCircle(x + vers*4 + 4*e, y-17*e+dandine, 1.4*e);
  },
  dessinerDrone(g, m){
    const x = m.go.x, y = m.go.y;
    const flotte = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    g.fillStyle(0x000000, 0.18); g.fillEllipse(x, SOL_Y - 3, 26, 5);
    g.fillStyle(eclaire || COUL.droneOmbre, 1);
    g.fillRoundedRect(x-15, y-4+flotte, 30, 9, 4);
    g.fillStyle(eclaire || COUL.drone, 1);
    g.fillRoundedRect(x-13, y-13+flotte, 26, 20, 7);
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(0x11142a, 1); g.fillRoundedRect(x-9, y-9+flotte, 18, 7, 3);
    g.fillStyle(COUL.droneOeil, 1); g.fillRect(x - 3 + vers*3, y-8+flotte, 7, 3);
    const bat = Math.sin(m.phase * 6) * 5;
    g.lineStyle(2, eclaire || COUL.droneOmbre, 0.9);
    g.beginPath(); g.moveTo(x-16-bat, y-15+flotte); g.lineTo(x-6+bat, y-15+flotte); g.strokePath();
    g.beginPath(); g.moveTo(x+6-bat, y-15+flotte); g.lineTo(x+16+bat, y-15+flotte); g.strokePath();
  },
  dessinerGardien(g, m){
    const e = m.def.taille[0] / 28;
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    // quand il se ramasse avant de bondir, il s'accroupit et clignote :
    // c'est le signal qu'il faut sauter ou reculer
    const p = m.prepare > 0 ? 1 - m.prepare / m.def.charge.preparation : 0;
    const tasse = m.prepare > 0 ? (7 * (1 - Math.abs(p - 0.5) * 2) + 5) * e : 0;
    const alerte = m.prepare > 0 && Math.floor(m.prepare * 14) % 2 === 0;
    const corps = eclaire || (alerte ? 0xffe9b0 : (m.def.couleur || COUL.gardien));
    const dandine = Math.sin(m.phase) * 1.5;
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 26*e, 6*e);
    g.fillStyle(eclaire || m.def.ombre || COUL.gardienOmbre, 1);
    g.fillRect(x-11*e, y-9*e+tasse, 8*e, 9*e); g.fillRect(x+3*e, y-9*e+tasse, 8*e, 9*e);
    g.fillStyle(corps, 1);
    g.fillRoundedRect(x-12*e, y-32*e+tasse+dandine, 24*e, 25*e, 5);
    g.fillStyle(eclaire || COUL.gardienOmbre, 1);
    g.fillRect(x-14*e, y-30*e+tasse+dandine, 28*e, 5*e);
    // casque à visière
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(corps, 1); g.fillRoundedRect(x-9*e, y-45*e+tasse+dandine, 18*e, 14*e, 5);
    g.fillStyle(0x0d1120, 1); g.fillRect(x-8*e, y-40*e+tasse+dandine, 16*e, 6*e);
    g.fillStyle(COUL.gardienVisiere, alerte ? 1 : 0.85);
    g.fillRect(x - 5*e + vers*3, y-39*e+tasse+dandine, 8*e, 4*e);
    // matraque
    g.lineStyle(4*e, eclaire || 0x1d2340, 1);
    g.beginPath(); g.moveTo(x + vers*10*e, y-24*e+tasse+dandine);
    g.lineTo(x + vers*(18 + (m.prepare > 0 ? -6 : 0))*e, y-14*e+tasse+dandine); g.strokePath();
  },
  dessinerTourelle(g, m){
    const e = m.def.taille[0] / 30;
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const c = m.def.canon;
    const charge = m.vise > 0 ? 1 - m.vise / c.visee : 0;
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 30*e, 6*e);
    g.fillStyle(eclaire || m.def.ombre || COUL.tourelleOmbre, 1); g.fillRect(x-15*e, y-10*e, 30*e, 10*e);
    g.fillStyle(eclaire || m.def.couleur || COUL.tourelle, 1); g.fillRoundedRect(x-12*e, y-26*e, 24*e, 18*e, 5);
    // le canon suit le joueur : on voit qu'on est visé avant de prendre le tir
    const dx = this.joueur.x - x, dy = (this.joueur.y - 10) - (y - 20*e);
    const ang = Math.atan2(dy, dx);
    const lx = x + Math.cos(ang)*20*e, ly = (y-20*e) + Math.sin(ang)*20*e;
    g.lineStyle(7*e, eclaire || m.def.ombre || COUL.tourelleOmbre, 1);
    g.beginPath(); g.moveTo(x, y-20*e); g.lineTo(lx, ly); g.strokePath();
    if (m.vise > 0){
      g.fillStyle(COUL.tourelleOeil, 0.25 + 0.5*charge); g.fillCircle(lx, ly, 4 + charge*7);
      g.lineStyle(1.5, COUL.tourelleOeil, 0.25 + 0.45*charge);
      g.beginPath(); g.moveTo(lx, ly);
      g.lineTo(lx + Math.cos(ang)*260, ly + Math.sin(ang)*260); g.strokePath();
    }
    g.fillStyle(COUL.tourelleOeil, m.vise > 0 ? 1 : 0.55); g.fillCircle(x, y-20*e, 3.5*e);
  },

  dessinerPerso(b){
    const g = this.perso; g.clear();
    const spr = this.persoSpr;
    const auSol = b.blocked.down || b.touching.down;
    const marche = Math.abs(b.velocity.x) > 20;
    const allure = Math.min(1, Math.abs(b.velocity.x) / CFG.vitesseCourse);
    const cadre = (anim, i) => {
      const cs = CADRES_PERSO[anim];
      const k = Phaser.Math.Clamp(i, 0, cs.length - 1);
      return { nom: anim + k, c: cs[k] };
    };
    let f;
    if (this.etat === 'perdu' || this.etat === 'gameover'){
      // à terre : la chute se joue une fois, puis on reste allongé
      f = cadre('mourir', Math.floor((this.time.now - (this.mortDebut || 0)) / 150));
    } else if (this.attaque){
      const c = COUPS[this.attaque.type];
      const p = Phaser.Math.Clamp(this.attaque.t / c.duree, 0, 1);
      let anim = c.jet ? 'lancer' : (c.faisceau || c.tir) ? 'tir'
               : this.attaque.type === 'retourne' ? 'retourne'
               : this.attaque.type === 'pied' ? 'pied'
               : 'poing';
      // les coups donnés accroupi ont leurs propres poses, et le poing
      // élastique a sa planche à aura dorée
      if (this.attaque.bas && (anim === 'poing' || anim === 'pied')) anim += 'Bas';
      else if (anim === 'poing' && this.attaque.elastique) anim = 'poingCharge';
      f = cadre(anim, Math.floor(p * CADRES_PERSO[anim].length));
    } else if (this.charge){
      // le coup s'arme : la pose de départ du coup ; le poing prêt à
      // partir élastique s'embrase déjà (frame d'aura pleine)
      const act = this.charge.action;
      if (this.accroupi)
        f = cadre(act === 'pied' || act === 'retourne' ? 'piedBas' : 'poingBas', 0);
      else if (act === 'retourne') f = cadre('retourne', 0);
      else if (act === 'poing' && this.charge.pret) f = cadre('poingCharge', 1);
      else f = cadre(act === 'pied' ? 'pied' : 'poing', 0);
    } else if (this.invuln > CFG.invincibilite - 0.42 && this.invuln <= CFG.invincibilite){
      // on vient d'encaisser : la grimace prime sur le reste
      f = cadre('recevoir', this.invuln > CFG.invincibilite - 0.2 ? 0 : 1);
    } else if (!auSol){
      f = cadre('saut', b.velocity.y < -60 ? 1 : b.velocity.y > 60 ? 3 : 2);
    } else if (this.accroupi){
      // la vraie garde basse ; en rampant : la planche « rampe » dès
      // qu'on l'aura, sinon les deux poses alternent et le corps se
      // balance (voir plus bas) pour ne pas glisser bêtement
      if (marche && CADRES_PERSO.rampe){
        const n = CADRES_PERSO.rampe.length;
        f = cadre('rampe', Math.floor(((this.phase / (Math.PI*2)) % 1) * n));
      } else f = cadre('accroupi', marche ? Math.floor(this.phase * 2) % 2 : 0);
    } else if (marche){
      const anim = allure > 0.72 ? 'course' : 'marche';
      const n = CADRES_PERSO[anim].length;
      // la phase avance avec la DISTANCE parcourue : pas de patinage
      f = cadre(anim, Math.floor(((this.phase / (Math.PI*2)) % 1) * n));
    } else {
      f = cadre('marche', 0);
    }
    const flip = this.sens < 0;   // la planche regarde vers la droite
    spr.setTexture('persoAtlas', f.nom);
    spr.setFlipX(flip);
    spr.setOrigin(flip ? 1 - f.c.ox : f.c.ox, f.c.oy);
    // en rampant sans planche dédiée : petit balancement vertical et
    // inclinaison vers l'avant, pour une vraie allure de progression
    const rampeSansPlanche = auSol && this.accroupi && marche
      && !this.attaque && !this.charge && !CADRES_PERSO.rampe;
    spr.setPosition(this.joueur.x, this.joueur.y + PIEDS + 2
      - (rampeSansPlanche ? Math.abs(Math.sin(this.phase * 2)) * 2.5 : 0));
    spr.setRotation(rampeSansPlanche ? this.sens * (0.09 + Math.sin(this.phase * 4) * 0.05) : 0);
    // seuls les tirs et le jet n'ont pas de pose accroupie : pour eux on
    // tasse encore le sprite — poing et pied ont leurs vraies frames
    const cA = this.attaque && COUPS[this.attaque.type];
    const basQuiFrappe = !!(cA && this.attaque.bas && (cA.tir || cA.faisceau || cA.jet));
    spr.setScale(ECHELLE_PERSO * (1 + this.squash*0.22),
                 ECHELLE_PERSO * (1 - this.squash*0.22) * (basQuiFrappe ? 0.72 : 1));
    // le pied ou le retourné élastiques n'ont pas de planche à aura : le
    // corps s'embrase par teinte ; le poing chargé, lui, a ses frames
    if (this.attaque && this.attaque.elastique && !f.nom.startsWith('poingCharge'))
      spr.setTint(0xffd166);
    else spr.clearTint();
    spr.setAlpha(this.etat === 'jeu' && this.invuln > 0 && Math.floor(this.invuln*20) % 2 === 0 ? 0.35 : 1);

    // l'ombre au sol et la lueur de charge restent dessinées à la main
    g.setPosition(this.joueur.x, this.joueur.y + PIEDS);
    g.setScale(this.sens, 1); g.setRotation(0); g.setAlpha(1);
    if (auSol && this.etat !== 'perdu' && this.etat !== 'gameover'){
      g.fillStyle(0x000000, 0.28); g.fillEllipse(0, 1, 28, 7);
    }
    if (this.charge){
      const k = Math.min(1, this.charge.t / CFG.seuilElastique);
      const bas = this.charge.action === 'pied';
      const cy = bas ? -8 : -26;
      g.fillStyle(this.charge.pret ? 0xffd166 : 0x4dd6c1, 0.28 + 0.25*k);
      g.fillCircle(13, cy, 4 + k*5);
      if (this.charge.pret){ g.fillStyle(0xffffff, 0.85); g.fillCircle(13, cy, 2); }
    }
  },

  membre(g, hx, hy, tx, ty, l1, l2, sens, c1, c2, e1, e2){
    const dx = tx-hx, dy = ty-hy;
    const d = Math.min(Math.hypot(dx, dy), l1+l2-0.001) || 0.001;
    const a = Math.atan2(dy, dx);
    const c = (d*d + l1*l1 - l2*l2) / (2*d*l1);
    const ang = a + sens*Math.acos(Math.max(-1, Math.min(1, c)));
    const kx = hx + Math.cos(ang)*l1, ky = hy + Math.sin(ang)*l1;
    g.lineStyle(e1, c1, 1);
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.strokePath();
    g.lineStyle(e2, c2, 1);
    g.beginPath(); g.moveTo(kx, ky); g.lineTo(tx, ty); g.strokePath();
    g.fillStyle(c1, 1); g.fillCircle(hx, hy, e1/2); g.fillCircle(kx, ky, e1/2);
    g.fillStyle(c2, 1); g.fillCircle(tx, ty, e2/2);
  },
});

// ═══════════════ src/demarrage.js ═══════════════
// ─────────────────────────────────────────────────────────────
// ÉCRAN-TITRE
// Le jeu n'est construit qu'au moment où on appuie : rien ne tourne
// derrière le titre, et la première image affichée est déjà jouable.
// Au game over, retourAuTitre() détruit la partie et rend l'écran
// d'accueil ; le prochain appui repart de zéro.
// ─────────────────────────────────────────────────────────────
let partie = null;

function demarrer(){
  if (partie || typeof Phaser === 'undefined') return;
  document.body.classList.add('enjeu');
  SON.demarrer();   // iOS n'ouvre l'audio que dans un geste utilisateur
  ENTREE.axeX = 0; ENTREE.saut = false; ENTREE.sautPresse = false;
  ENTREE.accroupi = false; ENTREE.chargeAction = null; ENTREE.relache = null;
  ENTREE.haut = false; ENTREE.hautPresse = false; ENTREE.validePresse = false;
  PARTIE = nouvellePartieEtat();

  partie = new Phaser.Game({
    type: Phaser.AUTO,
    width: L, height: H,
    parent: 'conteneur',
    backgroundColor: '#0d1120',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default:'arcade', arcade: { gravity:{ y: CFG.gravite }, debug:false } },
    scene: Combat,
  });
  // accessible depuis la console du navigateur pour régler le jeu à chaud :
  // jeu.scene.getScene('combat').munitions = 99
  window.jeu = partie;

  // iOS ne recalcule pas toujours la taille du parent tout de suite après
  // une rotation : on force un rafraîchissement peu après l'événement.
  // La garde sur partie compte : après un retour au titre, l'écouteur
  // survit à la partie détruite.
  const rafraichir = () => setTimeout(() => { if (partie) partie.scale.refresh(); }, 120);
  addEventListener('orientationchange', rafraichir);
  addEventListener('resize', rafraichir);
}

function retourAuTitre(){
  if (!partie) return;
  partie.destroy(true);   // true : retire aussi le canvas de la page
  partie = null;
  window.jeu = null;
  document.body.classList.remove('enjeu');
  afficherRecord();       // la partie perdue vient peut-être de le battre
}

// le choix de difficulté : sélectionne sans lancer la partie, et s'en
// souvient d'une fois sur l'autre
const choixDiff = document.getElementById('choixDiff');
function majChoixDiff(){
  for (const b of choixDiff.querySelectorAll('button'))
    b.classList.toggle('choisi', b.dataset.d === DIFFICULTE_CHOISIE);
}
majChoixDiff();
choixDiff.addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  e.stopPropagation();   // l'écran-titre lance la partie au moindre appui : pas ici
  DIFFICULTE_CHOISIE = b.dataset.d;
  try { localStorage.setItem('mgc-difficulte', DIFFICULTE_CHOISIE); } catch (err) {}
  majChoixDiff();
});

if (typeof Phaser !== 'undefined'){
  document.getElementById('titre').addEventListener('pointerdown', e => {
    e.preventDefault(); demarrer();
  });
  addEventListener('keydown', e => {
    if (!partie && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')){
      e.preventDefault(); demarrer();
    }
  });
}
</script>
</body>
</html>
