  #conteneur{position:fixed;inset:0}

  .erreur{color:#e2584d;max-width:640px;text-align:center;padding:20px}

  .rotation{

  .titre{

  body:not(.enjeu) .manette{display:none}

  .jeu{
    font-family:'Arcade',ui-monospace,monospace;

// Le numéro est affiché sur l'écran-titre : il suffit de le lire pour
// savoir ce qu'on a sous les yeux. Au chargement on redemande la page
// au serveur sans passer par le cache ; si elle annonce une version

(function verifierVersion(){
  if (location.protocol === 'file:' || typeof fetch !== 'function') return;
  let tentee = null;
  try { tentee = sessionStorage.getItem('mgc-version-tentee'); } catch (e) {}
  fetch(location.pathname + '?cb=' + Date.now(), { cache:'no-store' })
    .then(r => r.ok ? r.text() : null)
    .then(txt => {
      if (!txt) return;
      const m = txt.match(/const VERSION = '([^']+)'/);
      if (!m) return;
      if (m[1] === VERSION){
        try { sessionStorage.removeItem('mgc-version-tentee'); } catch (e) {}
        return;
      }
      if (tentee === m[1]) return;   // déjà tenté pour cette version : on n'insiste pas
      try { sessionStorage.setItem('mgc-version-tentee', m[1]); } catch (e) {}
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    })
    .catch(() => {});   // hors ligne ou origine inaccessible : on joue la version en place
})();

(function afficherVersion(){
  const el = document.getElementById('version');
  if (el) el.textContent = 'v' + VERSION;

// Le niveau est tiré au sort, mais toujours à partir de cette graine :
// mourir et réapparaître ne doit pas redessiner le monde sous nos pieds.
let GRAINE = (Math.random() * 1e9) | 0;
function generateur(s){
  return function(){
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

           arme:null, munitions:0, segments:0, vaincus:0, morts:0 };
}
PARTIE = nouvellePartieEtat();

// ─────────────────────────────────────────────────────────────
// SON
// Tout est synthétisé à la volée : aucun fichier à charger, donc le
// jeu tient toujours en un seul fichier. iOS n'autorise l'audio qu'après
// un geste — d'où le démarrage au moment où on lance la partie.
// ─────────────────────────────────────────────────────────────
const SON = {
  ctx:null, sortie:null, actif:true,
  demarrer(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.sortie = this.ctx.createGain();
    this.sortie.gain.value = 0.26;
    this.sortie.connect(this.ctx.destination);
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  note(forme, f0, f1, duree, vol, delai){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime + (delai || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = forme;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + duree);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g); g.connect(this.sortie);
    o.start(t); o.stop(t + duree + 0.03);
  },
  souffle(duree, vol, freq, q){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * duree));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.sortie);
    s.start(t);
  },
  jouer(nom){
    if (!this.ctx || !this.actif) return;
    switch (nom){
      case 'poing':    this.souffle(0.09, 0.45, 900, 1.2); this.note('sine', 180, 90, 0.09, 0.22); break;
      case 'pied':     this.souffle(0.16, 0.5, 520, 1.0);  this.note('sine', 150, 60, 0.16, 0.26); break;
      case 'retourne': this.souffle(0.28, 0.4, 380, 0.8);  this.note('triangle', 230, 70, 0.3, 0.24); break;
      case 'laser':    this.note('sawtooth', 1500, 190, 0.3, 0.3); this.note('square', 720, 95, 0.3, 0.14); break;
      case 'pistolet': this.souffle(0.07, 0.55, 1800, 1.4); this.note('square', 620, 160, 0.08, 0.22); break;
      case 'fusil':    this.souffle(0.22, 0.7, 700, 0.6);   this.note('sawtooth', 260, 70, 0.22, 0.3); break;
      case 'touche':   this.souffle(0.11, 0.5, 1500, 0.9);  this.note('square', 330, 130, 0.09, 0.2); break;
      case 'blinde':   this.note('square', 1200, 900, 0.11, 0.22); this.souffle(0.09, 0.3, 2600, 2); break;
      case 'vaincu':   this.note('square', 420, 80, 0.34, 0.24); this.souffle(0.3, 0.32, 700, 0.6); break;
      case 'saut':     this.note('sine', 320, 640, 0.12, 0.2); break;
      case 'saut2':    this.note('triangle', 520, 880, 0.14, 0.2); this.souffle(0.1, 0.2, 1400, 1); break;
      case 'caisse':   this.souffle(0.2, 0.55, 300, 0.5); this.note('triangle', 150, 60, 0.18, 0.2); break;
      case 'coeur':    this.note('sine', 660, 660, 0.1, 0.24); this.note('sine', 990, 990, 0.14, 0.24, 0.09); break;
      case 'arme':     [440,660,880,1320].forEach((f,i) => this.note('square', f, f, 0.1, 0.16, i*0.06)); break;
      case 'degat':    this.note('sawtooth', 300, 70, 0.3, 0.28); this.souffle(0.2, 0.32, 400, 0.7); break;
      case 'mort':     [440,330,262,196].forEach((f,i) => this.note('triangle', f, f, 0.26, 0.22, i*0.16)); break;
      case 'gagne':    [523,659,784,1047].forEach((f,i) => this.note('square', f, f, 0.2, 0.2, i*0.11)); break;
      case 'vide':     this.note('square', 160, 120, 0.06, 0.12); break;
      case 'ejecte':   this.note('square', 1100, 700, 0.07, 0.18); this.souffle(0.14, 0.32, 900, 1.2); break;
      case 'tendu':    this.note('square', 620, 980, 0.09, 0.16); break;
      case 'competence':[523,784,1047,1568].forEach((f,i) => this.note('square', f, f, 0.13, 0.2, i*0.07)); break;
      case 'unevie':   [392,523,659,784,1047].forEach((f,i) => this.note('triangle', f, f, 0.16, 0.22, i*0.07)); break;
      case 'recharge': this.note('square', 500, 500, 0.05, 0.16); this.note('square', 950, 950, 0.06, 0.2, 0.08); break;
      case 'visee':    this.note('square', 900, 1500, 0.5, 0.09); break;
      case 'tirEnnemi':this.note('sawtooth', 500, 200, 0.14, 0.18); break;
      case 'charge':   this.note('sawtooth', 120, 300, 0.4, 0.14); break;
      case 'ascenseur':[392,523,659].forEach((f,i) => this.note('sine', f, f, 0.5, 0.22, i*0.13));
                       this.souffle(0.6, 0.12, 200, 0.5); break;
      case 'final':    [523,659,784,1047,1319].forEach((f,i) => this.note('square', f, f, 0.28, 0.22, i*0.16)); break;
    }
  },
};

// ═══════════════ src/entrees.js ═══════════════
// ─────────────────────────────────────────────────────────────
// ZOOM
// iOS ignore user-scalable=no depuis iOS 10, et touch-action n'a été
// suivi qu'à partir de Safari 13. On coupe donc aussi à la main les
// deux gestes qui zooment : le double-tap et le pincement.
// ─────────────────────────────────────────────────────────────
for (const ev of ['gesturestart','gesturechange','gestureend'])
  addEventListener(ev, e => e.preventDefault(), { passive:false });

let dernierTap = 0;
addEventListener('touchend', e => {
  if (e.timeStamp - dernierTap < 350) e.preventDefault();
  dernierTap = e.timeStamp;
}, { passive:false });

addEventListener('dblclick', e => e.preventDefault(), { passive:false });

// ─────────────────────────────────────────────────────────────
// MANETTE TACTILE
// Joystick : gauche/droite pour avancer, bas pour s'accroupir et ramper,
// haut pour l'uppercut. Saut sur ✕ (deux fois pour le double saut), et
// le bouton poing cède sa place à l'arme dès qu'on en ramasse une.
// ─────────────────────────────────────────────────────────────
const ENTREE = {
  axeX:0, saut:false, sautPresse:false, accroupi:false,
  haut:false, hautPresse:false, hautT:0,
  // un coup se CHARGE tant que le bouton est tenu, et part au relâché :
  // bref = coup normal, tenu = coup élastique (s'il reste de l'endurance)
  chargeAction:null, chargeDebut:0, relache:null,
  validePresse:false,
};

const socle = document.getElementById('socle');
const pouce = document.getElementById('pouce');
let pointeurJoystick = null;

function majJoystick(e){
  const r = socle.getBoundingClientRect();
  const rayon = r.width / 2;
  let dx = e.clientX - (r.left + rayon);
  let dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  const limite = rayon - 12;
  if (d > limite){ dx *= limite / d; dy *= limite / d; }
  pouce.style.transform = `translate(${dx}px, ${dy}px)`;

  const nx = dx / limite, ny = dy / limite;
  // on réétale [zoneMorte, 1] sur [0, 1] : sans ça la vitesse sautait
  // d'un coup à 24 % dès qu'on quittait le centre, au lieu de partir de zéro
  const a = Math.abs(nx);
  ENTREE.axeX = a < CFG.zoneMorte ? 0
    : Math.sign(nx) * Math.min(1, (a - CFG.zoneMorte) / (1 - CFG.zoneMorte));

  // l'uppercut exige une poussée franchement verticale, sinon courir en
  // diagonale vers le haut le déclencherait sans arrêt
  const versLeHaut = ny < -CFG.seuilHaut && Math.abs(ny) > Math.abs(nx);
  if (versLeHaut && !ENTREE.haut){ ENTREE.hautPresse = true; ENTREE.hautT = performance.now(); ENTREE.validePresse = true; }
  ENTREE.haut = versLeHaut;
  // en bas, pas d'exigence de ce genre : bas + côté, c'est ramper
  ENTREE.accroupi = ny > CFG.seuilBas;
}
function relacherJoystick(){
  pointeurJoystick = null;
  ENTREE.axeX = 0; ENTREE.haut = false; ENTREE.accroupi = false;
  pouce.style.transform = 'translate(0,0)';
  socle.classList.remove('actif');
}

// la capture de pointeur est un confort, pas une condition : si elle
// échoue, il ne faut surtout pas que l'appui soit perdu avec elle
function capturer(el, id){ try { el.setPointerCapture(id); } catch (e) {} }

socle.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointeurJoystick = e.pointerId;
  capturer(socle, e.pointerId);
  socle.classList.add('actif');
  majJoystick(e);
});
socle.addEventListener('pointermove', e => { if (e.pointerId === pointeurJoystick) majJoystick(e); });
for (const ev of ['pointerup','pointercancel','lostpointercapture'])
  socle.addEventListener(ev, e => { if (e.pointerId === pointeurJoystick) relacherJoystick(); });

for (const b of document.querySelectorAll('.pad button')){
  const a = b.dataset.action;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    capturer(b, e.pointerId);
    if (a === 'saut'){ ENTREE.saut = true; ENTREE.sautPresse = true; }
    else { ENTREE.chargeAction = a; ENTREE.chargeDebut = performance.now(); }
    ENTREE.validePresse = true;   // n'importe quel bouton relance après une mort
  });
  // relâcher ✕ écourte le saut ; relâcher un coup le déclenche
  const fin = () => {
    if (a === 'saut'){ ENTREE.saut = false; return; }
    if (ENTREE.chargeAction === a){
      ENTREE.relache = { action:a, duree:(performance.now() - ENTREE.chargeDebut)/1000, quand:performance.now() };
      ENTREE.chargeAction = null;
    }
  };
  for (const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev, fin);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// le bouton poing affiche l'arme en cours et ses munitions
const boutonArme = document.querySelector('.b-carre');
function majBoutonArme(arme, munitions, segments){
  const signe = boutonArme.querySelector('.signe');
  const nom   = boutonArme.querySelector('.nom');
  boutonArme.classList.toggle('armee', !!arme);
  boutonArme.classList.toggle('vide', !!arme && munitions <= 0);
  if (arme && munitions <= 0){
    // bracelet vide : l'appui éjecte le segment usé et recharge
    signe.textContent = '↻';
    nom.textContent = 'RECHARGE';
  } else if (arme){
    signe.textContent = '✦';
    nom.textContent = ARMES[arme].nom + ' ' + munitions + (segments > 0 ? '·' + segments : '');
  } else {
    signe.textContent = '□';
    nom.textContent = 'POING';
  }
}

const boutonSon = document.getElementById('son');
boutonSon.addEventListener('pointerdown', e => {
  e.preventDefault();
  SON.actif = !SON.actif;
  boutonSon.classList.toggle('coupe', !SON.actif);
  boutonSon.textContent = SON.actif ? '♪' : '✕';
  if (SON.actif) SON.jouer('coeur');
});

// clavier de secours pour tester sur un ordinateur
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  { ENTREE.axeX = -1; e.preventDefault(); }
  if (e.code === 'ArrowRight') { ENTREE.axeX =  1; e.preventDefault(); }
  if (e.code === 'ArrowDown')  { ENTREE.accroupi = true; e.preventDefault(); }
  if (e.code === 'ArrowUp' && !e.repeat){
    ENTREE.hautPresse = true; ENTREE.hautT = performance.now(); ENTREE.validePresse = true; e.preventDefault();
  }
  if (e.code === 'Space' && !e.repeat){
    ENTREE.saut = true; ENTREE.sautPresse = true; ENTREE.validePresse = true; e.preventDefault();
  }
  const touches = { KeyA:'poing', KeyZ:'pied', KeyE:'retourne' };
  if (touches[e.code] && !e.repeat){
    ENTREE.chargeAction = touches[e.code]; ENTREE.chargeDebut = performance.now();
    ENTREE.validePresse = true;
  }
});
addEventListener('keyup', e => {
  if ((e.code === 'ArrowLeft' && ENTREE.axeX < 0) || (e.code === 'ArrowRight' && ENTREE.axeX > 0)) ENTREE.axeX = 0;
  if (e.code === 'ArrowDown') ENTREE.accroupi = false;
  if (e.code === 'Space') ENTREE.saut = false;
  const touches = { KeyA:'poing', KeyZ:'pied', KeyE:'retourne' };
  if (touches[e.code] && ENTREE.chargeAction === touches[e.code]){
    ENTREE.relache = { action:touches[e.code], duree:(performance.now() - ENTREE.chargeDebut)/1000, quand:performance.now() };
    ENTREE.chargeAction = null;
  }
});

// ═══════════════ src/moteur.js ═══════════════
// ─────────────────────────────────────────────────────────────
// SCÈNE
// ─────────────────────────────────────────────────────────────
class Combat extends Phaser.Scene {
  constructor(){ super('combat'); }

  preload(){
    // l'atlas du héros vient d'une donnée base64 : le Loader sait la
    // charger, et create() n'est appelé qu'une fois la texture prête.
    // Aux étages suivants (scene.restart) elle est déjà là.
    if (!this.textures.exists('persoAtlas'))
      this.load.image('persoAtlas', ATLAS_PERSO);
  }

  create(){
    this.def = NIVEAUX[Math.min(PARTIE.niveau, NIVEAUX.length - 1)];
    this.D = DIFFICULTES[PARTIE.difficulte] || DIFFICULTES.moyen;
    this.largeur = this.def.largeur;
    // graine dérivée de l'étage : chaque étage a sa propre disposition,
    // et mourir ne la redessine pas
    this.alea = generateur(GRAINE + PARTIE.niveau * 7919);

    this.phase = 0; this.squash = 0; this.sens = 1;
    this.coyote = 0; this.buffer = 0; this.sautsAir = 0;
    this.attaque = null;
    this.pv = PARTIE.pv; this.invuln = CFG.invulnRenais;
    this.vaincus = PARTIE.vaincus; this.morts = PARTIE.morts;
    this.arme = PARTIE.arme; this.munitions = PARTIE.munitions;
    this.segments = PARTIE.segments | 0;
    this.etat = 'jeu'; this.accroupi = false;
    this.astuceBas = false; this.astuceHaut = false;
    this.eclats = []; this.objets = []; this.caisses = [];
    this.bulles = []; this.bulleSuiv = 0;
    this.tirs = []; this.tirsEnnemis = [];
    this.msg = null; this.transition = 0;
    this.endurance = CFG.enduranceMax;
    this.charge = null; this.chargeAIgnorer = null; this.astuceEndurance = false;
    this.sAvant = 0;
    majBoutonArme(this.arme, this.munitions, this.segments);

    this.fond = this.add.graphics().setScrollFactor(0).setDepth(-10);
    this.gSortie = this.add.graphics().setDepth(-2);
    this.sols = this.add.group();
    this.plateformes = this.add.group();
    this.grCaisses = this.add.group();
    this.monstres = [];

    this.joueur = this.add.rectangle(120, SOL_Y - 60, 28, 40, 0xffffff, 0);
    this.physics.add.existing(this.joueur);
    this.joueur.body.setCollideWorldBounds(true);
    this.checkpoint = { x:120, y:SOL_Y - 60 };
    this.piedsAvant = SOL_Y - 40;

    this.gCaisses  = this.add.graphics().setDepth(3);
    this.gMonstres = this.add.graphics().setDepth(4);
    this.gObjets   = this.add.graphics().setDepth(4.5);
    this.perso     = this.add.graphics().setDepth(5);
    // le héros en pixel-art : on déclare chaque frame de l'atlas (une
    // seule fois, la texture survit aux restarts), puis l'image qui les
    // affichera et un petit pool de boules de feu pour les balles
    const texPerso = this.textures.get('persoAtlas');
    texPerso.setFilter(Phaser.Textures.FilterMode.NEAREST);
    for (const anim in CADRES_PERSO)
      CADRES_PERSO[anim].forEach((c, i) => {
        if (!texPerso.has(anim + i)) texPerso.add(anim + i, 0, c.x, c.y, c.w, c.h);
      });
    this.persoSpr = this.add.image(0, 0, 'persoAtlas', 'marche0').setDepth(5);
    this.imgTirs = [];
    for (let i = 0; i < 10; i++)
      this.imgTirs.push(this.add.image(0, 0, 'persoAtlas', 'boule0')
        .setDepth(7).setVisible(false).setScale(0.7));
    this.gEclats   = this.add.graphics().setDepth(6);
    this.gTirs     = this.add.graphics().setDepth(7);
    // huit textes recycles pour les onomatopees : creer un objet texte a
    // chaque coup coute cher, on fait tourner un petit pool
    for (let i = 0; i < 8; i++){
      const t = this.add.text(0, 0, '', { fontFamily:'Arcade, ui-monospace, monospace', fontSize:'18px', color:'#ffffff' })
        .setStroke('#0d1120', 6).setOrigin(0.5).setDepth(8).setVisible(false);
      this.bulles.push({ t, vie:0, max:1, vy:0 });
    }

    this.construireNiveau();
    // Les limites sont posées APRÈS la construction : la sortie tombe où
    // le tirage l'a mise, et si le monde s'arrêtait à la largeur nominale
    // elle pouvait se retrouver derrière le mur invisible, donc
    // inatteignable, et hors du champ que la caméra sait atteindre.
    this.physics.world.setBounds(0, -400, this.largeur, H + 900);
    // Pas de mur en bas : setCollideWorldBounds sert à empêcher de sortir
    // par les côtés, mais s'il bloque aussi le bas, on ne tombe jamais
    // vraiment et le test de chute ne se déclenche pas.
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBounds(0, 0, this.largeur, H);

    this.physics.add.collider(this.joueur, this.sols);
    this.physics.add.collider(this.joueur, this.plateformes);
    this.physics.add.collider(this.joueur, this.grCaisses);
    this.cameras.main.startFollow(this.joueur, true, 0.12, 0.1, 0, 60);

    this.hud = this.add.graphics().setScrollFactor(0).setDepth(10);
    this.hudTexte = this.add.text(22, 60, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'12px', color:'#aeb9dd' })
      .setStroke('#0d1120', 3).setScrollFactor(0).setDepth(10);
    this.hudMsg = this.add.text(L/2, 96, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'13px', color:'#ffd98a' })
      .setStroke('#0d1120', 4).setOrigin(0.5).setScrollFactor(0).setDepth(11).setAlpha(0);
    this.hudBoss = this.add.text(L/2, H - 48, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'11px', color:'#ffb0a8' })
      .setStroke('#0d1120', 3).setOrigin(0.5).setScrollFactor(0).setDepth(11).setAlpha(0);
    this.hudFin = this.add.text(L/2, H/2 - 30, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'18px', color:'#cbd5f0', align:'center' })
      .setStroke('#0d1120', 5).setOrigin(0.5).setScrollFactor(0).setDepth(11);

    this.message(this.def.nom + '  —  ' + this.def.sous);
  }

  // ── couleurs ────────────────────────────────────────────────
  urbain(x){ return Phaser.Math.Clamp((x / this.largeur - 0.42) / 0.26, 0, 1); }
  melange(a, b, t){
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    return (((ar+(br-ar)*t)|0)<<16) | (((ag+(bg-ag)*t)|0)<<8) | ((ab+(bb-ab)*t)|0);
  }
  couleurSol(x){
    const t = this.def.teinte;
    if (this.def.decor === 'interieur') return t ? [t.sol, t.solBord] : [COUL.solDedans, COUL.solBordDedans];
    if (this.def.decor === 'toit')      return [COUL.solToit, COUL.solBordToit];
    if (t) return [t.sol, t.solBord];   // forêt, désert, ville de jour
    const u = this.urbain(x);
    return [this.melange(COUL.sol, COUL.solVille, u), this.melange(COUL.solBord, COUL.solBordVille, u)];
  }

  // ── construction ────────────────────────────────────────────
  creerSol(x, w){
    // un seul corps physique, mais le visuel est tranché en lamelles dans
    // la zone de transition : sinon la couleur saute d'un bloc à l'autre
    const r = this.add.rectangle(x + w/2, SOL_Y + (H - SOL_Y)/2, w, H - SOL_Y, 0, 0);
    this.physics.add.existing(r, true);
    this.sols.add(r);
    this.segmentsSol.push({ x0:x, x1:x + w });

    const degrade = this.def.decor === 'exterieur' && this.urbain(x) !== this.urbain(x + w);
    const pas = degrade ? 40 : w;
    for (let sx = x; sx < x + w; sx += pas){
      const lw = Math.min(pas, x + w - sx);
      const [c, cb] = this.couleurSol(sx + lw/2);
      this.add.rectangle(sx + lw/2, SOL_Y + (H - SOL_Y)/2, lw + 1, H - SOL_Y, c).setDepth(-5);
      this.add.rectangle(sx + lw/2, SOL_Y + 2, lw + 1, 4, cb).setDepth(-4);
    }
  }
  creerPlateforme(x, y, w){
    const t = this.def.teinte;
    const dedans = this.def.decor !== 'exterieur';
    const p = this.add.rectangle(x + w/2, y + 7, w, 14, t ? t.plat : dedans ? 0x2a3152 : COUL.plat)
      .setStrokeStyle(2, t ? t.platBord : dedans ? 0x7f8cc4 : COUL.platBord);
    this.physics.add.existing(p, true);
    p.body.checkCollision.down = false;
    p.body.checkCollision.left = false;
    p.body.checkCollision.right = false;
    this.plateformes.add(p);
  }
  // y a-t-il du sol sous ce x ? (les trous sont les intervalles laissés
  // entre deux segments par le tirage)
  solSous(x){
    return this.segmentsSol.some(s => x >= s.x0 && x <= s.x1);
  }
  // un monstre quand même tombé dans un trou (recul en cloche, bond de
  // charge...) n'est pas perdu : on le repêche sur le sol le plus proche.
  // Avant, il était détruit en silence — un boss au fond d'un trou
  // laissait la sortie verrouillée à jamais.
  repecher(m){
    let cx = m.go.x, mieux = Infinity;
    for (const s of this.segmentsSol){
      const p = Phaser.Math.Clamp(m.go.x, s.x0 + 40, s.x1 - 40);
      const d = Math.abs(p - m.go.x);
      if (d < mieux){ mieux = d; cx = p; }
    }
    m.go.body.reset(cx, m.baseY);
    m.assomme = 0.6;
  }
  creerMonstre(type, x, minX, maxX){
    const d = MONSTRES[type];
    const y = SOL_Y - d.taille[1]/2 - d.vol;
    const go = this.add.rectangle(x, y, d.taille[0], d.taille[1], 0xffffff, 0);
    this.physics.add.existing(go);
    go.body.setCollideWorldBounds(true);
    if (d.vole || d.fixe){
      go.body.setAllowGravity(false);
      if (d.fixe) go.body.setImmovable(true);
    } else {
      this.physics.add.collider(go, this.sols);
      this.physics.add.collider(go, this.plateformes);
      this.physics.add.collider(go, this.grCaisses);
    }
    const pv = Math.max(1, Math.round(d.pv * this.D.pv));
    const m = {
      go, type, def:d, pv, pvMax:pv, assomme:0, flash:0, blinde:0,
      dir:-1, minX, maxX, baseY:y, phase:this.alea()*6,
      prepare:0, repos:0, vise:0,
    };
    this.monstres.push(m);
    return m;
  }
  creerCaisse(x){
    const c = this.add.rectangle(x, SOL_Y - 15, 30, 30, 0xffffff, 0);
    this.physics.add.existing(c, true);
    this.grCaisses.add(c);
    this.caisses.push({ go:c, pv:2, flash:0 });
  }
  tirerType(x){
    const p = this.def.peuple;
    if (this.def.decor === 'exterieur'){
      // dehors, le violet cède la place au drone à mesure qu'on entre en ville
      const u = this.urbain(x), r = this.alea();
      if (r < 0.14) return 'colosse';
      return r < 0.14 + (1 - u) * 0.86 ? 'baveux' : 'drone';
    }
    return p[Math.floor(this.alea() * p.length)];
  }
  construireNiveau(){
    const larg = this.largeur;
    this.segmentsSol = [];
    this.creerSol(-200, 900);
    let x = 700;
    // dedans le sol est plus continu que dans la rue : on est dans un
    // bâtiment, pas sur un terrain vague
    const dedans = this.def.decor !== 'exterieur';
    while (x < larg - 700){
      const long = (dedans ? 480 : 380) + this.alea() * 420;
      this.creerSol(x, long);
      if (this.alea() < (dedans ? 0.6 : 0.4))
        this.creerPlateforme(x + long*0.35, SOL_Y - 100 - this.alea()*40, 110 + this.alea()*80);
      let nb = 1 + (this.alea() < 0.45 ? 1 : 0);
      if (this.D.monstres > 1 && this.alea() < this.D.monstres - 1) nb++;
      if (this.D.monstres < 1 && this.alea() > this.D.monstres && nb > 1) nb--;
      for (let i = 0; i < nb; i++){
        const mx = x + 80 + this.alea()*(long - 160);
        this.creerMonstre(this.tirerType(mx), mx, x + 30, x + long - 30);
      }
      if (this.alea() < 0.45) this.creerCaisse(x + 60 + this.alea()*(long - 120));
      x += long;
      // moins de trous à l'intérieur, et jamais sur le toit près du bord
      if (this.alea() < (dedans ? 0.35 : 0.55)) x += 70 + this.alea()*40;
    }
    this.sortieX = x + 620;
    // le monde doit englober la sortie, sinon elle est hors d'atteinte
    this.largeur = Math.max(this.largeur, this.sortieX + 300);
    // et le dernier sol court jusqu'au mur : il s'arrêtait 120 px avant,
    // dépasser l'ascenseur en courant faisait tomber dans le vide
    this.creerSol(x, this.largeur - x + 60);

    // le boss garde la sortie : elle reste verrouillée tant qu'il tient
    this.boss = this.creerMonstre(this.def.boss, this.sortieX - 190, x + 60, this.sortieX - 40);
    this.bossVivant = true;
  }

  // ── combat ──────────────────────────────────────────────────
  lancerAttaque(type, elastique){
    if (this.attaque) return;
    const c = COUPS[type];
    this.attaque = { type, t:0, bas:this.accroupi, elastique: !!elastique && !!c.portee, touches:new Set() };
    if (this.attaque.elastique) this.crier(this.joueur.x, this.joueur.y - 32, CRIS.kiai, '#ffd166', 15);
    SON.jouer(c.son);
    // pas de secousse ici : l'écran ne tremble qu'à l'IMPACT (frapper,
    // casser) — un coup dans le vide ne secoue plus rien
    if (c.tir) this.tirer(c);
    if (c.jet) this.ejecterSegment(c);
    if (c.elan && this.joueur.body.blocked.down && !this.accroupi)
      this.joueur.body.setVelocityX(this.sens * c.elan);
  }
  utiliserArme(){
    if (!this.arme){ SON.jouer('vide'); return; }
    if (this.attaque) return;
    if (this.munitions <= 0){
      // bracelet vide : l'appui éjecte le segment usé — le jet est une
      // arme — et un segment neuf s'enclenche s'il en reste
      this.lancerAttaque('jet');
      return;
    }
    this.munitions--;
    this.lancerAttaque(this.arme);
    majBoutonArme(this.arme, this.munitions, this.segments);
  }
  ejecterSegment(c){
    const a = ARMES[this.arme];
    const y = this.joueur.y + PIEDS + c.dy + (this.attaque.bas ? DECALAGE_ACCROUPI : 0);
    // le segment usé part en cloche et tournoie : gravité propre, il se
    // brise au sol
    this.tirs.push({ x:this.joueur.x + this.sens*14, y,
      vx:this.sens*430, vy:-190, g:1400,
      degats:c.degats, recul:c.recul, bas:this.attaque.bas,
      couleur:a.couleur, clair:a.clair, jet:true, vie:1.6 });
    if (this.segments > 0){
      this.segments--;
      this.munitions = a.munitions;
      SON.jouer('recharge');
      this.message('SEGMENT NEUF  —  ' + a.nom + ' ×' + this.munitions);
    } else {
      // c'était la dernière pièce du bracelet, elle vient d'être jetée
      this.arme = null; this.munitions = 0;
      this.message('BRACELET ÉPUISÉ');
    }
    majBoutonArme(this.arme, this.munitions, this.segments);
  }
  tirer(c){
    const y = this.joueur.y + PIEDS + c.dy + (this.accroupi ? DECALAGE_ACCROUPI : 0);
    for (let i = 0; i < c.tir.nb; i++){
      const ec = (c.tir.nb === 1) ? 0 : (i - (c.tir.nb-1)/2) * c.tir.dispersion;
      this.tirs.push({
        x: this.joueur.x + this.sens*16, y,
        vx: this.sens * c.tir.vitesse * Math.cos(ec),
        vy: c.tir.vitesse * Math.sin(ec),
        degats: c.degats, recul: c.recul, bas: this.attaque.bas,
        couleur: ARMES[this.arme] ? ARMES[this.arme].couleur : 0xffd166,
        vie: 1.1,
      });
    }
  }
  zonesAttaque(){
    const c = COUPS[this.attaque.type];
    if (!c.portee) return [];
    const portee = c.portee * (this.attaque.elastique ? CFG.porteeElastique : 1);
    const dirs = c.bilateral ? [1, -1] : [this.sens];
    const y = this.joueur.y + PIEDS + c.dy + (this.attaque.bas ? DECALAGE_ACCROUPI : 0);
    return dirs.map(d => {
      const cx = this.joueur.x + d * (14 + portee/2);
      return new Phaser.Geom.Rectangle(cx - portee/2, y - c.hauteur/2, portee, c.hauteur);
    });
  }
  vulnerable(m, bas){
    if (m.def.faible === 'bas')  return bas;
    if (m.def.faible === 'haut') return !bas;
    return true;
  }
  frapper(m, degats, recul, bas, sourceX, ecrase){
    // l'écrasement vient du dessus : la règle des hauteurs ne s'applique
    // qu'aux coups horizontaux, on retombe sur n'importe quelle bestiole
    if (!ecrase && !this.vulnerable(m, bas)){
      m.blinde = 0.18;
      SON.jouer('blinde');
      this.eclat(m.go.x, m.go.y, 0, 3, COUL.blinde);
      this.crier(m.go.x, m.go.y - m.def.taille[1]/2 - 14, CRIS.blinde, '#9fb4ff', 14);
      if (m.def.faible === 'bas' && !this.astuceBas){
        this.astuceBas = true;
        this.message("ACCROUPIS-TOI POUR TOUCHER LE VIOLET");
      } else if (m.def.faible === 'haut' && !this.astuceHaut){
        this.astuceHaut = true;
        this.message('LE DRONE VOLE TROP HAUT, RELÈVE-TOI');
      }
      return;
    }
    const dir = Math.sign(m.go.x - sourceX) || this.sens;
    const hautCri = m.go.y - m.def.taille[1]/2 - 16;
    m.pv -= degats; m.flash = 0.14;
    if (!m.def.fixe){
      m.assomme = 0.22; m.prepare = 0;
      m.go.body.setVelocity(dir * recul * (m.def.boss ? 0.35 : 1), m.def.vole ? 0 : -160);
    }
    SON.jouer('touche');
    this.cameras.main.shake(90, ecrase ? 0.006 : 0.0045);
    this.eclat(m.go.x, m.go.y, dir);
    if (m.pv > 0) this.crier(m.go.x, hautCri, ecrase ? CRIS.ecrase : CRIS.coup);
    if (m.pv <= 0){
      m.mort = true; this.vaincus++;
      SON.jouer('vaincu');
      this.eclat(m.go.x, m.go.y, dir, m.def.boss ? 34 : 14);
      this.crier(m.go.x, hautCri, m.def.boss ? CRIS.boss : CRIS.vaincu, '#ffd166', m.def.boss ? 26 : 20);
      if (this.alea() < CFG.chanceCoeur || m.def.boss) this.creerObjet(m.go.x - 12, m.go.y - 8, 'coeur');
      // le boss offre aussi une vie : elle part de l'autre côté pour que
      // les deux cadeaux ne se confondent pas
      if (m.def.boss) this.creerObjet(m.go.x + 14, m.go.y - 12, 'vie');
      m.go.destroy();
      if (m.def.boss){
        this.bossVivant = false;
        if (m.def.final) this.gagnerPartie();
        else this.message(m.def.nom + ' EST À TERRE  —  LA SORTIE S\'OUVRE');
      }
    }
  }
  casser(k, degats){
    k.pv -= degats; k.flash = 0.12;
    SON.jouer('caisse');
    this.cameras.main.shake(70, 0.003);
    this.eclat(k.go.x, k.go.y - 4, this.sens, 5);
    if (k.pv <= 0){
      k.casse = true;
      this.eclat(k.go.x, k.go.y - 4, this.sens, 16);
      this.crier(k.go.x, k.go.y - 24, CRIS.caisse, '#e8b06a', 15);
      this.creerObjet(k.go.x, k.go.y - 8, this.butin());
      k.go.destroy();
    }
  }
  butin(){
    const r = this.alea();
    if (r < 0.20) return 'laser';
    if (r < 0.38) return 'pistolet';
    if (r < 0.50) return 'fusil';
    return 'coeur';
  }
  eclat(x, y, sens, n, couleur){
    n = n || 7;
    for (let i = 0; i < n; i++)
      this.eclats.push({ x, y:y-6, couleur: couleur || 0xffb347,
        vx: sens*(60 + this.alea()*190) + (this.alea()-0.5)*90,
        vy: -110 + (this.alea()-0.5)*220,
        vie: 0.28 + this.alea()*0.22, max: 0.5 });
  }
  poussiere(vx){
    // petits nuages sous les pieds quand on court vite : c'est ce qui
    // donne le sentiment de vitesse, plus que l'animation elle-même
    const s = Math.sign(vx) || 1;
    for (let i = 0; i < 3; i++)
      this.eclats.push({ x: this.joueur.x - s*8, y: this.joueur.y + PIEDS - 1,
        couleur: COUL.poussiere,
        vx: -s*(40 + this.alea()*90), vy: -15 - this.alea()*55,
        vie: 0.2 + this.alea()*0.18, max: 0.38 });
  }
  blesser(source, degats){
    if (this.invuln > 0 || this.etat !== 'jeu') return;
    this.pv -= degats;
    this.invuln = CFG.invincibilite;
    const dir = this.joueur.x < source ? -1 : 1;
    this.joueur.body.setVelocity(dir * 240, -280);
    this.cameras.main.shake(140, 0.008);
    SON.jouer('degat');
    this.crier(this.joueur.x, this.joueur.y - 28, CRIS.aie, '#ff9d94');
    if (this.pv <= 0){ this.pv = 0; this.terminer('Tu es hors de combat'); }
  }

  // ── objets ──────────────────────────────────────────────────
  creerObjet(x, y, type){
    const o = this.add.rectangle(x, y, 18, 18, 0xffffff, 0);
    this.physics.add.existing(o);
    o.body.setVelocity((this.alea()-0.5)*140, -230);
    o.body.setBounce(0.35);
    o.body.setDragX(160);
    this.physics.add.collider(o, this.sols);
    this.physics.add.collider(o, this.plateformes);
    this.physics.add.collider(o, this.grCaisses);
    this.objets.push({ go:o, type, phase:this.alea()*6 });
  }
  ramasser(o){
    if (o.type === 'vie'){
      if (PARTIE.vies >= CFG.viesMax) return;   // au plafond, elle reste au sol
      PARTIE.vies++;
      SON.jouer('unevie');
      this.message('+1 VIE');
    } else if (o.type === 'coeur'){
      if (this.pv >= CFG.pvJoueur) return;   // on laisse le cœur au sol pour plus tard
      this.pv++;
      SON.jouer('coeur');
      this.message('+1 ♥');
    } else {
      const a = ARMES[o.type];
      if (this.arme === o.type){
        this.segments = Math.min(CFG.segmentsMax, this.segments + CFG.segmentsParBracelet);
        this.message(a.nom + '  —  +' + CFG.segmentsParBracelet + ' SEGMENTS');
      } else {
        this.arme = o.type;
        this.munitions = a.munitions;
        this.segments = CFG.segmentsParBracelet - 1;
        this.message(a.nom + '  —  □ POUR TIRER  ×' + this.munitions);
      }
      majBoutonArme(this.arme, this.munitions, this.segments);
      SON.jouer('arme');
    }
    o.pris = true;
    o.go.destroy();
  }
  message(txt){ this.msg = { t:0 }; this.hudMsg.setText(txt).setAlpha(1); }

  // ── étages, mort, victoire ──────────────────────────────────
  sauvegarder(){
    PARTIE.pv = this.pv; PARTIE.arme = this.arme; PARTIE.munitions = this.munitions;
    PARTIE.segments = this.segments;
    PARTIE.vaincus = this.vaincus; PARTIE.morts = this.morts;
  }
  majRecord(){
    const r = lireRecord();
    const n = { monstres: Math.max(r.monstres, this.vaincus), etage: Math.max(r.etage, PARTIE.niveau) };
    if (n.monstres !== r.monstres || n.etage !== r.etage) ecrireRecord(n);
    return n;
  }
  monterEtage(){
    if (this.etat !== 'jeu') return;
    this.etat = 'monte';
    this.transition = 0;
    // on entre VRAIMENT dans la cabine : pendant la transition plus rien
    // ne pilotait le corps, il gardait sa vitesse, glissait au-delà du
    // bord et tombait. On le pose au centre, on coupe la gravité, et il
    // s'élève doucement — vite sur l'échelle, à peine dans l'ascenseur.
    this.attaque = null;
    this.accroupi = false;
    this.joueur.body.reset(this.sortieX, this.joueur.y);
    this.joueur.body.setAllowGravity(false);
    this.joueur.body.setVelocity(0, this.def.sortie === 'echelle' ? -70 : -22);
    this.sauvegarder();
    this.majRecord();
    SON.jouer('ascenseur');
    const suivant = NIVEAUX[PARTIE.niveau + 1];
    this.hudFin.setText((this.def.sortie === 'echelle' ? 'Tu grimpes' : 'L\'ascenseur monte')
      + '\n\n' + suivant.nom + '\n' + suivant.sous);
  }
  gagnerPartie(){
    this.etat = 'fini';
    this.sauvegarder();
    const r = this.majRecord();
    SON.jouer('final');
    this.hudFin.setText('LE TOIT EST À TOI\n' + this.vaincus + ' monstres vaincus'
      + '\nrecord ' + r.monstres + '\n\n↑ ou un bouton pour rejouer');
  }
  terminer(titre){
    this.mortDebut = this.time.now;   // le sprite joue la chute une fois
    this.morts++;
    PARTIE.vies--;
    SON.jouer('mort');
    this.sauvegarder();
    const r = this.majRecord();
    if (PARTIE.vies <= 0){
      // plus de vie : game over, et retour à l'écran d'accueil
      this.etat = 'gameover';
      this.hudFin.setText('GAME OVER\n' + this.vaincus + ' monstres vaincus'
        + '\nrecord ' + r.monstres + '\n\nun bouton pour l\'écran d\'accueil');
      return;
    }
    this.etat = 'perdu';
    this.hudFin.setText(titre + '\n'
      + (PARTIE.vies === 1 ? 'dernière vie' : PARTIE.vies + ' vies restantes')
      + '\n\n↑ ou un bouton pour repartir d\'ici');
  }
  // On ne relance pas la scène : le monde, les monstres déjà vaincus et
  // les caisses ouvertes restent en l'état. On repose seulement le joueur
  // au dernier endroit où il avait les pieds sur quelque chose de solide.
  reapparaitre(){
    this.etat = 'jeu';
    this.hudFin.setText('');
    this.pv = CFG.pvJoueur;
    this.invuln = CFG.invulnRenais;
    this.attaque = null;
    this.charge = null;
    this.endurance = CFG.enduranceMax;
    this.squash = 0;
    this.joueur.body.reset(this.checkpoint.x, this.checkpoint.y);
    this.piedsAvant = this.checkpoint.y + PIEDS;
    this.cameras.main.centerOn(this.checkpoint.x, this.checkpoint.y);
    for (const m of this.monstres){
      if (!m.def.fixe && Math.abs(m.go.x - this.checkpoint.x) < 160){
        const d = Math.sign(m.go.x - this.checkpoint.x) || 1;
        m.go.body.setVelocity(d * 280, m.def.vole ? 0 : -220);
        m.assomme = 0.6; m.prepare = 0;
      }
    }
  }
  recommencer(){
    GRAINE = (Math.random() * 1e9) | 0;
    PARTIE = nouvellePartieEtat();
    afficherRecord();
    this.scene.restart();
  }

  // ── boucle ──────────────────────────────────────────────────
  update(temps, deltaMs){
    const dt = Math.min(0.033, deltaMs / 1000);
    const b = this.joueur.body;

    if (this.etat === 'monte'){
      // l'ascenseur prend son temps, puis l'étage suivant se construit
      this.transition += dt;
      if (this.transition > 1.9){
        PARTIE.niveau++;
        this.scene.restart();
        return;
      }
      ENTREE.validePresse = false; ENTREE.relache = null; ENTREE.hautPresse = false;
      this.majEclats(dt); this.dessinerTout(b);
      return;
    }

    if (this.etat !== 'jeu'){
      if (ENTREE.validePresse){
        ENTREE.validePresse = false; ENTREE.sautPresse = false; ENTREE.relache = null;
        ENTREE.hautPresse = false;
        if (this.etat === 'perdu') this.reapparaitre();
        // le retour au titre détruit la partie : hors de la boucle de jeu,
        // sinon Phaser se fait couper l'herbe sous le pied en plein update
        else if (this.etat === 'gameover') setTimeout(retourAuTitre, 0);
        else this.recommencer();
        return;
      }
      ENTREE.relache = null; ENTREE.hautPresse = false; ENTREE.sautPresse = false;
      this.majEclats(dt); this.dessinerTout(b);
      return;
    }
    ENTREE.validePresse = false;

    const auSol = b.blocked.down || b.touching.down;
    this.accroupi = ENTREE.accroupi && auSol;

    // ── coups : un appui bref donne le coup normal ; TENIR le bouton
    // charge le coup, qui part élastique au relâché s'il reste de
    // l'endurance. Un appui-relâché pendant un coup en cours reste en
    // réserve, le suivant part dès que le bras est libre.
    if (ENTREE.hautPresse && performance.now() - ENTREE.hautT > 700) ENTREE.hautPresse = false;
    if (ENTREE.relache && performance.now() - ENTREE.relache.quand > 700) ENTREE.relache = null;
    if (this.chargeAIgnorer && ENTREE.relache && ENTREE.relache.action === this.chargeAIgnorer){
      // le relâché d'un coup déjà parti tout seul (ou d'un tir d'arme)
      ENTREE.relache = null; this.chargeAIgnorer = null;
    } else if (this.chargeAIgnorer && ENTREE.chargeAction !== this.chargeAIgnorer){
      // le bouton à ignorer n'est plus tenu et son relâché est passé
      this.chargeAIgnorer = null;
    }
    if (!this.attaque){
      if (ENTREE.hautPresse){
        ENTREE.hautPresse = false; this.charge = null;
        this.lancerAttaque('crochet');
      } else if (ENTREE.chargeAction === 'poing' && this.arme && this.chargeAIgnorer !== 'poing'){
        // une arme au poing tire dès l'appui — pas de charge, et tant que
        // le bouton reste tenu son relâché est à ignorer
        this.chargeAIgnorer = 'poing';
        this.utiliserArme();
      } else if (this.charge){
        // la charge se mesure en temps RÉEL d'appui : le temps de la
        // simulation se dilate quand la cadence d'images chute, et le
        // seuil deviendrait faux exactement quand le jeu rame
        this.charge.t = (performance.now() - this.charge.depuis) / 1000;
        const tenu = ENTREE.chargeAction === this.charge.action;
        if (!tenu || this.charge.t >= CFG.chargeMax){
          // relâché — ou tenu jusqu'au maximum : le coup part tout seul
          const action = this.charge.action;
          const veutElast = this.charge.t >= CFG.seuilElastique;
          const elast = veutElast && this.endurance >= 1;
          if (elast) this.endurance -= 1;
          else if (veutElast && !this.astuceEndurance){
            this.astuceEndurance = true;
            this.message("PLUS D'ENDURANCE — LA JAUGE REVIENT TOUTE SEULE");
          }
          if (tenu) this.chargeAIgnorer = action;   // son relâché est déjà consommé
          ENTREE.relache = null;
          this.charge = null;
          this.lancerAttaque(action, elast);
        } else if (!this.charge.pret && this.charge.t >= CFG.seuilElastique && this.endurance >= 1){
          this.charge.pret = true;
          SON.jouer('tendu');
        }
      } else if (ENTREE.chargeAction && ENTREE.chargeAction !== this.chargeAIgnorer){
        // bouton tenu, éventuellement depuis le coup précédent : la
        // charge reprend la durée réelle de l'appui
        this.charge = { action: ENTREE.chargeAction, depuis: ENTREE.chargeDebut,
          t: (performance.now() - ENTREE.chargeDebut)/1000, pret:false };
      } else if (ENTREE.relache){
        const r = ENTREE.relache; ENTREE.relache = null;
        const elast = r.duree >= CFG.seuilElastique && this.endurance >= 1;
        if (elast) this.endurance -= 1;
        if (r.action === 'poing' && this.arme) this.utiliserArme();
        else this.lancerAttaque(r.action, elast);
      }
    }

    if (this.attaque){
      const c = COUPS[this.attaque.type];
      this.attaque.t += dt;
      if (this.attaque.t >= c.debut && this.attaque.t <= c.fin){
        const zones = this.zonesAttaque();
        if (zones.length){
          for (const m of this.monstres){
            if (m.mort || this.attaque.touches.has(m)) continue;
            if (zones.some(z => Phaser.Geom.Intersects.RectangleToRectangle(z, m.go.getBounds()))){
              this.attaque.touches.add(m);
              this.frapper(m, c.degats + (this.attaque.elastique ? 1 : 0),
                c.recul, this.attaque.bas, this.joueur.x, false);
            }
          }
          for (const k of this.caisses){
            if (k.casse || this.attaque.touches.has(k)) continue;
            if (zones.some(z => Phaser.Geom.Intersects.RectangleToRectangle(z, k.go.getBounds()))){
              this.attaque.touches.add(k);
              this.casser(k, c.degats);
            }
          }
        }
      }
      if (this.attaque.t >= c.duree) this.attaque = null;
    }

    // déplacement : le joystick est analogique, la vitesse suit son inclinaison
    const bloque = this.attaque && auSol && !COUPS[this.attaque.type].tir;
    const vMax = this.accroupi ? CFG.vitesseAccroupi : CFG.vitesseCourse;
    const cible = bloque ? 0 : ENTREE.axeX * vMax;
    if (Math.abs(ENTREE.axeX) > 0.05 && !bloque) this.sens = Math.sign(ENTREE.axeX);

    const a = (cible !== 0 ? CFG.accel : CFG.frein) * (auSol ? 1 : CFG.controleAir) * dt;
    const vx = b.velocity.x;
    b.setVelocityX(Math.abs(cible - vx) <= a ? cible : vx + Math.sign(cible - vx) * a);

    // sauts : un au sol, un en l'air
    if (auSol) this.sautsAir = 1;
    this.coyote = auSol ? CFG.coyote : Math.max(0, this.coyote - dt);
    if (ENTREE.sautPresse){ ENTREE.sautPresse = false; this.buffer = CFG.bufferSaut; }
    this.buffer = Math.max(0, this.buffer - dt);
    if (this.buffer > 0 && this.coyote > 0){
      b.setVelocityY(-CFG.vitesseSaut);
      this.coyote = 0; this.buffer = 0; this.squash = -1;
      SON.jouer('saut');
    } else if (this.buffer > 0 && this.sautsAir > 0){
      if (this.endurance >= 1){
        this.endurance -= 1;
        b.setVelocityY(-CFG.sautAerien);
        this.sautsAir--; this.buffer = 0; this.squash = -1;
        SON.jouer('saut2');
        this.eclat(this.joueur.x, this.joueur.y + PIEDS, 0, 6, 0x9fb4ff);
      } else {
        this.buffer = 0;
        if (!this.astuceEndurance){
          this.astuceEndurance = true;
          this.message("PLUS D'ENDURANCE — LA JAUGE REVIENT TOUTE SEULE");
        }
      }
    }
    if (!ENTREE.saut && b.velocity.y < -CFG.coupureSaut) b.setVelocityY(-CFG.coupureSaut);

    if (auSol && !this.auSolAvant && this.vyAvant > 300) this.squash = 1;
    this.auSolAvant = auSol; this.vyAvant = b.velocity.y;
    this.squash += (0 - this.squash) * Math.min(1, dt * 12);
    if (auSol) this.phase += (Math.abs(b.velocity.x) * dt) / 27;
    this.invuln = Math.max(0, this.invuln - dt);
    this.endurance = Math.min(CFG.enduranceMax, this.endurance + CFG.enduranceRegen * dt);

    // poussière à chaque appui de pied quand on court vite
    const sPhase = Math.sin(this.phase);
    if (auSol && Math.abs(b.velocity.x) > CFG.vitesseCourse * 0.55 && this.sAvant * sPhase <= 0 && !this.accroupi)
      this.poussiere(b.velocity.x);
    this.sAvant = sPhase;

    if (auSol && Math.abs(b.velocity.y) < 40){
      this.checkpoint.x = this.joueur.x;
      this.checkpoint.y = this.joueur.y;
    }

    this.majMonstres(dt);
    this.majTirs(dt);

    for (const k of this.caisses) k.flash = Math.max(0, k.flash - dt);
    this.caisses = this.caisses.filter(k => !k.casse);

    for (const o of this.objets){
      o.phase += dt * 4;
      if (o.go.y > H + 200){ o.pris = true; o.go.destroy(); continue; }
      if (Phaser.Geom.Intersects.RectangleToRectangle(this.joueur.getBounds(), o.go.getBounds()))
        this.ramasser(o);
    }
    this.objets = this.objets.filter(o => !o.pris);

    if (this.msg){
      this.msg.t += dt;
      this.hudMsg.setAlpha(Math.max(0, 1 - this.msg.t / 2.2));
      if (this.msg.t > 2.2) this.msg = null;
    }

    if (this.joueur.y > H + 40) this.terminer('Tombé dans le vide');
    // la sortie : porte, ascenseur ou échelle, mais seulement une fois
    // le boss de l'étage à terre
    if (this.def.sortie !== 'patron' && Math.abs(this.joueur.x - this.sortieX) < 34){
      if (this.bossVivant){
        if (!this.avertiBoss){
          this.avertiBoss = true;
          this.message(MONSTRES[this.def.boss].nom + ' GARDE LA SORTIE');
        }
      } else this.monterEtage();
    }

    this.piedsAvant = this.joueur.y + PIEDS;
    this.vyChute = this.joueur.body.velocity.y;
    this.majEclats(dt);
    this.dessinerTout(b);
  }

  majMonstres(dt){
    this.monstres = this.monstres.filter(m => !m.mort);
    for (const m of this.monstres){
      m.flash  = Math.max(0, m.flash - dt);
      m.blinde = Math.max(0, m.blinde - dt);
      m.phase += dt * 5;
      const dx = this.joueur.x - m.go.x;
      const memeNiveau = Math.abs(this.joueur.y - m.go.y) < 110;

      if (m.def.fixe){
        this.majTourelle(m, dt, dx, memeNiveau);
      } else if (m.assomme > 0){
        m.assomme -= dt;
      } else if (m.prepare > 0){
        // le gardien s'est ramassé : il ne bouge plus, puis se détend
        m.prepare -= dt;
        m.go.body.setVelocityX(0);
        if (m.prepare <= 0){
          m.go.body.setVelocity(Math.sign(dx || 1) * m.def.charge.elan, -180);
          m.assomme = 0.45;
        }
      } else {
        m.repos = Math.max(0, m.repos - dt);
        const ch = m.def.charge;
        if (ch && m.repos <= 0 && Math.abs(dx) < ch.portee && memeNiveau){
          m.prepare = ch.preparation; m.repos = ch.repos;
          m.go.body.setVelocityX(0);
          SON.jouer('charge');
        } else {
          let v;
          if (Math.abs(dx) < 340 && memeNiveau) v = Math.sign(dx) * m.def.vitesse * this.D.vitesse;
          else {
            if (m.go.x < m.minX) m.dir = 1;
            if (m.go.x > m.maxX) m.dir = -1;
            v = m.dir * m.def.patrouille * this.D.vitesse;
          }
          if ((m.go.x <= m.minX && v < 0) || (m.go.x >= m.maxX && v > 0)) v = 0;
          m.go.body.setVelocityX(v);
          if (m.def.vole){
            const vise = m.baseY + Math.sin(m.phase * 0.7) * 7;
            m.go.body.setVelocityY((vise - m.go.y) * 4);
          }
        }
      }

      // personne ne marche dans le vide : un marcheur au bord d'un trou
      // s'arrête net et repart dans l'autre sens — poursuite, patrouille
      // et glissade de recul comprises
      if (!m.def.vole && !m.def.fixe && m.go.body.blocked.down){
        const vx = m.go.body.velocity.x;
        if (vx !== 0 && !this.solSous(m.go.x + Math.sign(vx) * (m.def.taille[0]/2 + 8))){
          m.go.body.setVelocityX(0);
          m.dir = -m.dir;
        }
      }

      // Retomber SUR une bestiole l'écrase au lieu de nous blesser.
      // Le test est un BALAYAGE du sommet, pas un chevauchement : en
      // pleine chute le corps avance de 50 px et plus par image, il peut
      // traverser un monstre entier entre deux vérifications.
      const hautM = m.go.y - m.def.taille[1]/2;
      const surLui = Math.abs(this.joueur.x - m.go.x) < 14 + m.def.taille[0]/2;
      const piedsIci = this.joueur.y + PIEDS;
      // vyChute : la vitesse d'il y a une image. Si le franchissement et
      // l'atterrissage tombent dans la même image, le sol a déjà remis la
      // vitesse à zéro quand on arrive ici — on jugerait « pas en chute »
      if ((this.joueur.body.velocity.y > 140 || this.vyChute > 140) && surLui
          && this.piedsAvant <= hautM + 2 && piedsIci >= hautM){
        const vx0 = this.joueur.body.velocity.x;
        this.joueur.body.reset(this.joueur.x, hautM - PIEDS);  // reposé sur la bestiole
        this.joueur.body.setVelocity(vx0, -CFG.rebondEcrase);
        this.sautsAir = Math.max(this.sautsAir, 1);   // le rebond rend le saut aérien
        this.squash = -1;
        this.invuln = Math.max(this.invuln, 0.3);     // le temps de ressortir du rebond
        this.frapper(m, 1, 130, false, this.joueur.x, true);
      } else if (Phaser.Geom.Intersects.RectangleToRectangle(this.joueur.getBounds(), m.go.getBounds())){
        this.blesser(m.go.x, m.def.degats);
      }
      if (m.go.y > H + 200) this.repecher(m);
    }
  }
  majTourelle(m, dt, dx, memeNiveau){
    const c = m.def.canon;
    m.repos = Math.max(0, m.repos - dt);
    if (m.vise > 0){
      m.vise -= dt;
      if (m.vise <= 0){
        const dy = (this.joueur.y - 10) - (m.go.y - 6);
        const d = Math.hypot(dx, dy) || 1;
        this.tirsEnnemis.push({
          x:m.go.x + Math.sign(dx || 1)*12, y:m.go.y - 6,
          vx: dx/d * c.vitesse, vy: dy/d * c.vitesse, vie:2.2,
        });
        SON.jouer('tirEnnemi');
      }
    } else if (m.repos <= 0 && Math.abs(dx) < c.portee && memeNiveau){
      m.vise = c.visee; m.repos = c.repos;
      SON.jouer('visee');
    }
  }

  majTirs(dt){
    for (const t of this.tirs){
      t.vie -= dt;
      if (t.g){
        t.vy += t.g * dt;
        // le segment jeté se brise en touchant le sol
        if (t.y > SOL_Y - 3){ this.eclat(t.x, SOL_Y - 4, Math.sign(t.vx), 6, t.couleur); t.fini = true; continue; }
      }
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.vie <= 0){ t.fini = true; continue; }
      const boite = new Phaser.Geom.Rectangle(t.x - 5, t.y - 3, 10, 6);
      for (const m of this.monstres){
        if (m.mort) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, m.go.getBounds())){
          this.frapper(m, t.degats, t.recul, t.bas, t.x - t.vx * 0.01);
          t.fini = true; break;
        }
      }
      if (t.fini) continue;
      for (const k of this.caisses){
        if (k.casse) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, k.go.getBounds())){
          this.casser(k, t.degats);
          t.fini = true; break;
        }
      }
    }
    this.tirs = this.tirs.filter(t => !t.fini);

    for (const t of this.tirsEnnemis){
      t.vie -= dt;
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.vie <= 0){ t.fini = true; continue; }
      const boite = new Phaser.Geom.Rectangle(t.x - 5, t.y - 5, 10, 10);
      if (Phaser.Geom.Intersects.RectangleToRectangle(boite, this.joueur.getBounds())){
        this.blesser(t.x, 1);
        t.fini = true;
      }
    }
    this.tirsEnnemis = this.tirsEnnemis.filter(t => !t.fini);
  }

  // une onomatopee de manga : surgit, penche, monte un peu et s'efface
  crier(x, y, mots, couleur, taille){
    const b = this.bulles[this.bulleSuiv = (this.bulleSuiv + 1) % this.bulles.length];
    b.t.setText(mots[Math.floor(this.alea() * mots.length)])
      .setColor(couleur || '#ffffff')
      .setFontSize(taille || 18)
      .setPosition(x, y)
      .setAngle((this.alea() * 2 - 1) * 14)
      .setVisible(true);
    b.vie = b.max = 0.55;
    b.vy = -46;
  }
  majEclats(dt){
    for (const e of this.eclats){ e.vie -= dt; e.vy += 900*dt; e.x += e.vx*dt; e.y += e.vy*dt; }
    this.eclats = this.eclats.filter(e => e.vie > 0);
    for (const b of this.bulles){
      if (b.vie <= 0) continue;
      b.vie -= dt;
      if (b.vie <= 0){ b.t.setVisible(false); continue; }
      const k = 1 - b.vie / b.max;
      b.t.y += b.vy * dt;
      b.t.setScale(k < 0.25 ? 0.4 + (k / 0.25) * 0.8 : Math.max(1, 1.2 - (k - 0.25) * 0.3));
      b.t.setAlpha(b.vie < 0.16 ? b.vie / 0.16 : 1);
    }
  }
}

// ═══════════════ src/rendu.js ═══════════════
// ─────────────────────────────────────────────────────────────
// RENDU
// Greffé sur la scène par le build : moteur.js déclare la classe,
// ce fichier lui ajoute tout le dessin. L'assemblage les met dans le
// même script, donc la même portée.
// ─────────────────────────────────────────────────────────────
Object.assign(Combat.prototype, {

  // ── rendu ───────────────────────────────────────────────────
  dessinerTout(b){
    const sx = this.cameras.main.scrollX;
    if (this.def.decor === 'interieur') this.dessinerInterieur(sx);
    else if (this.def.decor === 'toit') this.dessinerToit(sx);
    else if (this.def.decor === 'foret') this.dessinerForet(sx);
    else if (this.def.decor === 'desert') this.dessinerDesert(sx);
    else if (this.def.decor === 'villeJour') this.dessinerVilleJour(sx);
    else this.dessinerDehors(sx);
    this.dessinerSortie();
    this.dessinerCaisses();
    this.dessinerMonstres();
    this.dessinerObjets();
    this.dessinerPerso(b);
    this.dessinerEclats();
    this.dessinerTirs();
    this.dessinerHud();
  },
  dessinerHud(){
    const g = this.hud; g.clear();
    for (let i = 0; i < CFG.pvJoueur; i++){
      g.fillStyle(i < this.pv ? 0xe2584d : 0x2a3355, 1);
      const x = 26 + i*26, y = 32;
      g.fillCircle(x-5, y-3, 6); g.fillCircle(x+5, y-3, 6);
      g.fillTriangle(x-11, y, x+11, y, x, y+12);
    }
    // jauge d'endurance : coups élastiques et doubles sauts y puisent
    for (let i = 0; i < CFG.enduranceMax; i++){
      const part = Phaser.Math.Clamp(this.endurance - i, 0, 1);
      const x = 15 + i*26;
      g.fillStyle(0x1c2440, 0.9); g.fillRect(x, 47, 22, 5);
      if (part > 0){
        g.fillStyle(part >= 1 ? 0x4dd6c1 : 0x2e7d6e, 1);
        g.fillRect(x, 47, 22*part, 5);
      }
    }

    let t = this.def.nom + '   VIES ' + Math.max(0, PARTIE.vies)
          + '   MONSTRES ' + this.vaincus;
    if (this.arme) t += '   ' + ARMES[this.arme].nom + ' '
      + (this.munitions > 0 ? this.munitions + (this.segments > 0 ? '·' + this.segments : '') : 'RECHARGE');
    this.hudTexte.setText(t);

    // barre du boss, seulement quand il est à portée de vue
    const b = this.boss;
    if (b && !b.mort && Math.abs(b.go.x - this.joueur.x) < 620){
      const w = 300, x = (L - w)/2, y = H - 34;
      g.fillStyle(0x000000, 0.45); g.fillRect(x-4, y-4, w+8, 18);
      g.fillStyle(0x2a3355, 1);    g.fillRect(x, y, w, 10);
      g.fillStyle(0xff5e5e, 1);    g.fillRect(x, y, w * Math.max(0, b.pv/b.pvMax), 10);
      g.fillStyle(0xffffff, 0.18); g.fillRect(x, y, w, 3);
      this.hudBoss.setText(b.def.nom).setAlpha(1);
    } else if (this.hudBoss.alpha) this.hudBoss.setAlpha(0);
  },
  dessinerEclats(){
    const g = this.gEclats; g.clear();
    for (const e of this.eclats){
      const k = Math.max(0, e.vie / e.max);
      g.fillStyle(e.couleur, k);
      g.fillRect(e.x-2, e.y-2, 3 + k*2, 3 + k*2);
    }
  },
  dessinerTirs(){
    const g = this.gTirs; g.clear();
    if (this.attaque && COUPS[this.attaque.type].faisceau){
      const c = COUPS[this.attaque.type];
      const k = 1 - Phaser.Math.Clamp(this.attaque.t / c.duree, 0, 1);
      const y  = this.joueur.y + PIEDS + c.dy + (this.attaque.bas ? DECALAGE_ACCROUPI : 0);
      const x0 = this.joueur.x + this.sens * 12;
      const x1 = this.joueur.x + this.sens * (14 + c.portee);
      const g0 = Math.min(x0, x1), w = Math.abs(x1 - x0);
      g.fillStyle(0xc46bff, 0.18 * k);  g.fillRect(g0, y - 12*k, w, 24*k);
      g.fillStyle(0xe9b6ff, 0.55 * k);  g.fillRect(g0, y -  5*k, w, 10*k);
      g.fillStyle(0xffffff, 0.9 * k);   g.fillRect(g0, y -  2*k, w,  4*k);
      g.fillStyle(0xffffff, k); g.fillCircle(x0, y, 7*k);
    }
    let bi = 0;
    for (const t of this.tirs){
      if (t.jet){
        // le segment usé tournoie : un trait épais qui tourne suffit à
        // donner la rotation à cette taille
        const a = (1.6 - t.vie) * 14 * Math.sign(t.vx);
        const cx = Math.cos(a)*6, cy = Math.sin(a)*6;
        g.fillStyle(t.couleur, 0.22); g.fillCircle(t.x, t.y, 9);
        g.lineStyle(5, t.couleur, 1);
        g.beginPath(); g.moveTo(t.x - cx, t.y - cy); g.lineTo(t.x + cx, t.y + cy); g.strokePath();
        g.fillStyle(t.clair || 0xffffff, 0.95); g.fillCircle(t.x, t.y, 2.2);
        continue;
      }
      // la balle est la boule de feu de la planche
      const img = this.imgTirs[bi++];
      if (img) img.setVisible(true).setPosition(t.x, t.y).setFlipX(t.vx < 0);
    }
    for (let i = bi; i < this.imgTirs.length; i++) this.imgTirs[i].setVisible(false);
    for (const t of this.tirsEnnemis){
      g.fillStyle(COUL.tirEnnemi, 0.25); g.fillCircle(t.x, t.y, 9);
      g.fillStyle(COUL.tirEnnemi, 1);    g.fillCircle(t.x, t.y, 4.5);
      g.fillStyle(0xffe0d0, 0.95);       g.fillCircle(t.x, t.y, 2);
    }
  },

  // ── décors ──────────────────────────────────────────────────
  dessinerDehors(sx){
    const g = this.fond; g.clear();
    const u = this.urbain(sx + L/2);
    const haut = this.melange(0x0d1120, 0x150d24, u);
    const bas  = this.melange(0x2a2350, 0x5b2a4a, u);
    g.fillGradientStyle(haut, haut, bas, bas, 1);
    g.fillRect(0, 0, L, SOL_Y);
    g.fillStyle(0xffb347, 0.14 - 0.07*u); g.fillCircle(730, 140, 70);
    if (u < 1) this.collines(g, sx*0.12, 0x1d2547, 42, 250, 1 - u);
    this.pylones(g, sx*0.35, this.melange(0x151c38, 0x1a1230, u));
    if (u > 0) this.immeubles(g, sx*0.45, u, 128, 120, 185);
    if (u < 1) this.collines(g, sx*0.55, 0x111730, 26, 320, 1 - u);
  },
  dessinerInterieur(sx){
    const g = this.fond; g.clear();
    const t = this.def.teinte;
    g.fillGradientStyle(t.fondHaut, t.fondHaut, t.fondBas, t.fondBas, 1);
    g.fillRect(0, 0, L, SOL_Y);

    // panneaux muraux
    const pasP = 168, dP = Math.floor(sx*0.3/pasP) - 1;
    for (let i = dP; i < dP + Math.ceil(L/pasP) + 3; i++){
      const x = i*pasP - sx*0.3;
      g.fillStyle(t.mur, 1);     g.fillRect(x, 44, pasP - 6, SOL_Y - 44);
      g.fillStyle(t.murHaut, 1); g.fillRect(x, 44, pasP - 6, 4);
    }
    // fenêtres : c'est par là qu'on voit qu'on est haut perché
    const pasF = 330, dF = Math.floor(sx*0.42/pasF) - 1;
    for (let i = dF; i < dF + Math.ceil(L/pasF) + 3; i++){
      const x = i*pasF - sx*0.42, y = 104, w = 168, h = 128;
      g.fillStyle(0x090c18, 1); g.fillRect(x, y, w, h);
      for (let j = 0; j < 7; j++){
        const bw = 13 + Math.abs(Math.sin((i*7+j)*3.3))*14;
        const bh = 26 + Math.abs(Math.cos((i*5+j)*2.7))*76;
        g.fillStyle(0x1b1430, 1); g.fillRect(x + 5 + j*24, y + h - bh, bw, bh);
        for (let k = 0; k < 4; k++){
          const fy = y + h - bh + 7 + k*15;
          if (fy > y + h - 8) break;
          if (Math.abs(Math.sin((i*3+j*5+k)*4.1)) < 0.55) continue;
          g.fillStyle(0xffd98a, 0.75); g.fillRect(x + 8 + j*24, fy, 5, 6);
        }
      }
      g.lineStyle(5, 0x2b3355, 1); g.strokeRect(x, y, w, h);
      g.lineStyle(3, 0x2b3355, 1);
      g.beginPath(); g.moveTo(x + w/2, y); g.lineTo(x + w/2, y + h); g.strokePath();
    }
    // plafond et néons
    g.fillStyle(t.plafond, 1); g.fillRect(0, 0, L, 44);
    const pasN = 215, dN = Math.floor(sx*0.5/pasN) - 1;
    for (let i = dN; i < dN + Math.ceil(L/pasN) + 3; i++){
      const x = i*pasN - sx*0.5;
      // halo en trois bandes de plus en plus pâles : un seul rectangle
      // translucide donnait une boîte grise, pas une lumière
      g.fillStyle(t.neon, 0.10); g.fillRect(x - 26, 42, 136, 40);
      g.fillStyle(t.neon, 0.06); g.fillRect(x - 40, 42, 164, 78);
      g.fillStyle(t.neon, 0.9);  g.fillRect(x, 36, 84, 6);
    }
  },
  dessinerForet(sx){
    // petit matin : ciel laiteux, soleil bas, trois rangées de sapins
    // du plus pâle (loin) au plus sombre (près)
    const g = this.fond; g.clear();
    g.fillGradientStyle(0xa8d8d0, 0xa8d8d0, 0xe8f0d8, 0xe8f0d8, 1);
    g.fillRect(0, 0, L, SOL_Y);
    g.fillStyle(0xfff2c0, 0.18); g.fillCircle(190, 92, 80);
    g.fillStyle(0xfff2c0, 0.55); g.fillCircle(190, 92, 44);
    this.sapins(g, sx*0.15, 0x9bbf8e, 306, 62, 92);
    this.sapins(g, sx*0.32, 0x6fa06b, 340, 88, 122);
    this.sapins(g, sx*0.55, 0x497a52, 378, 118, 152);
  },
  sapins(g, off, couleur, base, h, pas){
    const debut = Math.floor(off/pas) - 1;
    g.fillStyle(couleur, 1);
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const x = i*pas - off + (i % 3) * 14;
      const hh = h * (0.75 + Math.abs(Math.sin(i*12.99)) * 0.5);
      g.fillTriangle(x - hh*0.42, base, x + hh*0.42, base, x, base - hh);
      g.fillTriangle(x - hh*0.34, base - hh*0.34, x + hh*0.34, base - hh*0.34, x, base - hh*1.28);
    }
  },
  dessinerDesert(sx){
    const g = this.fond; g.clear();
    g.fillGradientStyle(0x8fd0e8, 0x8fd0e8, 0xf2dfae, 0xf2dfae, 1);
    g.fillRect(0, 0, L, SOL_Y);
    g.fillStyle(0xfff6d0, 0.35); g.fillCircle(700, 86, 62);
    g.fillStyle(0xffffff, 0.9);  g.fillCircle(700, 86, 34);
    this.collines(g, sx*0.2, 0xe3c078, 26, 300, 1);
    this.collines(g, sx*0.45, 0xcda45c, 20, 340, 1);
    // cactus à bras, plantés au premier plan
    const pas = 260, debut = Math.floor(sx*0.6/pas) - 1;
    g.fillStyle(0x4f7d46, 1);
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const x = i*pas - sx*0.6 + (i % 2) * 40;
      const h = 34 + Math.abs(Math.sin(i*7.7)) * 30;
      g.fillRect(x-5, SOL_Y - h, 10, h);
      g.fillRect(x-16, SOL_Y - h*0.62, 12, 6);
      g.fillRect(x-16, SOL_Y - h*0.62 - 12, 6, 16);
      g.fillRect(x+5,  SOL_Y - h*0.45, 12, 6);
      g.fillRect(x+11, SOL_Y - h*0.45 - 10, 6, 14);
    }
  },
  dessinerVilleJour(sx){
    const g = this.fond; g.clear();
    g.fillGradientStyle(0x9fd3ef, 0x9fd3ef, 0xdcedf7, 0xdcedf7, 1);
    g.fillRect(0, 0, L, SOL_Y);
    const pasN = 300, dN = Math.floor(sx*0.08/pasN) - 1;
    g.fillStyle(0xffffff, 0.8);
    for (let i = dN; i < dN + Math.ceil(L/pasN) + 3; i++){
      const x = i*pasN - sx*0.08, y = 58 + (i % 3) * 34;
      g.fillEllipse(x, y, 90, 22); g.fillEllipse(x+34, y-8, 60, 18);
    }
    this.batimentsClairs(g, sx*0.3, 0xb9c8d8, 0x8fa2b8, 150, 60, 130);
    this.batimentsClairs(g, sx*0.55, 0x94a8bc, 0x6d8098, 120, 100, 170);
  },
  batimentsClairs(g, off, corps, ombre, pas, hMin, hVar){
    const debut = Math.floor(off/pas) - 1;
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const h = hMin + Math.abs(Math.sin(i*7.13)) * hVar;
      const w = 58 + Math.abs(Math.cos(i*3.71)) * 40;
      const x = i*pas - off, y = SOL_Y - h;
      g.fillStyle(corps, 1); g.fillRect(x, y, w, h);
      g.fillStyle(ombre, 1); g.fillRect(x, y, w, 5);
      g.fillStyle(0x3c4b5c, 0.75);
      for (let fy = y + 12; fy < SOL_Y - 14; fy += 20)
        for (let fx = x + 8; fx < x + w - 11; fx += 17)
          g.fillRect(fx, fy, 7, 9);
    }
  },
  dessinerToit(sx){
    const g = this.fond; g.clear();
    g.fillGradientStyle(0x06080f, 0x06080f, 0x2c1743, 0x2c1743, 1);
    g.fillRect(0, 0, L, SOL_Y);
    // étoiles : positions figées par un hachage, pas de tirage au sort
    for (let i = 0; i < 70; i++){
      const bx = ((i * 149.7 - sx * 0.06) % (L + 60) + L + 60) % (L + 60) - 30;
      const by = 16 + ((i * 83.3) % 210);
      const k = 0.25 + Math.abs(Math.sin(i * 12.9898)) * 0.6;
      g.fillStyle(0xffffff, k); g.fillRect(bx, by, 2, 2);
    }
    g.fillStyle(0xffe9c0, 0.10); g.fillCircle(700, 108, 92);
    g.fillStyle(0xffe9c0, 0.85); g.fillCircle(700, 108, 54);
    g.fillStyle(0x2c1743, 0.30); g.fillCircle(676, 96, 44);
    // les tours voisines : leurs sommets arrivent juste sous nos pieds
    this.immeubles(g, sx*0.22, 1, 150, 40, 120, SOL_Y + 20);
  },
  collines(g, off, couleur, amp, base, alpha){
    const pts = [{x:0,y:H}];
    for (let x = 0; x <= L; x += 8){
      const wx = x + off;
      pts.push({ x, y: base + Math.sin(wx*0.0035)*amp + Math.sin(wx*0.011)*amp*0.35 });
    }
    pts.push({x:L,y:H});
    g.fillStyle(couleur, alpha); g.fillPoints(pts, true);
  },
  pylones(g, off, couleur){
    const pas = 165, debut = Math.floor(off/pas) - 1;
    g.fillStyle(couleur, 1);
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const h = 70 + Math.abs(Math.sin(i*12.9898))*95;
      const w = 30 + Math.abs(Math.cos(i*4.1414))*24;
      g.fillRect(i*pas - off, SOL_Y - h, w, h);
    }
  },
  // immeubles à fenêtres allumées, servent en ville comme sur le toit
  immeubles(g, off, t, pas, hMin, hVar, base){
    base = base || SOL_Y;
    const debut = Math.floor(off/pas) - 1;
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const h = hMin + Math.abs(Math.sin(i*7.13))*hVar;
      const w =  62 + Math.abs(Math.cos(i*3.71))*44;
      const x = i*pas - off, y = base - h;
      g.fillStyle(0x1b1430, t); g.fillRect(x, y, w, h);
      g.fillStyle(0x2a1c46, t); g.fillRect(x, y, w, 5);
      for (let fy = y + 14; fy < base - 18; fy += 24){
        for (let fx = x + 10; fx < x + w - 13; fx += 20){
          const r = Math.abs(Math.sin(fx*0.37 + fy*0.71 + i*5.1));
          if (r < 0.45) continue;
          g.fillStyle(r > 0.86 ? 0xffd98a : 0xf2a34a, t * (0.3 + r*0.5));
          g.fillRect(fx, fy, 8, 10);
        }
      }
    }
  },
  dessinerSortie(){
    const g = this.gSortie; g.clear();
    if (this.def.sortie === 'patron') return;
    const x = this.sortieX, sol = SOL_Y;
    // verrouillée tant que le boss tient : elle bat en rouge au lieu de vert
    const bloquee = this.bossVivant;
    const pulse = bloquee ? 0 : 0.55 + 0.45 * Math.sin(this.time.now / 260);

    if (this.def.sortie === 'echelle'){
      g.fillStyle(0x0a0d18, 0.9); g.fillRect(x - 30, sol - 210, 60, 210);
      g.lineStyle(5, 0x8f9ad0, 1);
      g.beginPath(); g.moveTo(x - 14, sol); g.lineTo(x - 14, sol - 200); g.strokePath();
      g.beginPath(); g.moveTo(x + 14, sol); g.lineTo(x + 14, sol - 200); g.strokePath();
      g.lineStyle(4, 0xb7c0ee, 1);
      for (let y = sol - 12; y > sol - 200; y -= 22){
        g.beginPath(); g.moveTo(x - 14, y); g.lineTo(x + 14, y); g.strokePath();
      }
      g.fillStyle(0x4dd6c1, 0.3 + 0.3*pulse); g.fillTriangle(x, sol - 216, x - 13, sol - 200, x + 13, sol - 200);
    } else
    if (this.def.sortie === 'porte'){
      // l'entrée de la tour : un bloc sombre percé d'une porte éclairée
      g.fillStyle(0x120f22, 1); g.fillRect(x - 90, sol - 300, 180, 300);
      g.fillStyle(0x1d1836, 1); g.fillRect(x - 90, sol - 300, 180, 8);
      for (let fy = sol - 280; fy < sol - 120; fy += 30){
        for (let fx = x - 74; fx < x + 62; fx += 34){
          if (Math.abs(Math.sin(fx*0.21 + fy*0.37)) < 0.5) continue;
          g.fillStyle(0xffd98a, 0.6); g.fillRect(fx, fy, 14, 14);
        }
      }
      g.fillStyle(0xffb347, 0.16 + 0.1*pulse); g.fillRect(x - 46, sol - 116, 92, 116);
      g.fillStyle(0x090c16, 1); g.fillRect(x - 34, sol - 96, 68, 96);
      g.fillStyle(0xffd98a, 0.35 + 0.35*pulse); g.fillRect(x - 34, sol - 96, 68, 6);
      g.lineStyle(3, COUL.ceinture, 0.8); g.strokeRect(x - 34, sol - 96, 68, 96);
    } else if (this.def.sortie === 'arche'){
      // arche de pierre : la sortie des niveaux de plein air
      g.fillStyle(0x000000, 0.18); g.fillEllipse(x, sol, 96, 10);
      g.fillStyle(0x5d5040, 1); g.fillRect(x - 46, sol - 120, 18, 120);
      g.fillStyle(0x5d5040, 1); g.fillRect(x + 28, sol - 120, 18, 120);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x - 42, sol - 116, 12, 116);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x + 30, sol - 116, 12, 116);
      g.fillStyle(0x5d5040, 1); g.fillRect(x - 54, sol - 138, 108, 24);
      g.fillStyle(0x7a6a52, 1); g.fillRect(x - 50, sol - 134, 100, 14);
      g.fillStyle(0xffd98a, 0.10 + 0.25*pulse); g.fillRect(x - 28, sol - 114, 56, 114);
      g.fillStyle(0x4dd6c1, 0.35 + 0.5*pulse);
      g.fillTriangle(x, sol - 156, x - 13, sol - 141, x + 13, sol - 141);
    } else {
      g.fillStyle(0x0d1120, 1);  g.fillRect(x - 44, sol - 132, 88, 132);
    g.fillStyle(0x2a3152, 1);  g.fillRect(x - 40, sol - 126, 80, 126);
    g.fillStyle(0x141a30, 1);  g.fillRect(x - 34, sol - 118, 68, 118);
    g.lineStyle(3, 0x7f8cc4, 1); g.strokeRect(x - 40, sol - 126, 80, 126);
    g.lineStyle(2, 0x7f8cc4, 0.8);
    g.beginPath(); g.moveTo(x, sol - 118); g.lineTo(x, sol); g.strokePath();
    // flèche qui monte
      g.fillStyle(bloquee ? 0xe2584d : 0x4dd6c1, bloquee ? 0.5 : 0.35 + 0.5*pulse);
      g.fillTriangle(x, sol - 150, x - 14, sol - 134, x + 14, sol - 134);
      g.fillStyle(bloquee ? 0xe2584d : 0xffd98a, 0.25 + 0.35*pulse); g.fillRect(x - 40, sol - 138, 80, 5);
    }
    // sortie condamnée tant que le boss tient : la croix vaut pour toutes
    if (bloquee){
      g.lineStyle(5, 0xe2584d, 0.75);
      g.beginPath(); g.moveTo(x - 34, sol - 112); g.lineTo(x + 34, sol - 16); g.strokePath();
      g.beginPath(); g.moveTo(x + 34, sol - 112); g.lineTo(x - 34, sol - 16); g.strokePath();
    }
  },

  dessinerCaisses(){
    const g = this.gCaisses; g.clear();
    for (const k of this.caisses){
      const x = k.go.x, y = k.go.y, clair = k.flash > 0;
      g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+16, 30, 6);
      g.fillStyle(clair ? 0xffffff : COUL.bois, 1);       g.fillRect(x-15, y-15, 30, 30);
      g.fillStyle(clair ? 0xffffff : COUL.boisClair, 1);  g.fillRect(x-11, y-11, 22, 22);
      g.lineStyle(3, clair ? 0xffffff : COUL.boisOmbre, 1);
      g.beginPath(); g.moveTo(x-11, y-11); g.lineTo(x+11, y+11); g.strokePath();
      g.beginPath(); g.moveTo(x+11, y-11); g.lineTo(x-11, y+11); g.strokePath();
    }
  },
  dessinerObjets(){
    const g = this.gObjets; g.clear();
    for (const o of this.objets){
      const x = o.go.x, y = o.go.y + Math.sin(o.phase)*2.5;
      if (o.type === 'vie'){
        // une VIE : cœur doré à petites ailes, halo appuyé — il ne doit
        // pas se confondre avec le cœur de soin rouge
        const bat = Math.sin(o.phase * 2) * 2;
        g.fillStyle(0xffd166, 0.22); g.fillCircle(x, y, 17);
        g.fillStyle(0xfff0c2, 0.9);
        g.fillTriangle(x-8, y-4, x-16, y-9+bat, x-8, y+2);
        g.fillTriangle(x+8, y-4, x+16, y-9+bat, x+8, y+2);
        g.fillStyle(0xffd166, 1);
        g.fillCircle(x-4, y-3, 5); g.fillCircle(x+4, y-3, 5);
        g.fillTriangle(x-9, y, x+9, y, x, y+10);
        g.fillStyle(0xffffff, 0.9); g.fillCircle(x-4, y-5, 1.8);
        continue;
      }
      if (o.type === 'coeur'){
        g.fillStyle(0xe2584d, 0.18); g.fillCircle(x, y, 15);
        g.fillStyle(0xe2584d, 1);
        g.fillCircle(x-4, y-3, 5); g.fillCircle(x+4, y-3, 5);
        g.fillTriangle(x-9, y, x+9, y, x, y+10);
        g.fillStyle(0xff9d9d, 0.85); g.fillCircle(x-4, y-5, 1.8);
      } else {
        const a = ARMES[o.type];
        g.fillStyle(a.couleur, 0.2); g.fillCircle(x, y, 16);
        g.lineStyle(5, a.couleur, 1); g.strokeCircle(x, y, 8);
        g.lineStyle(2, a.clair, 1);   g.strokeCircle(x, y, 8);
        g.fillStyle(0xffffff, 0.9);   g.fillCircle(x, y - 8, 2.6);
      }
    }
  },
  dessinerMonstres(){
    const g = this.gMonstres; g.clear();
    for (const m of this.monstres){
      const s = m.def.silhouette;
      if (s === 'drone') this.dessinerDrone(g, m);
      else if (s === 'gardien') this.dessinerGardien(g, m);
      else if (s === 'tourelle') this.dessinerTourelle(g, m);
      else this.dessinerBrute(g, m);
      if (m.pv < m.pvMax){
        const l = m.def.boss ? m.def.taille[0]*0.6 : 13;
        const x = m.go.x, y = m.go.y - m.def.taille[1]/2 - 12;
        g.fillStyle(0x2a3355, 1); g.fillRect(x-l, y, l*2, 4);
        g.fillStyle(m.def.boss ? 0xff5e5e : 0xe2584d, 1); g.fillRect(x-l, y, l*2 * (m.pv/m.pvMax), 4);
      }
    }
  },
  dessinerBrute(g, m){
    const gros = !!m.def.gros;
    const e = m.def.taille[0] / 26;   // l'échelle découle de la taille déclarée
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const dandine = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const corps = eclaire || m.def.couleur || (gros ? COUL.colosse : COUL.baveux);
    const ombre = eclaire || m.def.ombre   || (gros ? COUL.colosseOmbre : COUL.baveuxOmbre);
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 26*e, 6*e);
    g.fillStyle(ombre, 1);
    g.fillEllipse(x-6*e, y-3*e, 8*e, 8*e); g.fillEllipse(x+6*e, y-3*e, 8*e, 8*e);
    g.fillStyle(corps, 1);
    g.fillEllipse(x, y-15*e+dandine, 26*e, 26*e);
    g.fillTriangle(x-11*e, y-22*e+dandine, x-5*e, y-34*e+dandine, x-2*e, y-21*e+dandine);
    g.fillTriangle(x+11*e, y-22*e+dandine, x+5*e, y-34*e+dandine, x+2*e, y-21*e+dandine);
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(m.def.boss ? 0xffd166 : gros ? COUL.colosseOeil : COUL.baveuxOeil, 1);
    g.fillCircle(x + vers*3 - 4*e, y-17*e+dandine, 3*e);
    g.fillCircle(x + vers*3 + 4*e, y-17*e+dandine, 3*e);
    g.fillStyle(0x1a0f22, 1);
    g.fillCircle(x + vers*4 - 4*e, y-17*e+dandine, 1.4*e);
    g.fillCircle(x + vers*4 + 4*e, y-17*e+dandine, 1.4*e);
  },
  dessinerDrone(g, m){
    const x = m.go.x, y = m.go.y;
    const flotte = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    g.fillStyle(0x000000, 0.18); g.fillEllipse(x, SOL_Y - 3, 26, 5);
    g.fillStyle(eclaire || COUL.droneOmbre, 1);
    g.fillRoundedRect(x-15, y-4+flotte, 30, 9, 4);
    g.fillStyle(eclaire || COUL.drone, 1);
    g.fillRoundedRect(x-13, y-13+flotte, 26, 20, 7);
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(0x11142a, 1); g.fillRoundedRect(x-9, y-9+flotte, 18, 7, 3);
    g.fillStyle(COUL.droneOeil, 1); g.fillRect(x - 3 + vers*3, y-8+flotte, 7, 3);
    const bat = Math.sin(m.phase * 6) * 5;
    g.lineStyle(2, eclaire || COUL.droneOmbre, 0.9);
    g.beginPath(); g.moveTo(x-16-bat, y-15+flotte); g.lineTo(x-6+bat, y-15+flotte); g.strokePath();
    g.beginPath(); g.moveTo(x+6-bat, y-15+flotte); g.lineTo(x+16+bat, y-15+flotte); g.strokePath();
  },
  dessinerGardien(g, m){
    const e = m.def.taille[0] / 28;
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    // quand il se ramasse avant de bondir, il s'accroupit et clignote :
    // c'est le signal qu'il faut sauter ou reculer
    const p = m.prepare > 0 ? 1 - m.prepare / m.def.charge.preparation : 0;
    const tasse = m.prepare > 0 ? (7 * (1 - Math.abs(p - 0.5) * 2) + 5) * e : 0;
    const alerte = m.prepare > 0 && Math.floor(m.prepare * 14) % 2 === 0;
    const corps = eclaire || (alerte ? 0xffe9b0 : (m.def.couleur || COUL.gardien));
    const dandine = Math.sin(m.phase) * 1.5;
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 26*e, 6*e);
    g.fillStyle(eclaire || m.def.ombre || COUL.gardienOmbre, 1);
    g.fillRect(x-11*e, y-9*e+tasse, 8*e, 9*e); g.fillRect(x+3*e, y-9*e+tasse, 8*e, 9*e);
    g.fillStyle(corps, 1);
    g.fillRoundedRect(x-12*e, y-32*e+tasse+dandine, 24*e, 25*e, 5);
    g.fillStyle(eclaire || COUL.gardienOmbre, 1);
    g.fillRect(x-14*e, y-30*e+tasse+dandine, 28*e, 5*e);
    // casque à visière
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(corps, 1); g.fillRoundedRect(x-9*e, y-45*e+tasse+dandine, 18*e, 14*e, 5);
    g.fillStyle(0x0d1120, 1); g.fillRect(x-8*e, y-40*e+tasse+dandine, 16*e, 6*e);
    g.fillStyle(COUL.gardienVisiere, alerte ? 1 : 0.85);
    g.fillRect(x - 5*e + vers*3, y-39*e+tasse+dandine, 8*e, 4*e);
    // matraque
    g.lineStyle(4*e, eclaire || 0x1d2340, 1);
    g.beginPath(); g.moveTo(x + vers*10*e, y-24*e+tasse+dandine);
    g.lineTo(x + vers*(18 + (m.prepare > 0 ? -6 : 0))*e, y-14*e+tasse+dandine); g.strokePath();
  },
  dessinerTourelle(g, m){
    const e = m.def.taille[0] / 30;
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const c = m.def.canon;
    const charge = m.vise > 0 ? 1 - m.vise / c.visee : 0;
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 30*e, 6*e);
    g.fillStyle(eclaire || m.def.ombre || COUL.tourelleOmbre, 1); g.fillRect(x-15*e, y-10*e, 30*e, 10*e);
    g.fillStyle(eclaire || m.def.couleur || COUL.tourelle, 1); g.fillRoundedRect(x-12*e, y-26*e, 24*e, 18*e, 5);
    // le canon suit le joueur : on voit qu'on est visé avant de prendre le tir
    const dx = this.joueur.x - x, dy = (this.joueur.y - 10) - (y - 20*e);
    const ang = Math.atan2(dy, dx);
    const lx = x + Math.cos(ang)*20*e, ly = (y-20*e) + Math.sin(ang)*20*e;
    g.lineStyle(7*e, eclaire || m.def.ombre || COUL.tourelleOmbre, 1);
    g.beginPath(); g.moveTo(x, y-20*e); g.lineTo(lx, ly); g.strokePath();
    if (m.vise > 0){
      g.fillStyle(COUL.tourelleOeil, 0.25 + 0.5*charge); g.fillCircle(lx, ly, 4 + charge*7);
      g.lineStyle(1.5, COUL.tourelleOeil, 0.25 + 0.45*charge);
      g.beginPath(); g.moveTo(lx, ly);
      g.lineTo(lx + Math.cos(ang)*260, ly + Math.sin(ang)*260); g.strokePath();
    }
    g.fillStyle(COUL.tourelleOeil, m.vise > 0 ? 1 : 0.55); g.fillCircle(x, y-20*e, 3.5*e);
  },

  dessinerPerso(b){
    const g = this.perso; g.clear();
    const spr = this.persoSpr;
    const auSol = b.blocked.down || b.touching.down;
    const marche = Math.abs(b.velocity.x) > 20;
    const allure = Math.min(1, Math.abs(b.velocity.x) / CFG.vitesseCourse);
    const cadre = (anim, i) => {
      const cs = CADRES_PERSO[anim];
      const k = Phaser.Math.Clamp(i, 0, cs.length - 1);
      return { nom: anim + k, c: cs[k] };
    };
    let f;
    if (this.etat === 'perdu' || this.etat === 'gameover'){
      // à terre : la chute se joue une fois, puis on reste allongé
      f = cadre('mourir', Math.floor((this.time.now - (this.mortDebut || 0)) / 150));
    } else if (this.attaque){
      const c = COUPS[this.attaque.type];
