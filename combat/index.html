  /* le conteneur occupe tout l'écran : Phaser (Scale.FIT) ajuste le canvas

  #conteneur{position:fixed;inset:0}
  #conteneur canvas{display:block;margin:0 auto}
  .erreur{color:#e2584d;max-width:640px;text-align:center;padding:20px}

  .rotation{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);

  .titre{

<script>

<script>
// ─────────────────────────────────────────────────────────────
// VERSION ET CACHE
// Le numéro est affiché sur l'écran-titre : il suffit de le lire pour
// savoir ce qu'on a sous les yeux. Au chargement on redemande la page
// au serveur sans passer par le cache ; si elle annonce une version
// plus récente, on se recharge sur une URL neuve — un simple reload()
// pourrait resservir la copie en cache, une URL jamais vue non.
// ─────────────────────────────────────────────────────────────
const VERSION = '7';

(function verifierVersion(){
  if (location.protocol === 'file:' || typeof fetch !== 'function') return;
  let tentee = null;
  try { tentee = sessionStorage.getItem('mgc-version-tentee'); } catch (e) {}
  fetch(location.pathname + '?cb=' + Date.now(), { cache:'no-store' })
    .then(r => r.ok ? r.text() : null)
    .then(txt => {
      if (!txt) return;
      const m = txt.match(/const VERSION = '([^']+)'/);
      if (!m) return;
      if (m[1] === VERSION){
        try { sessionStorage.removeItem('mgc-version-tentee'); } catch (e) {}
        return;
      }
      if (tentee === m[1]) return;   // déjà tenté pour cette version : on n'insiste pas
      try { sessionStorage.setItem('mgc-version-tentee', m[1]); } catch (e) {}
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    })
    .catch(() => {});   // hors ligne ou origine inaccessible : on joue la version en place
})();

(function afficherVersion(){
  const el = document.getElementById('version');
  if (el) el.textContent = 'v' + VERSION;
})();

// ─────────────────────────────────────────────────────────────
// RÉGLAGES
// ─────────────────────────────────────────────────────────────
const CFG = {
  gravite:       2200,
  vitesseSaut:   700,
  coupureSaut:   220,
  coyote:        0.10,
  bufferSaut:    0.12,
  vitesseCourse: 330,   // joystick à fond ; l'axe étant analogique, tout
  vitesseAccroupi: 78,  // ce qui est en dessous donne une allure plus lente
  accel:         2000,
  frein:         2600,
  controleAir:   0.55,
  pvJoueur:      5,
  invincibilite: 0.9,
  invulnRenais:  1.8,   // le temps de souffler quand on réapparaît
  zoneMorte:     0.24,  // part du rayon du joystick ignorée au centre
  seuilHaut:     0.45,  // au-delà, le joystick vers le haut = saut
  seuilBas:      0.45,  // au-delà, le joystick vers le bas = accroupi
  chanceCoeur:   0.35,  // proportion de monstres vaincus qui lâchent un cœur

// Les zones de coup sont mesurées depuis les PIEDS du personnage, comme
// son dessin : c'est le seul repère qui reste juste quand il s'accroupit.
const PIEDS = 20;          // décalage du bas de la boîte par rapport à son centre
const DECALAGE_ACCROUPI = 16;  // accroupi, tous les coups descendent d'autant

const COUPS = {
  poing:    { duree:0.26, debut:0.05, fin:0.14, portee: 26, hauteur:32, dy:-40, degats:1, recul:210, elan: 40, secousse:0.004, son:'poing' },
  // dy remonté à -34 : à -26 le pied passait sous le drone et ne pouvait
  // jamais l'atteindre, alors que debout il est censé être vulnérable
  pied:     { duree:0.44, debut:0.13, fin:0.27, portee: 36, hauteur:34, dy:-34, degats:2, recul:360, elan:120, secousse:0.009, son:'pied' },
  // uppercut, sur la flèche du haut : il frappe au-dessus de la tête, donc

  crochet:  { duree:0.30, debut:0.07, fin:0.17, portee: 26, hauteur:38, dy:-54, degats:2, recul:260, elan:  0, secousse:0.007, son:'poing' },
  retourne: { duree:0.62, debut:0.20, fin:0.40, portee: 34, hauteur:40, dy:-34, degats:3, recul:430, elan:  0, secousse:0.013, son:'retourne', bilateral:true },

  pistolet: { duree:0.20, debut:0.05, fin:0.06, portee:  0, hauteur: 0, dy:-40, degats:2, recul:180, elan:0, secousse:0.005, son:'pistolet', tir:{ nb:1, vitesse:820, dispersion:0 } },
  fusil:    { duree:0.52, debut:0.07, fin:0.08, portee:  0, hauteur: 0, dy:-38, degats:2, recul:320, elan:0, secousse:0.014, son:'fusil',    tir:{ nb:3, vitesse:700, dispersion:0.13 } },
};

// Ce qu'on trouve dans les caisses. Toutes se branchent sur le bouton ✕.
const ARMES = {
  laser:    { nom:'LASER',    munitions:14, couleur:0xc46bff, clair:0xe9b6ff },
  pistolet: { nom:'PISTOLET', munitions:24, couleur:0xffd166, clair:0xfff0c2 },
  fusil:    { nom:'FUSIL',    munitions:10, couleur:0xff7b54, clair:0xffc2ac },
};

// Trois bestioles, trois façons de les atteindre. C'est ce qui donne
// son intérêt à l'accroupissement : chacune n'est vulnérable qu'à une hauteur.
const MONSTRES = {
  baveux:  { pv:3, taille:[26,30], vitesse:85, patrouille:45, degats:1, hauteurVol:0,  faible:'bas',  vole:false },
  drone:   { pv:2, taille:[26,24], vitesse:110, patrouille:60, degats:1, hauteurVol:46, faible:'haut', vole:true  },
  colosse: { pv:6, taille:[38,44], vitesse:52, patrouille:30, degats:2, hauteurVol:0,  faible:null,   vole:false },
};

const L = 900, H = 480, SOL_Y = 380, LARGEUR_MONDE = 7600;

const COUL = {
  sol:0x0a0d1a, solBord:0x39457a, plat:0x16463f, platBord:0x4dd6c1,
  solVille:0x121018, solBordVille:0xe0a44c,
  gi:0xf2e6cf, giOmbre:0xd3c0a0, ceinture:0xff9d2e,
  peau:0xf0c090, peauOmbre:0xc9a377, cheveux:0x181d30, col:0x2b7d72, botte:0x232a45,
  baveux:0x7b3f8f, baveuxOmbre:0x552a63, baveuxOeil:0xffe08a,
  drone:0x39406b, droneOmbre:0x252a4a, droneOeil:0xff5e5e,
  colosse:0x8f4a3f, colosseOmbre:0x612f28, colosseOeil:0xffe08a,
  bois:0x8a5a2b, boisClair:0xb07a3e, boisOmbre:0x6d4420,

};
const HANCHE = -19, EPAULE = -30, TETE = -35;

// Le niveau est tiré au sort, mais toujours à partir de cette graine :
// mourir et réapparaître ne doit pas redessiner le monde sous nos pieds.
let GRAINE = (Math.random() * 1e9) | 0;
function generateur(s){
  return function(){
    s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ─────────────────────────────────────────────────────────────
// RECORD
// ─────────────────────────────────────────────────────────────
const CLE_RECORD = 'martin-games-combat';
function lireRecord(){
  try {
    const r = JSON.parse(localStorage.getItem(CLE_RECORD));
    if (r && typeof r.monstres === 'number') return r;
  } catch (e) { /* navigation privée : on joue sans record */ }
  return { monstres:0, metres:0 };
}
function ecrireRecord(r){
  try { localStorage.setItem(CLE_RECORD, JSON.stringify(r)); } catch (e) {}
}
function afficherRecord(){
  const r = lireRecord(), el = document.getElementById('record');
  if (el) el.textContent = (r.monstres || r.metres)
    ? 'RECORD  ' + r.monstres + ' MONSTRES  ·  ' + r.metres + ' M' : '';
}
afficherRecord();

// ─────────────────────────────────────────────────────────────
// SON
// Tout est synthétisé à la volée : aucun fichier à charger, donc le
// jeu tient toujours en un seul fichier. iOS n'autorise l'audio qu'après
// un geste — d'où le démarrage au moment où on lance la partie.
// ─────────────────────────────────────────────────────────────
const SON = {
  ctx:null, sortie:null, actif:true,
  demarrer(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.sortie = this.ctx.createGain();
    this.sortie.gain.value = 0.26;
    this.sortie.connect(this.ctx.destination);
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  note(forme, f0, f1, duree, vol, delai){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime + (delai || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = forme;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + duree);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duree);
    o.connect(g); g.connect(this.sortie);
    o.start(t); o.stop(t + duree + 0.03);
  },
  souffle(duree, vol, freq, q){
    if (!this.ctx || !this.actif) return;
    const t = this.ctx.currentTime;
    const n = Math.max(1, Math.floor(this.ctx.sampleRate * duree));
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = this.ctx.createBufferSource(); s.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = this.ctx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.sortie);
    s.start(t);
  },
  jouer(nom){
    if (!this.ctx || !this.actif) return;
    switch (nom){
      case 'poing':    this.souffle(0.09, 0.45, 900, 1.2); this.note('sine', 180, 90, 0.09, 0.22); break;
      case 'pied':     this.souffle(0.16, 0.5, 520, 1.0);  this.note('sine', 150, 60, 0.16, 0.26); break;
      case 'retourne': this.souffle(0.28, 0.4, 380, 0.8);  this.note('triangle', 230, 70, 0.3, 0.24); break;
      case 'laser':    this.note('sawtooth', 1500, 190, 0.3, 0.3); this.note('square', 720, 95, 0.3, 0.14); break;
      case 'pistolet': this.souffle(0.07, 0.55, 1800, 1.4); this.note('square', 620, 160, 0.08, 0.22); break;
      case 'fusil':    this.souffle(0.22, 0.7, 700, 0.6);   this.note('sawtooth', 260, 70, 0.22, 0.3); break;
      case 'touche':   this.souffle(0.11, 0.5, 1500, 0.9);  this.note('square', 330, 130, 0.09, 0.2); break;
      case 'blinde':   this.note('square', 1200, 900, 0.11, 0.22); this.souffle(0.09, 0.3, 2600, 2); break;
      case 'vaincu':   this.note('square', 420, 80, 0.34, 0.24); this.souffle(0.3, 0.32, 700, 0.6); break;
      case 'saut':     this.note('sine', 320, 640, 0.12, 0.2); break;
      case 'caisse':   this.souffle(0.2, 0.55, 300, 0.5); this.note('triangle', 150, 60, 0.18, 0.2); break;
      case 'coeur':    this.note('sine', 660, 660, 0.1, 0.24); this.note('sine', 990, 990, 0.14, 0.24, 0.09); break;
      case 'arme':     [440,660,880,1320].forEach((f,i) => this.note('square', f, f, 0.1, 0.16, i*0.06)); break;
      case 'degat':    this.note('sawtooth', 300, 70, 0.3, 0.28); this.souffle(0.2, 0.32, 400, 0.7); break;
      case 'mort':     [440,330,262,196].forEach((f,i) => this.note('triangle', f, f, 0.26, 0.22, i*0.16)); break;
      case 'gagne':    [523,659,784,1047].forEach((f,i) => this.note('square', f, f, 0.2, 0.2, i*0.11)); break;
      case 'vide':     this.note('square', 160, 120, 0.06, 0.12); break;
    }
  },
};

// ─────────────────────────────────────────────────────────────
// ZOOM
// iOS ignore user-scalable=no depuis iOS 10, et touch-action n'a été
// suivi qu'à partir de Safari 13. On coupe donc aussi à la main les
// deux gestes qui zooment : le double-tap et le pincement.
// ─────────────────────────────────────────────────────────────
for (const ev of ['gesturestart','gesturechange','gestureend'])
  addEventListener(ev, e => e.preventDefault(), { passive:false });

let dernierTap = 0;
addEventListener('touchend', e => {
  if (e.timeStamp - dernierTap < 350) e.preventDefault();
  dernierTap = e.timeStamp;
}, { passive:false });

addEventListener('dblclick', e => e.preventDefault(), { passive:false });

// ─────────────────────────────────────────────────────────────
// MANETTE TACTILE
// Joystick : gauche/droite pour avancer, bas pour s'accroupir et ramper,
// haut pour l'uppercut. Le saut revient sur ✕, et le bouton poing cède
// sa place à l'arme dès qu'on en ramasse une. Chaque bouton capte son
// propre pointeur, le multi-touch marche sans code supplémentaire.
// ─────────────────────────────────────────────────────────────
const ENTREE = {
  axeX:0, saut:false, sautPresse:false, accroupi:false,
  haut:false, hautPresse:false,
  coupPresse:null, validePresse:false,
};

const socle = document.getElementById('socle');
const pouce = document.getElementById('pouce');
let pointeurJoystick = null;

function majJoystick(e){
  const r = socle.getBoundingClientRect();
  const rayon = r.width / 2;
  let dx = e.clientX - (r.left + rayon);
  let dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  const limite = rayon - 12;
  if (d > limite){ dx *= limite / d; dy *= limite / d; }
  pouce.style.transform = `translate(${dx}px, ${dy}px)`;

  const nx = dx / limite, ny = dy / limite;
  // on réétale [zoneMorte, 1] sur [0, 1] : sans ça la vitesse sautait
  // d'un coup à 24 % dès qu'on quittait le centre, au lieu de partir de zéro
  const a = Math.abs(nx);
  ENTREE.axeX = a < CFG.zoneMorte ? 0
    : Math.sign(nx) * Math.min(1, (a - CFG.zoneMorte) / (1 - CFG.zoneMorte));

  // l'uppercut exige une poussée franchement verticale, sinon courir en
  // diagonale vers le haut le déclencherait sans arrêt
  const versLeHaut = ny < -CFG.seuilHaut && Math.abs(ny) > Math.abs(nx);
  if (versLeHaut && !ENTREE.haut){ ENTREE.hautPresse = true; ENTREE.validePresse = true; }
  ENTREE.haut = versLeHaut;
  // en bas, pas d'exigence de ce genre : bas + côté, c'est ramper
  ENTREE.accroupi = ny > CFG.seuilBas;
}
function relacherJoystick(){
  pointeurJoystick = null;
  ENTREE.axeX = 0; ENTREE.haut = false; ENTREE.accroupi = false;
  pouce.style.transform = 'translate(0,0)';
  socle.classList.remove('actif');
}
// la capture de pointeur est un confort, pas une condition : si elle
// échoue, il ne faut surtout pas que l'appui soit perdu avec elle
function capturer(el, id){ try { el.setPointerCapture(id); } catch (e) {} }

socle.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointeurJoystick = e.pointerId;
  capturer(socle, e.pointerId);
  socle.classList.add('actif');
  majJoystick(e);
});
socle.addEventListener('pointermove', e => { if (e.pointerId === pointeurJoystick) majJoystick(e); });
for (const ev of ['pointerup','pointercancel','lostpointercapture'])
  socle.addEventListener(ev, e => { if (e.pointerId === pointeurJoystick) relacherJoystick(); });

for (const b of document.querySelectorAll('.pad button')){
  const a = b.dataset.action;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    capturer(b, e.pointerId);
    if (a === 'saut'){ ENTREE.saut = true; ENTREE.sautPresse = true; }
    else ENTREE.coupPresse = a;
    ENTREE.validePresse = true;   // n'importe quel bouton relance après une mort
  });
  // relâcher ✕ écourte le saut : c'est ce qui le rend modulable
  const fin = () => { if (a === 'saut') ENTREE.saut = false; };
  for (const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev, fin);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// le bouton poing affiche l'arme en cours et ses munitions
const boutonArme = document.querySelector('.b-carre');
function majBoutonArme(arme, munitions){
  const signe = boutonArme.querySelector('.signe');
  const nom   = boutonArme.querySelector('.nom');
  if (arme){
    boutonArme.classList.add('armee');
    signe.textContent = '✦';
    nom.textContent = ARMES[arme].nom + ' ' + munitions;
  } else {
    boutonArme.classList.remove('armee');
    signe.textContent = '□';
    nom.textContent = 'POING';
  }
}

const boutonSon = document.getElementById('son');
boutonSon.addEventListener('pointerdown', e => {
  e.preventDefault();
  SON.actif = !SON.actif;
  boutonSon.classList.toggle('coupe', !SON.actif);
  boutonSon.textContent = SON.actif ? '♪' : '✕';
  if (SON.actif) SON.jouer('coeur');
});

// clavier de secours pour tester sur un ordinateur
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft')  { ENTREE.axeX = -1; e.preventDefault(); }
  if (e.code === 'ArrowRight') { ENTREE.axeX =  1; e.preventDefault(); }
  if (e.code === 'ArrowDown')  { ENTREE.accroupi = true; e.preventDefault(); }
  if (e.code === 'ArrowUp' && !e.repeat){
    ENTREE.hautPresse = true; ENTREE.validePresse = true; e.preventDefault();
  }
  if (e.code === 'Space' && !e.repeat){
    ENTREE.saut = true; ENTREE.sautPresse = true; ENTREE.validePresse = true; e.preventDefault();
  }
  if (e.code === 'KeyA') { ENTREE.coupPresse = 'poing'; ENTREE.validePresse = true; }
  if (e.code === 'KeyZ') { ENTREE.coupPresse = 'pied'; ENTREE.validePresse = true; }
  if (e.code === 'KeyE') { ENTREE.coupPresse = 'retourne'; ENTREE.validePresse = true; }
});
addEventListener('keyup', e => {
  if ((e.code === 'ArrowLeft' && ENTREE.axeX < 0) || (e.code === 'ArrowRight' && ENTREE.axeX > 0)) ENTREE.axeX = 0;
  if (e.code === 'ArrowDown') ENTREE.accroupi = false;
  if (e.code === 'Space') ENTREE.saut = false;
});

// ─────────────────────────────────────────────────────────────
// SCÈNE
// ─────────────────────────────────────────────────────────────
class Combat extends Phaser.Scene {
  constructor(){ super('combat'); }

  create(){
    this.alea = generateur(GRAINE);
    this.phase = 0; this.squash = 0; this.sens = 1;
    this.coyote = 0; this.buffer = 0;
    this.attaque = null;
    this.pv = CFG.pvJoueur; this.invuln = 0;
    this.vaincus = 0; this.morts = 0; this.etat = 'jeu';
    this.accroupi = false;
    this.arme = null; this.munitions = 0;
    this.astuceBas = false; this.astuceHaut = false;
    this.eclats = []; this.objets = []; this.caisses = []; this.tirs = [];
    this.msg = null;
    majBoutonArme(null, 0);

    this.physics.world.setBounds(0, -400, LARGEUR_MONDE, H + 900);
    // Pas de mur en bas : setCollideWorldBounds sert à empêcher de sortir
    // par les côtés, mais s'il bloque aussi le bas, on ne tombe jamais
    // vraiment et le test de chute ne se déclenche pas.
    this.physics.world.setBoundsCollision(true, true, false, false);
    this.cameras.main.setBounds(0, 0, LARGEUR_MONDE, H);

    this.fond = this.add.graphics().setScrollFactor(0).setDepth(-10);
    this.sols = this.add.group();
    this.plateformes = this.add.group();
    this.grCaisses = this.add.group();
    this.monstres = [];

    this.joueur = this.add.rectangle(120, SOL_Y - 60, 28, 40, 0xffffff, 0);
    this.physics.add.existing(this.joueur);
    this.joueur.body.setCollideWorldBounds(true);
    this.checkpoint = { x:120, y:SOL_Y - 60 };

    this.gCaisses  = this.add.graphics().setDepth(3);
    this.gMonstres = this.add.graphics().setDepth(4);
    this.gObjets   = this.add.graphics().setDepth(4.5);
    this.perso     = this.add.graphics().setDepth(5);
    this.gEclats   = this.add.graphics().setDepth(6);
    this.gTirs     = this.add.graphics().setDepth(7);

    this.construireNiveau();
    this.physics.add.collider(this.joueur, this.sols);
    this.physics.add.collider(this.joueur, this.plateformes);
    this.physics.add.collider(this.joueur, this.grCaisses);
    this.cameras.main.startFollow(this.joueur, true, 0.12, 0.1, 0, 60);

    this.hud = this.add.graphics().setScrollFactor(0).setDepth(10);
    this.hudTexte = this.add.text(22, 60, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'12px', color:'#8d9ac4' })
      .setScrollFactor(0).setDepth(10);
    this.hudMsg = this.add.text(L/2, 96, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'13px', color:'#ffd98a' })
      .setOrigin(0.5).setScrollFactor(0).setDepth(11).setAlpha(0);
    this.hudFin = this.add.text(L/2, H/2 - 30, '',
      { fontFamily:'ui-monospace, Menlo, monospace', fontSize:'18px', color:'#cbd5f0', align:'center' })
      .setOrigin(0.5).setScrollFactor(0).setDepth(11);
  }

  // ── décor ───────────────────────────────────────────────────
  // 0 = campagne, 1 = ville. La bascule se fait entre 42 % et 68 %
  // du niveau : on voit la ville arriver bien avant d'y être.
  urbain(x){ return Phaser.Math.Clamp((x / LARGEUR_MONDE - 0.42) / 0.26, 0, 1); }
  melange(a, b, t){
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    return (((ar+(br-ar)*t)|0)<<16) | (((ag+(bg-ag)*t)|0)<<8) | ((ab+(bb-ab)*t)|0);
  }

  // ── niveau ──────────────────────────────────────────────────
  creerSol(x, w){
    // un seul corps physique, mais le visuel est tranché en lamelles dans
    // la zone de transition : sinon la couleur saute d'un bloc à l'autre
    const r = this.add.rectangle(x + w/2, SOL_Y + (H - SOL_Y)/2, w, H - SOL_Y, 0, 0);
    this.physics.add.existing(r, true);
    this.sols.add(r);

    const uG = this.urbain(x), uD = this.urbain(x + w);
    const pas = (uG === uD) ? w : 40;
    for (let sx = x; sx < x + w; sx += pas){
      const lw = Math.min(pas, x + w - sx);
      const u = this.urbain(sx + lw/2);
      this.add.rectangle(sx + lw/2, SOL_Y + (H - SOL_Y)/2, lw + 1, H - SOL_Y,
        this.melange(COUL.sol, COUL.solVille, u)).setDepth(-5);
      this.add.rectangle(sx + lw/2, SOL_Y + 2, lw + 1, 4,
        this.melange(COUL.solBord, COUL.solBordVille, u)).setDepth(-4);
    }
  }
  creerPlateforme(x, y, w){
    const p = this.add.rectangle(x + w/2, y + 7, w, 14, COUL.plat).setStrokeStyle(2, COUL.platBord);
    this.physics.add.existing(p, true);
    p.body.checkCollision.down = false;
    p.body.checkCollision.left = false;
    p.body.checkCollision.right = false;
    this.plateformes.add(p);
  }
  creerMonstre(type, x, minX, maxX){
    const d = MONSTRES[type];
    const y = SOL_Y - d.taille[1]/2 - d.hauteurVol;
    const go = this.add.rectangle(x, y, d.taille[0], d.taille[1], 0xffffff, 0);
    this.physics.add.existing(go);
    go.body.setCollideWorldBounds(true);
    if (d.vole){
      go.body.setAllowGravity(false);
    } else {
      this.physics.add.collider(go, this.sols);
      this.physics.add.collider(go, this.plateformes);
      this.physics.add.collider(go, this.grCaisses);
    }
    this.monstres.push({
      go, type, def:d, pv:d.pv, pvMax:d.pv, assomme:0, flash:0, blinde:0,
      dir:-1, minX, maxX, baseY:y, phase:this.alea()*6,
    });
  }
  creerCaisse(x){
    const c = this.add.rectangle(x, SOL_Y - 15, 30, 30, 0xffffff, 0);
    this.physics.add.existing(c, true);
    this.grCaisses.add(c);
    this.caisses.push({ go:c, pv:2, flash:0 });
  }
  // la campagne est au baveux, la ville au drone, le colosse traîne partout
  tirerType(x){
    const u = this.urbain(x), r = this.alea();
    if (r < 0.14) return 'colosse';
    return r < 0.14 + (1 - u) * 0.86 ? 'baveux' : 'drone';
  }
  construireNiveau(){
    this.creerSol(-200, 900);
    let x = 700;
    while (x < LARGEUR_MONDE - 700){
      const long = 380 + this.alea() * 420;
      this.creerSol(x, long);
      if (this.alea() < 0.4)
        this.creerPlateforme(x + long*0.35, SOL_Y - 105 - this.alea()*25, 120 + this.alea()*70);
      const nb = 1 + (this.alea() < 0.45 ? 1 : 0);
      for (let i = 0; i < nb; i++){
        const mx = x + 80 + this.alea()*(long - 160);
        this.creerMonstre(this.tirerType(mx), mx, x + 30, x + long - 30);
      }
      if (this.alea() < 0.45) this.creerCaisse(x + 60 + this.alea()*(long - 120));
      x += long;
      if (this.alea() < 0.55) x += 80 + this.alea()*40;
    }
    this.creerSol(x, 700);
    this.finX = x + 560;
    this.portail = this.add.rectangle(this.finX, SOL_Y - 60, 16, 120, 0xff9d2e, 0.25)
      .setStrokeStyle(2, COUL.ceinture);
  }

  // ── combat ──────────────────────────────────────────────────
  lancerAttaque(type){
    if (this.attaque) return;
    const c = COUPS[type];
    this.attaque = { type, t:0, bas:this.accroupi, touches:new Set() };
    SON.jouer(c.son);
    if (c.secousse) this.cameras.main.shake(90, c.secousse);
    if (c.tir) this.tirer(c);
    if (c.elan && this.joueur.body.blocked.down && !this.accroupi)
      this.joueur.body.setVelocityX(this.sens * c.elan);
  }
  utiliserArme(){
    if (!this.arme){ SON.jouer('vide'); return; }
    if (this.attaque) return;
    this.munitions--;
    this.lancerAttaque(this.arme);
    if (this.munitions <= 0){
      this.arme = null; this.munitions = 0;
      this.message('ARME VIDE');
    }
    majBoutonArme(this.arme, this.munitions);
  }
  tirer(c){
    const y = this.hauteurCoup(c);
    for (let i = 0; i < c.tir.nb; i++){
      const ec = (c.tir.nb === 1) ? 0 : (i - (c.tir.nb-1)/2) * c.tir.dispersion;
      this.tirs.push({
        x: this.joueur.x + this.sens*16, y,
        vx: this.sens * c.tir.vitesse * Math.cos(ec),
        vy: c.tir.vitesse * Math.sin(ec),
        degats: c.degats, recul: c.recul, bas: this.attaque.bas,
        couleur: ARMES[this.arme] ? ARMES[this.arme].couleur : 0xffd166,
        vie: 1.1,
      });
    }
  }
  // hauteur d'un coup, mesurée depuis les pieds comme le dessin du perso
  hauteurCoup(c){
    return this.joueur.y + PIEDS + c.dy + (this.accroupi ? DECALAGE_ACCROUPI : 0);
  }
  zonesAttaque(){
    const c = COUPS[this.attaque.type];
    if (!c.portee) return [];
    const dirs = c.bilateral ? [1, -1] : [this.sens];
    const y = this.joueur.y + PIEDS + c.dy + (this.attaque.bas ? DECALAGE_ACCROUPI : 0);
    return dirs.map(d => {
      const cx = this.joueur.x + d * (14 + c.portee/2);
      return new Phaser.Geom.Rectangle(cx - c.portee/2, y - c.hauteur/2, c.portee, c.hauteur);
    });
  }
  // le cœur de la mécanique : chaque bestiole n'est vulnérable qu'à une hauteur
  vulnerable(m, bas){
    if (m.def.faible === 'bas')  return bas;
    if (m.def.faible === 'haut') return !bas;
    return true;
  }
  frapper(m, degats, recul, bas, sourceX){
    if (!this.vulnerable(m, bas)){
      m.blinde = 0.18;
      SON.jouer('blinde');
      this.eclat(m.go.x, m.go.y, 0, 3, COUL.blinde);
      if (m.def.faible === 'bas' && !this.astuceBas){
        this.astuceBas = true;
        this.message("ACCROUPIS-TOI POUR TOUCHER LE VIOLET");
      } else if (m.def.faible === 'haut' && !this.astuceHaut){
        this.astuceHaut = true;
        this.message('LE DRONE VOLE TROP HAUT, RELÈVE-TOI');
      }
      return;
    }
    const dir = Math.sign(m.go.x - sourceX) || this.sens;
    m.pv -= degats; m.flash = 0.14; m.assomme = 0.22;
    m.go.body.setVelocity(dir * recul, m.def.vole ? 0 : -160);
    SON.jouer('touche');
    this.eclat(m.go.x, m.go.y, dir);
    if (m.pv <= 0){
      m.mort = true; this.vaincus++;
      SON.jouer('vaincu');
      this.eclat(m.go.x, m.go.y, dir, 14);
      if (this.alea() < CFG.chanceCoeur) this.creerObjet(m.go.x, m.go.y - 8, 'coeur');
      m.go.destroy();
    }
  }
  casser(k, degats){
    k.pv -= degats; k.flash = 0.12;
    SON.jouer('caisse');
    this.eclat(k.go.x, k.go.y - 4, this.sens, 5);
    if (k.pv <= 0){
      k.casse = true;
      this.eclat(k.go.x, k.go.y - 4, this.sens, 16);
      this.creerObjet(k.go.x, k.go.y - 8, this.butin());
      k.go.destroy();
    }
  }
  butin(){
    const r = this.alea();
    if (r < 0.20) return 'laser';
    if (r < 0.38) return 'pistolet';
    if (r < 0.50) return 'fusil';
    return 'coeur';
  }
  eclat(x, y, sens, n, couleur){
    n = n || 7;
    for (let i = 0; i < n; i++)
      this.eclats.push({ x, y:y-6, couleur: couleur || 0xffb347,
        vx: sens*(60 + this.alea()*190) + (this.alea()-0.5)*90,
        vy: -110 + (this.alea()-0.5)*220,
        vie: 0.28 + this.alea()*0.22, max: 0.5 });
  }
  blesser(source, degats){
    if (this.invuln > 0 || this.etat !== 'jeu') return;
    this.pv -= degats;
    this.invuln = CFG.invincibilite;
    const dir = this.joueur.x < source ? -1 : 1;
    this.joueur.body.setVelocity(dir * 240, -280);
    this.cameras.main.shake(140, 0.008);
    SON.jouer('degat');
    if (this.pv <= 0){ this.pv = 0; this.terminer('Tu es hors de combat'); }
  }

  // ── objets ──────────────────────────────────────────────────
  creerObjet(x, y, type){
    const o = this.add.rectangle(x, y, 18, 18, 0xffffff, 0);
    this.physics.add.existing(o);
    o.body.setVelocity((this.alea()-0.5)*140, -230);
    o.body.setBounce(0.35);
    o.body.setDragX(160);
    this.physics.add.collider(o, this.sols);
    this.physics.add.collider(o, this.plateformes);
    this.physics.add.collider(o, this.grCaisses);
    this.objets.push({ go:o, type, phase:this.alea()*6 });
  }
  ramasser(o){
    if (o.type === 'coeur'){
      if (this.pv >= CFG.pvJoueur) return;   // on laisse le cœur au sol pour plus tard
      this.pv++;
      SON.jouer('coeur');
      this.message('+1 ♥');
    } else {
      const a = ARMES[o.type];
      this.munitions = (this.arme === o.type ? this.munitions : 0) + a.munitions;
      this.arme = o.type;
      majBoutonArme(this.arme, this.munitions);
      SON.jouer('arme');
      this.message(a.nom + '  —  ✕ POUR TIRER  ×' + this.munitions);
    }
    o.pris = true;
    o.go.destroy();
  }
  message(txt){ this.msg = { t:0 }; this.hudMsg.setText(txt).setAlpha(1); }

  // ── mort et réapparition ────────────────────────────────────
  majRecord(){
    const r = lireRecord();
    const m = Math.max(0, Math.round((this.joueur.x - 120) / 10));
    const n = { monstres: Math.max(r.monstres, this.vaincus), metres: Math.max(r.metres, m) };
    if (n.monstres !== r.monstres || n.metres !== r.metres) ecrireRecord(n);
    return n;
  }
  terminer(titre){
    this.etat = 'perdu';
    this.morts++;
    SON.jouer('mort');
    const r = this.majRecord();
    this.hudFin.setText(titre + '\n' + this.vaincus + ' monstres vaincus'
      + '\nrecord ' + r.monstres + '\n\n↑ ou un bouton pour repartir d\'ici');
  }
  // On ne relance pas la scène : le monde, les monstres déjà vaincus et
  // les caisses ouvertes restent en l'état. On repose seulement le joueur
  // au dernier endroit où il avait les pieds sur quelque chose de solide.
  reapparaitre(){
    this.etat = 'jeu';
    this.hudFin.setText('');
    this.pv = CFG.pvJoueur;
    this.invuln = CFG.invulnRenais;
    this.attaque = null;
    this.squash = 0;
    this.joueur.body.reset(this.checkpoint.x, this.checkpoint.y);
    this.cameras.main.centerOn(this.checkpoint.x, this.checkpoint.y);
    for (const m of this.monstres){
      if (Math.abs(m.go.x - this.checkpoint.x) < 160){
        const d = Math.sign(m.go.x - this.checkpoint.x) || 1;
        m.go.body.setVelocity(d * 280, m.def.vole ? 0 : -220);
        m.assomme = 0.6;
      }
    }
  }
  nouvellePartie(){
    GRAINE = (Math.random() * 1e9) | 0;
    afficherRecord();
    this.scene.restart();
  }

  // ── boucle ──────────────────────────────────────────────────
  update(temps, deltaMs){
    const dt = Math.min(0.033, deltaMs / 1000);
    const b = this.joueur.body;

    if (this.etat !== 'jeu'){
      if (ENTREE.validePresse){
        ENTREE.validePresse = false; ENTREE.sautPresse = false; ENTREE.coupPresse = null;
        ENTREE.hautPresse = false;
        if (this.etat === 'perdu') this.reapparaitre();
        else this.nouvellePartie();
        return;
      }
      ENTREE.coupPresse = null; ENTREE.hautPresse = false; ENTREE.sautPresse = false;
      this.majEclats(dt); this.dessinerTout(b);
      return;
    }
    ENTREE.validePresse = false;

    const auSol = b.blocked.down || b.touching.down;
    this.accroupi = ENTREE.accroupi && auSol;

    // la flèche du haut donne l'uppercut, le seul coup qui monte au-dessus de la tête
    if (ENTREE.hautPresse){ ENTREE.hautPresse = false; this.lancerAttaque('crochet'); }
    if (ENTREE.coupPresse){
      // le poing laisse la place à l'arme tant qu'il en reste des munitions
      if (ENTREE.coupPresse === 'poing' && this.arme) this.utiliserArme();
      else this.lancerAttaque(ENTREE.coupPresse);
      ENTREE.coupPresse = null;
    }

    if (this.attaque){
      const c = COUPS[this.attaque.type];
      this.attaque.t += dt;
      if (this.attaque.t >= c.debut && this.attaque.t <= c.fin){
        const zones = this.zonesAttaque();
        if (zones.length){
          for (const m of this.monstres){
            if (m.mort || this.attaque.touches.has(m)) continue;
            if (zones.some(z => Phaser.Geom.Intersects.RectangleToRectangle(z, m.go.getBounds()))){
              this.attaque.touches.add(m);
              this.frapper(m, c.degats, c.recul, this.attaque.bas, this.joueur.x);
            }
          }
          for (const k of this.caisses){
            if (k.casse || this.attaque.touches.has(k)) continue;
            if (zones.some(z => Phaser.Geom.Intersects.RectangleToRectangle(z, k.go.getBounds()))){
              this.attaque.touches.add(k);
              this.casser(k, c.degats);
            }
          }
        }
      }
      if (this.attaque.t >= c.duree) this.attaque = null;
    }

    // déplacement : le joystick est analogique, la vitesse suit son inclinaison
    const bloque = this.attaque && auSol && !COUPS[this.attaque.type].tir;
    const vMax = this.accroupi ? CFG.vitesseAccroupi : CFG.vitesseCourse;
    const cible = bloque ? 0 : ENTREE.axeX * vMax;
    if (Math.abs(ENTREE.axeX) > 0.05 && !bloque) this.sens = Math.sign(ENTREE.axeX);

    const a = (cible !== 0 ? CFG.accel : CFG.frein) * (auSol ? 1 : CFG.controleAir) * dt;
    const vx = b.velocity.x;
    b.setVelocityX(Math.abs(cible - vx) <= a ? cible : vx + Math.sign(cible - vx) * a);

    this.coyote = auSol ? CFG.coyote : Math.max(0, this.coyote - dt);
    if (ENTREE.sautPresse){ ENTREE.sautPresse = false; this.buffer = CFG.bufferSaut; }
    this.buffer = Math.max(0, this.buffer - dt);
    // accroupi, on ne saute pas : le joystick ne peut pas être en haut et en bas
    if (this.buffer > 0 && this.coyote > 0){
      b.setVelocityY(-CFG.vitesseSaut);
      this.coyote = 0; this.buffer = 0; this.squash = -1;
      SON.jouer('saut');
    }
    if (!ENTREE.saut && b.velocity.y < -CFG.coupureSaut) b.setVelocityY(-CFG.coupureSaut);

    if (auSol && !this.auSolAvant && this.vyAvant > 300) this.squash = 1;
    this.auSolAvant = auSol; this.vyAvant = b.velocity.y;
    this.squash += (0 - this.squash) * Math.min(1, dt * 12);
    if (auSol) this.phase += (Math.abs(b.velocity.x) * dt) / 27;
    this.invuln = Math.max(0, this.invuln - dt);

    // dernier sol foulé = point de réapparition
    if (auSol && Math.abs(b.velocity.y) < 40){
      this.checkpoint.x = this.joueur.x;
      this.checkpoint.y = this.joueur.y;
    }

    this.majMonstres(dt);
    this.majTirs(dt);

    for (const k of this.caisses) k.flash = Math.max(0, k.flash - dt);
    this.caisses = this.caisses.filter(k => !k.casse);

    for (const o of this.objets){
      o.phase += dt * 4;
      if (o.go.y > H + 200){ o.pris = true; o.go.destroy(); continue; }
      if (Phaser.Geom.Intersects.RectangleToRectangle(this.joueur.getBounds(), o.go.getBounds()))
        this.ramasser(o);
    }
    this.objets = this.objets.filter(o => !o.pris);

    if (this.msg){
      this.msg.t += dt;
      this.hudMsg.setAlpha(Math.max(0, 1 - this.msg.t / 2.2));
      if (this.msg.t > 2.2) this.msg = null;
    }

    if (this.joueur.y > H + 40) this.terminer('Tombé dans le vide');
    if (this.joueur.x > this.finX){
      this.etat = 'gagne';
      SON.jouer('gagne');
      const r = this.majRecord();
      this.hudFin.setText('Zone franchie\n' + this.vaincus + ' monstres vaincus'
        + '\nrecord ' + r.monstres + '\n\n↑ pour un nouveau niveau');
    }

    this.majEclats(dt);
    this.dessinerTout(b);
  }

  majMonstres(dt){
    this.monstres = this.monstres.filter(m => !m.mort);
    for (const m of this.monstres){
      m.flash  = Math.max(0, m.flash - dt);
      m.blinde = Math.max(0, m.blinde - dt);
      m.phase += dt * 5;
      if (m.assomme > 0) m.assomme -= dt;
      else {
        const dx = this.joueur.x - m.go.x;
        const memeNiveau = Math.abs(this.joueur.y - m.go.y) < 110;
        let v;
        if (Math.abs(dx) < 340 && memeNiveau) v = Math.sign(dx) * m.def.vitesse;
        else {
          if (m.go.x < m.minX) m.dir = 1;
          if (m.go.x > m.maxX) m.dir = -1;
          v = m.dir * m.def.patrouille;
        }
        if ((m.go.x <= m.minX && v < 0) || (m.go.x >= m.maxX && v > 0)) v = 0;
        m.go.body.setVelocityX(v);
        // le drone ne tombe pas : il revient toujours à sa hauteur de vol
        if (m.def.vole){
          const vise = m.baseY + Math.sin(m.phase * 0.7) * 7;
          m.go.body.setVelocityY((vise - m.go.y) * 4);
        }
      }
      if (Phaser.Geom.Intersects.RectangleToRectangle(this.joueur.getBounds(), m.go.getBounds()))
        this.blesser(m.go.x, m.def.degats);
      if (m.go.y > H + 200){ m.mort = true; m.go.destroy(); }
    }
  }

  majTirs(dt){
    for (const t of this.tirs){
      t.vie -= dt;
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      if (t.vie <= 0){ t.fini = true; continue; }
      const boite = new Phaser.Geom.Rectangle(t.x - 5, t.y - 3, 10, 6);
      for (const m of this.monstres){
        if (m.mort) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, m.go.getBounds())){
          this.frapper(m, t.degats, t.recul, t.bas, t.x - t.vx * 0.01);
          t.fini = true; break;
        }
      }
      if (t.fini) continue;
      for (const k of this.caisses){
        if (k.casse) continue;
        if (Phaser.Geom.Intersects.RectangleToRectangle(boite, k.go.getBounds())){
          this.casser(k, t.degats);
          t.fini = true; break;
        }
      }
    }
    this.tirs = this.tirs.filter(t => !t.fini);
  }

  majEclats(dt){
    for (const e of this.eclats){ e.vie -= dt; e.vy += 900*dt; e.x += e.vx*dt; e.y += e.vy*dt; }
    this.eclats = this.eclats.filter(e => e.vie > 0);
  }

  // ── rendu ───────────────────────────────────────────────────
  dessinerTout(b){
    this.dessinerFond(this.cameras.main.scrollX);
    this.dessinerCaisses();
    this.dessinerMonstres();
    this.dessinerObjets();
    this.dessinerPerso(b);
    this.dessinerEclats();
    this.dessinerTirs();
    this.dessinerHud();
  }
  dessinerHud(){
    const g = this.hud; g.clear();
    for (let i = 0; i < CFG.pvJoueur; i++){
      g.fillStyle(i < this.pv ? 0xe2584d : 0x2a3355, 1);
      const x = 26 + i*26, y = 32;
      g.fillCircle(x-5, y-3, 6); g.fillCircle(x+5, y-3, 6);
      g.fillTriangle(x-11, y, x+11, y, x, y+12);
    }
    let t = 'MONSTRES ' + this.vaincus;
    if (this.arme) t += '   ' + ARMES[this.arme].nom + ' ' + this.munitions;
    if (this.accroupi) t += '   ACCROUPI';
    if (this.morts > 0) t += '   K.O. ' + this.morts;
    this.hudTexte.setText(t);
  }
  dessinerEclats(){
    const g = this.gEclats; g.clear();
    for (const e of this.eclats){
      const k = Math.max(0, e.vie / e.max);
      g.fillStyle(e.couleur, k);
      g.fillRect(e.x-2, e.y-2, 3 + k*2, 3 + k*2);
    }
  }
  dessinerTirs(){
    const g = this.gTirs; g.clear();
    // le laser est un trait instantané, pas un projectile
    if (this.attaque && COUPS[this.attaque.type].faisceau){
      const c = COUPS[this.attaque.type];
      const k = 1 - Phaser.Math.Clamp(this.attaque.t / c.duree, 0, 1);
      const y  = this.joueur.y + PIEDS + c.dy + (this.attaque.bas ? DECALAGE_ACCROUPI : 0);
      const x0 = this.joueur.x + this.sens * 12;
      const x1 = this.joueur.x + this.sens * (14 + c.portee);
      const g0 = Math.min(x0, x1), w = Math.abs(x1 - x0);
      g.fillStyle(0xc46bff, 0.18 * k);  g.fillRect(g0, y - 12*k, w, 24*k);
      g.fillStyle(0xe9b6ff, 0.55 * k);  g.fillRect(g0, y -  5*k, w, 10*k);
      g.fillStyle(0xffffff, 0.9 * k);   g.fillRect(g0, y -  2*k, w,  4*k);
      g.fillStyle(0xffffff, k); g.fillCircle(x0, y, 7*k);
    }
    for (const t of this.tirs){
      g.fillStyle(t.couleur, 0.25); g.fillCircle(t.x, t.y, 7);
      g.fillStyle(t.couleur, 1);    g.fillRect(t.x - 5, t.y - 2, 10, 4);
      g.fillStyle(0xffffff, 0.9);   g.fillRect(t.x - 2, t.y - 1, 4, 2);
    }
  }
  dessinerFond(sx){
    const g = this.fond; g.clear();
    const u = this.urbain(sx + L/2);
    const haut = this.melange(0x0d1120, 0x150d24, u);
    const bas  = this.melange(0x2a2350, 0x5b2a4a, u);
    g.fillGradientStyle(haut, haut, bas, bas, 1);
    g.fillRect(0, 0, L, SOL_Y);
    g.fillStyle(0xffb347, 0.14 - 0.07*u); g.fillCircle(730, 140, 70);
    if (u < 1) this.collines(g, sx*0.12, 0x1d2547, 42, 250, 1 - u);
    this.pylones(g, sx*0.35, this.melange(0x151c38, 0x1a1230, u));
    if (u > 0) this.ville(g, sx*0.45, u);
    if (u < 1) this.collines(g, sx*0.55, 0x111730, 26, 320, 1 - u);
  }
  collines(g, off, couleur, amp, base, alpha){
    const pts = [{x:0,y:H}];
    for (let x = 0; x <= L; x += 8){
      const wx = x + off;
      pts.push({ x, y: base + Math.sin(wx*0.0035)*amp + Math.sin(wx*0.011)*amp*0.35 });
    }
    pts.push({x:L,y:H});
    g.fillStyle(couleur, alpha); g.fillPoints(pts, true);
  }
  pylones(g, off, couleur){
    const pas = 165, debut = Math.floor(off/pas) - 1;
    g.fillStyle(couleur, 1);
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const h = 70 + Math.abs(Math.sin(i*12.9898))*95;
      const w = 30 + Math.abs(Math.cos(i*4.1414))*24;
      g.fillRect(i*pas - off, SOL_Y - h, w, h);
    }
  }
  // immeubles à fenêtres allumées : c'est ce qui fait basculer le décor en ville
  ville(g, off, t){
    const pas = 128, debut = Math.floor(off/pas) - 1;
    for (let i = debut; i < debut + Math.ceil(L/pas) + 3; i++){
      const h = 120 + Math.abs(Math.sin(i*7.13))*185;
      const w =  66 + Math.abs(Math.cos(i*3.71))*44;
      const x = i*pas - off, y = SOL_Y - h;
      g.fillStyle(0x1b1430, t); g.fillRect(x, y, w, h);
      g.fillStyle(0x2a1c46, t); g.fillRect(x, y, w, 5);
      for (let fy = y + 14; fy < SOL_Y - 18; fy += 24){
        for (let fx = x + 10; fx < x + w - 13; fx += 20){
          const r = Math.abs(Math.sin(fx*0.37 + fy*0.71 + i*5.1));
          if (r < 0.45) continue;
          g.fillStyle(r > 0.86 ? 0xffd98a : 0xf2a34a, t * (0.3 + r*0.5));
          g.fillRect(fx, fy, 8, 10);
        }
      }
    }
  }
  dessinerCaisses(){
    const g = this.gCaisses; g.clear();
    for (const k of this.caisses){
      const x = k.go.x, y = k.go.y, clair = k.flash > 0;
      g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+16, 30, 6);
      g.fillStyle(clair ? 0xffffff : COUL.bois, 1);       g.fillRect(x-15, y-15, 30, 30);
      g.fillStyle(clair ? 0xffffff : COUL.boisClair, 1);  g.fillRect(x-11, y-11, 22, 22);
      g.lineStyle(3, clair ? 0xffffff : COUL.boisOmbre, 1);
      g.beginPath(); g.moveTo(x-11, y-11); g.lineTo(x+11, y+11); g.strokePath();
      g.beginPath(); g.moveTo(x+11, y-11); g.lineTo(x-11, y+11); g.strokePath();
    }
  }
  dessinerObjets(){
    const g = this.gObjets; g.clear();
    for (const o of this.objets){
      const x = o.go.x, y = o.go.y + Math.sin(o.phase)*2.5;
      if (o.type === 'coeur'){
        g.fillStyle(0xe2584d, 0.18); g.fillCircle(x, y, 15);
        g.fillStyle(0xe2584d, 1);
        g.fillCircle(x-4, y-3, 5); g.fillCircle(x+4, y-3, 5);
        g.fillTriangle(x-9, y, x+9, y, x, y+10);
        g.fillStyle(0xff9d9d, 0.85); g.fillCircle(x-4, y-5, 1.8);
      } else {
        const a = ARMES[o.type];
        g.fillStyle(a.couleur, 0.2); g.fillCircle(x, y, 16);
        g.lineStyle(5, a.couleur, 1); g.strokeCircle(x, y, 8);
        g.lineStyle(2, a.clair, 1);   g.strokeCircle(x, y, 8);
        g.fillStyle(0xffffff, 0.9);   g.fillCircle(x, y - 8, 2.6);
      }
    }
  }
  dessinerMonstres(){
    const g = this.gMonstres; g.clear();
    for (const m of this.monstres){
      if (m.type === 'drone') this.dessinerDrone(g, m);
      else this.dessinerBrute(g, m);
      // barre de vie commune
      if (m.pv < m.pvMax){
        const x = m.go.x, y = m.go.y - m.def.taille[1]/2 - 12;
        g.fillStyle(0x2a3355, 1); g.fillRect(x-13, y, 26, 4);
        g.fillStyle(0xe2584d, 1); g.fillRect(x-13, y, 26 * (m.pv/m.pvMax), 4);
      }
    }
  }
  // baveux et colosse partagent la même silhouette, à l'échelle près
  dessinerBrute(g, m){
    const gros = m.type === 'colosse';
    const e = gros ? 1.45 : 1;
    const x = m.go.x, y = m.go.y + m.def.taille[1]/2;
    const dandine = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const corps = eclaire || (gros ? COUL.colosse : COUL.baveux);
    const ombre = eclaire || (gros ? COUL.colosseOmbre : COUL.baveuxOmbre);
    g.fillStyle(0x000000, 0.25); g.fillEllipse(x, y+1, 26*e, 6*e);
    g.fillStyle(ombre, 1);
    g.fillEllipse(x-6*e, y-3*e, 8*e, 8*e); g.fillEllipse(x+6*e, y-3*e, 8*e, 8*e);
    g.fillStyle(corps, 1);
    g.fillEllipse(x, y-15*e+dandine, 26*e, 26*e);
    g.fillTriangle(x-11*e, y-22*e+dandine, x-5*e, y-34*e+dandine, x-2*e, y-21*e+dandine);
    g.fillTriangle(x+11*e, y-22*e+dandine, x+5*e, y-34*e+dandine, x+2*e, y-21*e+dandine);
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(gros ? COUL.colosseOeil : COUL.baveuxOeil, 1);
    g.fillCircle(x + vers*3 - 4*e, y-17*e+dandine, 3*e);
    g.fillCircle(x + vers*3 + 4*e, y-17*e+dandine, 3*e);
    g.fillStyle(0x1a0f22, 1);
    g.fillCircle(x + vers*4 - 4*e, y-17*e+dandine, 1.4*e);
    g.fillCircle(x + vers*4 + 4*e, y-17*e+dandine, 1.4*e);
  }
  dessinerDrone(g, m){
    const x = m.go.x, y = m.go.y;
    const flotte = Math.sin(m.phase) * 2;
    const eclaire = m.flash > 0 ? 0xffffff : (m.blinde > 0 ? COUL.blinde : null);
    const corps = eclaire || COUL.drone;
    // ombre portée au sol, très étalée : on voit qu'il vole
    g.fillStyle(0x000000, 0.18); g.fillEllipse(x, SOL_Y - 3, 26, 5);
    g.fillStyle(eclaire || COUL.droneOmbre, 1);
    g.fillRoundedRect(x-15, y-4+flotte, 30, 9, 4);
    g.fillStyle(corps, 1);
    g.fillRoundedRect(x-13, y-13+flotte, 26, 20, 7);
    // visière
    const vers = Math.sign(this.joueur.x - x) || 1;
    g.fillStyle(0x11142a, 1); g.fillRoundedRect(x-9, y-9+flotte, 18, 7, 3);
    g.fillStyle(COUL.droneOeil, 1); g.fillRect(x - 3 + vers*3, y-8+flotte, 7, 3);
    // hélices : deux traits qui battent
    const bat = Math.sin(m.phase * 6) * 5;
    g.lineStyle(2, eclaire || COUL.droneOmbre, 0.9);
    g.beginPath(); g.moveTo(x-16-bat, y-15+flotte); g.lineTo(x-6+bat, y-15+flotte); g.strokePath();
    g.beginPath(); g.moveTo(x+6-bat, y-15+flotte); g.lineTo(x+16+bat, y-15+flotte); g.strokePath();
  }
  dessinerPerso(b){
    const g = this.perso; g.clear();
    const auSol = b.blocked.down || b.touching.down;
    const t = this.phase;
    const marche = Math.abs(b.velocity.x) > 20;
    let pieds, mains, inclinaison = -0.03;
    // allure : 0 à l'arrêt, 1 joystick à fond. Toute l'animation de course
    // en découle, il n'y a pas deux poses distinctes marche et course.
    const allure = Math.min(1, Math.abs(b.velocity.x) / CFG.vitesseCourse);
    const rampe = this.accroupi && marche;
    // accroupi le corps descend ; en courant il rebondit à chaque foulée
    let tasse = this.accroupi ? (rampe ? 13 : 9) : 0;
    if (!this.accroupi && auSol && marche) tasse -= Math.abs(Math.sin(t)) * allure * 2.5;

    if (this.attaque){
      const c = COUPS[this.attaque.type];
      const p = Phaser.Math.Clamp(this.attaque.t / c.duree, 0, 1);
      const ext = Math.sin(Math.PI * Math.min(1, p * 1.2));
      if (this.attaque.type === 'poing'){
        mains = [[-6 - ext*3, EPAULE + 9], [4 + ext*22, EPAULE + 2 - ext*3]];
        pieds = [[-9 - ext*2, 0], [7 + ext*2, 0]];
        inclinaison = -0.05 - ext*0.06;
      } else if (this.attaque.type === 'pied'){
        mains = [[-10 - ext*5, EPAULE + 2], [2 - ext*4, EPAULE + 11]];
        pieds = [[-6, 0], [6 + ext*26, -6 - ext*14]];
        inclinaison = 0.04 + ext*0.12;
      } else if (this.attaque.type === 'crochet'){
        // uppercut : le bras ne peut pas dépasser le sommet du crâne, sa
        // longueur l'en empêche. C'est le corps qui se soulève avec le coup
        // pour que le geste se lise.
        mains = [[-7 + ext*2, EPAULE + 12], [5 + ext*3, EPAULE - 4 - ext*22]];
        pieds = [[-8, 0], [7, -ext*3]];
        inclinaison = 0.02 - ext*0.10;
        tasse -= ext * 4;
      } else if (c.faisceau || c.tir){
        // bras tendu, arme en avant
        mains = [[-8 + ext*2, EPAULE + 8], [11 + ext*12, EPAULE + 6]];
        pieds = [[-9, 0], [8, 0]];
        inclinaison = -0.04 - ext*0.03;
      } else {
        // coup retourné : la jambe balaie de l'arrière vers l'avant
        const balai = -1 + 2*p;
        mains = [[-12*balai, EPAULE + 4], [12*balai, EPAULE + 6]];
        pieds = [[-4, 0], [balai*30, -14 - Math.sin(Math.PI*p)*8]];
        inclinaison = -0.10 + p*0.20;
      }
    } else if (!auSol){
      pieds = b.velocity.y < 0 ? [[-7,-3],[7,-9]] : [[-8,-7],[9,-1]];
      mains = b.velocity.y < 0 ? [[-6,EPAULE+7],[8,EPAULE-9]] : [[-9,EPAULE-5],[8,EPAULE+5]];
    } else if (rampe){
      // ramper : le buste bascule à l'horizontale, bras et jambes alternent
      pieds = []; mains = [];
      for (const dec of [Math.PI, 0]){
        const p = t * 2.2 + dec;
        pieds.push([-11 + Math.cos(p)*5, 0]);
        mains.push([2 + Math.cos(p)*9, EPAULE + 20 - Math.max(0, Math.sin(p))*3]);
      }
      inclinaison = -0.34;
    } else if (this.accroupi){
      pieds = [[-10, 0], [9, 0]];
      mains = [[-8, EPAULE + 15], [9, EPAULE + 14]];
      inclinaison = -0.10;
    } else if (marche){
      // plus on va vite, plus la foulée s'allonge, le genou monte,
      // les bras pompent et le buste se penche en avant
      const foulee = 7 + allure * 7;
      const genou  = 6 + allure * 13;
      const bras   = 6 + allure * 7;
      pieds = []; mains = [];
      for (const dec of [Math.PI, 0]){
        const p = t + dec;
        pieds.push([-Math.cos(p)*foulee, Math.sin(p) > 0 ? -Math.sin(p)*genou : 0]);
        mains.push([Math.cos(p)*bras, EPAULE + 13 - Math.max(0, Math.sin(p))*(3 + allure*7)]);
      }
      inclinaison = -0.05 - allure*0.12;
    } else {
      const souffle = Math.sin(this.time.now / 420) * 1.2;
      pieds = [[-6, 0], [6, 0]];
      mains = [[-7, EPAULE + 11 + souffle], [8, EPAULE + 9 + souffle]];
    }

    const EP = EPAULE + tasse, HA = HANCHE + tasse, TE = TETE + tasse;
    const my = i => mains[i][1] + tasse;

    if (auSol){ g.fillStyle(0x000000, 0.28); g.fillEllipse(0, 1, 28, 7); }

    this.membre(g, -1, EP, mains[0][0], my(0), 8, 8, 1, COUL.giOmbre, COUL.peauOmbre, 7, 5);
    this.membre(g, -1, HA, pieds[0][0], pieds[0][1], 9.5, 9.5, -1, COUL.giOmbre, COUL.giOmbre, 8.5, 7);
    g.fillStyle(0x171d33, 1); g.fillEllipse(pieds[0][0]+1, pieds[0][1]-1.5, 10, 6);

    g.fillStyle(COUL.gi, 1);
    g.fillPoints([{x:-7,y:EP},{x:7,y:EP},{x:6,y:HA+1},{x:-6,y:HA+1}], true);
    g.lineStyle(2.4, COUL.col, 1);
    g.beginPath(); g.moveTo(-3, EP-1); g.lineTo(2, EP+8); g.strokePath();
    g.beginPath(); g.moveTo(5, EP-1); g.lineTo(2, EP+8); g.strokePath();
    g.fillStyle(COUL.ceinture, 1);
    g.fillRect(-7, HA-3, 14, 4);
    g.fillRect(-7.5, HA-3, 3, 8);

    this.membre(g, 1, HA, pieds[1][0], pieds[1][1], 9.5, 9.5, -1, COUL.gi, COUL.gi, 9, 7.5);
    g.fillStyle(COUL.botte, 1); g.fillEllipse(pieds[1][0]+1, pieds[1][1]-1.5, 11, 6.4);
    this.membre(g, 1, EP, mains[1][0], my(1), 8, 8, 1, COUL.gi, COUL.peau, 7.5, 5.5);
    // l'arme se voit dans la main dès qu'on en a une
    if (this.arme){
      const a = ARMES[this.arme];
      g.fillStyle(a.couleur, 1); g.fillCircle(mains[1][0], my(1), 4.4);
      g.fillStyle(a.clair, 1);   g.fillCircle(mains[1][0], my(1), 2.2);
    } else {
      g.fillStyle(COUL.ceinture, 1); g.fillCircle(mains[1][0], my(1), 2.6);
    }

    const hx = 1, hy = TE;
    g.fillStyle(COUL.cheveux, 1);
    const pointes = [[-7,3],[-9,-3],[-13,-7],[-7,-6],[-10,-13],[-3,-8],[0,-15],[3,-7],[9,-11],[6,-3],[10,-4],[7,1]];
    g.fillPoints(pointes.map(p => ({ x: hx + p[0], y: hy + p[1] })), true);
    g.fillStyle(COUL.peau, 1); g.fillCircle(hx+1, hy, 5.6);
    g.fillStyle(COUL.cheveux, 1);
    g.fillEllipse(hx+0.5, hy-4.6, 11.6, 5);
    g.fillRect(hx+2.5, hy-1.6, 2, 2.6);

    g.setPosition(this.joueur.x, this.joueur.y + PIEDS);
    g.setRotation(this.sens * inclinaison);
    g.setScale(this.sens * (1 + this.squash*0.22), 1 - this.squash*0.22);
    g.setAlpha(this.invuln > 0 && Math.floor(this.invuln*20) % 2 === 0 ? 0.35 : 1);
  }
  membre(g, hx, hy, tx, ty, l1, l2, sens, c1, c2, e1, e2){
    const dx = tx-hx, dy = ty-hy;
    const d = Math.min(Math.hypot(dx, dy), l1+l2-0.001) || 0.001;
    const a = Math.atan2(dy, dx);
    const c = (d*d + l1*l1 - l2*l2) / (2*d*l1);
    const ang = a + sens*Math.acos(Math.max(-1, Math.min(1, c)));
    const kx = hx + Math.cos(ang)*l1, ky = hy + Math.sin(ang)*l1;
    g.lineStyle(e1, c1, 1);
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.strokePath();
    g.lineStyle(e2, c2, 1);
    g.beginPath(); g.moveTo(kx, ky); g.lineTo(tx, ty); g.strokePath();
    g.fillStyle(c1, 1); g.fillCircle(hx, hy, e1/2); g.fillCircle(kx, ky, e1/2);
    g.fillStyle(c2, 1); g.fillCircle(tx, ty, e2/2);
  }
}

// ─────────────────────────────────────────────────────────────
// ÉCRAN-TITRE
// Le jeu n'est construit qu'au moment où on appuie : rien ne tourne
// derrière le titre, et la première image affichée est déjà jouable.
// ─────────────────────────────────────────────────────────────
let partie = null;

function demarrer(){
  if (partie || typeof Phaser === 'undefined') return;
  document.body.classList.add('enjeu');
  SON.demarrer();   // iOS n'ouvre l'audio que dans un geste utilisateur
  ENTREE.axeX = 0; ENTREE.saut = false; ENTREE.sautPresse = false;
  ENTREE.accroupi = false; ENTREE.coupPresse = null;
  ENTREE.haut = false; ENTREE.hautPresse = false; ENTREE.validePresse = false;

  partie = new Phaser.Game({
    type: Phaser.AUTO,
    width: L, height: H,
    parent: 'conteneur',
    backgroundColor: '#0d1120',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default:'arcade', arcade: { gravity:{ y: CFG.gravite }, debug:false } },
    scene: Combat,
  });
  // accessible depuis la console du navigateur pour régler le jeu à chaud :
  // jeu.scene.getScene('combat').munitions = 99
  window.jeu = partie;

  // iOS ne recalcule pas toujours la taille du parent tout de suite après
  // une rotation : on force un rafraîchissement peu après l'événement.
  const rafraichir = () => setTimeout(() => partie.scale.refresh(), 120);
  addEventListener('orientationchange', rafraichir);
  addEventListener('resize', rafraichir);
}

if (typeof Phaser !== 'undefined'){
  document.getElementById('titre').addEventListener('pointerdown', e => {
    e.preventDefault(); demarrer();
  });
  addEventListener('keydown', e => {
    if (!partie && (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')){
      e.preventDefault(); demarrer();
    }
  });
}
